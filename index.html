      </section>

      <div class="stats stack-lg">
        ${C.stat(pad(total), 'Total stamps', null, 'lead')}
        ${C.stat(pad(attended), 'Meetings attended', pad(held.length))}
        ${C.stat(pad(Store.rewardsUnlocked()), 'Rewards unlocked', pad(Store.rewards.length))}
        ${C.stat(Store.attendanceRate() + '%', 'Attendance rate')}
      </div>

      <section class="rig rig--bl stack-xl" data-enter>
        <span class="rig__ghost rig__ghost--l" data-layer aria-hidden="true"></span>
        <div class="panel panel--flat" data-rank="quiet">
          <h2 class="h2">Milestones</h2>
          <ol class="ledger">
            ${Store.rewards.map(r => {
              const open = total >= r.required;
              const state = r.claimed ? 'Claimed' : open ? 'Ready' : 'Sealed';
              return `<li class="ledger__row ledger__row--${state.toLowerCase()}">

    </div>`;
  },

  /* ── AUTH ────────────────────────────────────────────────────────
     Composed from the same parts as every other spread: a chapter
     nameplate, one lead panel, screentone behind the figure. It is a
     manga page that happens to contain two fields, not a login box
     dropped into a manga site. */
  auth(){

    const up = mode === 'up';
    return `<div class="view view--auth">
      <span class="rake" aria-hidden="true"></span>
      ${C.bleed(up ? 'Join' : 'Enter', 'top:-6px;right:-8vw', 'bleed--fill')}

      <div class="authmark" data-enter>
        <span class="chop chop--filled" aria-hidden="true">
          <svg viewBox="0 0 100 100" class="chop__key">${KEY}</svg>
        </span>
        <span class="authmark__wm">
          <b>KEY</b>STAMP

        </span>
      </div>

      ${C.head(up ? 'New member' : 'Key Club',
               up ? 'Join' : 'Sign in',
               up ? '登録' : '入場')}

      <section class="rig" data-enter>
        <span class="rig__ghost" data-layer aria-hidden="true"></span>
        <form class="panel authp" id="authForm" novalidate>
          <span class="panel__rule" data-layer aria-hidden="true"></span>

          <div class="field authp__f">
            <label class="kicker" for="authUser">Username</label>
            <input class="input" id="authUser" name="username" type="text"
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   inputmode="latin" maxlength="${Config.USERNAME_MAX}"
                   placeholder="${up ? 'letters, numbers, _ and .' : 'your username'}">
          </div>

          <div class="field authp__f">
            <label class="kicker" for="authPass">Password</label>
            <input class="input" id="authPass" name="password" type="password"

                   placeholder="${up ? 'at least 8 characters' : ''}">
          </div>

          ${up ? `<div class="field authp__f">
            <label class="kicker" for="authPass2">Confirm password</label>
            <input class="input" id="authPass2" name="confirm" type="password"
                   autocomplete="new-password">
          </div>` : ''}

          <p class="authp__err" id="authErr" role="alert" aria-live="assertive" hidden></p>

          <div class="authp__act">
            <button class="btn btn--go" type="submit" id="authGo">
              ${up ? 'Create account' : 'Sign in'}
            </button>
            <button class="link" type="button" id="authSwap">
              ${up ? 'I already have an account' : 'Create an account'}
            </button>
          </div>

          ${AuthUI.setupNotice()}
        </form>
      </section>
    </div>`;
  },
};
</script>
<script>
/* ── js/03b-board.js ── */
"use strict";
/* ══════════════════════════════════════════════════════════════════
   BOARD UI — the club information hub

   The board account is not an administrator looking at tables. It is an
   officer looking at their own club: what Keystamp is, when the next
   General Meeting is, how many people are coming, how far the club has
   got toward the milestones, and the one operational thing they still
   need — opening check-in.

   State and rendering for the board spread. Kept in its own file so
   the shared view/router files stay small and targeted — the last
   phase lost a whole block of delegated handlers to a careless splice
   in 06-app.js, and this is the change that would have been most
   tempting to make there.

   Nothing here talks to Supabase. Every read goes through
   Backend.board(), which is the board-only Edge Function, so a member
   who calls the same code gets a 403 rather than data. Nothing here
   writes a stamp: there is deliberately no control anywhere in this
   file that adds, edits or removes attendance. Stamps are evidence of
   having been in the MPR, and a button that grants one would make the
   whole scanner theatre.
   ══════════════════════════════════════════════════════════════════ */

const BoardUI = {
  tab: 'club',
  loading: false,
  error: null,

  overview: null,
  meetings: null,
  members: null,
  memberDetail: null,
  meetingDetail: null,

  q: '',
  sort: 'username',
  page: 1,
  confirmDelete: null,      /* meeting id awaiting confirmation */
  deleteNote: null,         /* why the last delete did not happen */

  /* one message per failure code — never a database string */
  message(code){
    return ({
      NOT_AUTHENTICATED: 'Sign in again to continue.',
      NOT_AUTHORIZED:    'This account is not a board account.',
      MEMBER_NOT_FOUND:  'That member no longer exists.',
      MEETING_NOT_FOUND: 'That meeting no longer exists.',
      DUPLICATE_NUMBER:  'A meeting with that number already exists.',
      HAS_ATTENDANCE:    'Members have checked in to this meeting, so it cannot be deleted.',
      SERVER_ERROR:      'Keystamp could not reach the club records. Try again.',
    })[code] || 'Something went wrong. Try again.';
  },

  /* every pane renders through here, so loading and failure look the
     same everywhere instead of each section inventing its own */
  pane(){
    if (this.loading) return this.skeleton();
    if (this.error)   return this.failure(this.error);
    if (this.memberDetail)  return this.memberPane();
    if (this.meetingDetail) return this.meetingPane();
    if (this.tab === 'club')     return this.clubPane();
    if (this.tab === 'meetings') return this.meetingsPane();
    if (this.tab === 'progress') return this.progressPane();
    return this.sessionPane();
  },

  skeleton(){
    return `<div class="panel bpanel bpanel--wait" aria-busy="true">
      <p class="kicker">Loading</p>
    </div>`;
  },

  failure(code){
    return `<div class="panel bpanel">
      <p class="kicker">Could not load</p>
      <p style="margin-top:8px">${esc(this.message(code))}</p>
      <button class="btn btn--go" data-breload style="margin-top:var(--s4)">Try again</button>
    </div>`;
  },

  empty(text){
    return `<p class="muted bempty">${esc(text)}</p>`;
  },

  /* ── CLUB ─────────────────────────────────────────────────────
     The landing view. First thing an officer sees is what the club is
     and when it next meets — not a row of database totals. */
  clubPane(){
    const o = this.overview || {};
    const active = o.active_meeting;
    const next = o.next_meeting;
    // the meeting worth showing is the one taking check-ins, else the
    // next one on the calendar
    const focus = active || next;
    const isLive = Boolean(active);

    return `<div class="panel bpanel">
      <h2 class="h2 bsec" style="margin-top:0">${isLive ? 'Happening now' : 'Next General Meeting'}</h2>
      ${focus ? `
        <div class="bnext ${isLive ? 'bnext--live' : ''}">
          <p class="bactive__no">GM ${pad(focus.meeting_number)}</p>
          <p class="muted">${esc(fmtDay(focus.meeting_date))} · ${esc(focus.start_time)}${
            focus.end_time ? '–' + esc(focus.end_time) : ''} · MPR</p>
          <p class="bnext__state">
            <span class="bstate bstate--${isLive ? 'open' : 'upcoming'}">${
              isLive ? 'CHECK-IN OPEN' : 'CHECK-IN CLOSED'}</span>
            ${isLive ? `<span class="muted">${o.today_attendance} checked in so far</span>` : ''}
          </p>
          <button class="btn ${isLive ? '' : 'btn--go'}" data-btab="session"
            style="margin-top:var(--s4)">${isLive ? 'Show the code' : 'Open check-in'}</button>
        </div>`
        : `<div class="bnext">
             <p class="bactive__no bactive__no--off">None</p>
             <p class="muted">No General Meeting is on the calendar yet.</p>
             <button class="btn" data-btab="meetings" style="margin-top:var(--s4)">Add one</button>
           </div>`}

      <h2 class="h2 bsec">The club, in numbers</h2>
      <div class="bstats">
        ${this.stat(o.meetings_held, 'General Meetings held')}
        ${this.stat(o.total_seals, 'Stamps earned')}
        ${this.stat(o.participating_members, 'Members who have checked in')}
        ${this.stat(o.average_attendance === null || o.average_attendance === undefined
            ? '—' : o.average_attendance, 'Average per meeting')}
      </div>
    </div>`;
  },

  stat(value, label){
    return `<div class="bstat">
      <b>${value === null || value === undefined ? '—' : esc(String(value))}</b>
      <span>${esc(label)}</span>
    </div>`;
  },

  /* ── PROGRESS ─────────────────────────────────────────────────
     How far the club has got toward the three milestones, then the
     roster. Read-only throughout: there is no control here that grants,
     edits or removes a stamp. */
  progressPane(){
    const o = this.overview || {};
    const ms = o.milestones || {};
    const reached = [
      { n:10, key:'m10', name:'Club Merch' },
      { n:20, key:'m20', name:'Free Blindbox' },
      { n:30, key:'m30', name:'???' },
    ];
    const participating = o.participating_members;

    return `<div class="panel bpanel">
      <h2 class="h2 bsec" style="margin-top:0">Milestones</h2>
      <ul class="blist bmiles">
        ${reached.map(r => {
          const count = ms[r.key];
          const known = typeof count === 'number' && typeof participating === 'number';
          // the bar is share of members who have ever checked in, not of
          // every account — an account that has never come is not
          // "behind" on a milestone, it has not started
          const pct = known && participating > 0
            ? Math.round((count / participating) * 100) : 0;
          return `<li class="bmile">
            <span class="bmile__no">${r.n}</span>
            <span class="bmile__mid">
              <b>${esc(r.name)}</b>
              <span class="muted">${known
                ? `${count} member${count === 1 ? '' : 's'} reached ${r.n} stamps`
                : 'Not available'}</span>
              <span class="bmile__bar" role="img"
                aria-label="${known ? `${pct} percent of checked-in members` : 'unavailable'}">
                <span class="bmile__fill" style="width:${pct}%"></span></span>
            </span>
          </li>`;
        }).join('')}
      </ul>
      <h2 class="h2 bsec">Roster</h2>
      ${this.rosterBody()}
    </div>`;
  },

  /* ── MEETINGS ─────────────────────────────────────────────────── */
  meetingsPane(){
    const list = (this.meetings && this.meetings.meetings) || [];
    const upcoming = list.filter(m => m.state === 'UPCOMING');
    const past = list.filter(m => m.state !== 'UPCOMING');

    return `<div class="panel bpanel">
      ${this.deleteNote ? `<p class="authp__err" role="alert">${esc(this.message(this.deleteNote))}</p>` : ''}
      ${this.createForm()}

      <h2 class="h2 bsec">Coming up</h2>
      ${upcoming.length
        ? `<ul class="blist">${upcoming.map(m => this.meetingRow(m)).join('')}</ul>`
        : this.empty('No upcoming meetings.')}

      <h2 class="h2 bsec">Already held</h2>
      ${past.length
        ? `<ul class="blist">${past.map(m => this.meetingRow(m)).join('')}</ul>`
        : this.empty('No meetings yet.')}
    </div>`;
  },

  /* state is carried by weight and rule, not by a coloured pill */
  meetingRow(m){
    if (this.confirmDelete === m.id) return `<li class="brow brow--confirm">
      <span class="brow__mid">
        <b>Delete GM ${pad(m.meeting_number)}?</b>
        <span class="muted">This permanently removes this meeting.</span>
      </span>
      <span class="bconfirm">
        <button class="btn" data-bcancel>Cancel</button>
        <button class="btn btn--go" data-bdelete="${esc(m.id)}">Delete</button>
      </span>
    </li>`;

    return `<li class="brow">
      <span class="brow__no" data-bmeeting="${esc(m.id)}" role="button" tabindex="0">GM ${pad(m.meeting_number)}</span>
      <span class="brow__mid" data-bmeeting="${esc(m.id)}" role="button" tabindex="0">
        <b>${esc(fmtDay(m.meeting_date))}</b>
        <span class="muted">${esc(m.start_time)}${m.end_time ? '–' + esc(m.end_time) : ''} · ${esc(m.location || 'MPR')}</span>
      </span>
      <span class="bstate bstate--${m.state.toLowerCase()}">${m.state}</span>
      <span class="brow__n">${m.attendance_count}</span>
      ${m.attendance_count === 0
        ? `<button class="brow__del" data-bconfirm="${esc(m.id)}"
             aria-label="Delete GM ${pad(m.meeting_number)}">Delete</button>`
        : '<span class="brow__del brow__del--off" aria-hidden="true"></span>'}
    </li>`;
  },

  createForm(){
    const f = this.form || {};
    return `<form class="bform" id="meetingForm">
      <h2 class="h2 bsec" style="margin-top:0">Schedule a General Meeting</h2>

      <div class="bform__grid">
        <label class="field"><span class="kicker">Meeting number</span>
          <input class="input" id="mNo" type="number" min="1" inputmode="numeric"
                 value="${esc(f.no || '')}" placeholder="12"></label>
        <label class="field"><span class="kicker">Date · Wednesday</span>
          <input class="input" id="mDate" type="date" value="${esc(f.date || Schedule.nextWednesday())}"></label>
        <label class="field"><span class="kicker">Start</span>
          <input class="input" id="mStart" type="time" value="${esc(f.start || '15:15')}"></label>
        <label class="field"><span class="kicker">End</span>
          <input class="input" id="mEnd" type="time" value="${esc(f.end || '16:15')}"></label>
      </div>

      <p class="authp__err" id="mErr" role="alert" aria-live="assertive" hidden></p>
      <button class="btn btn--go" type="submit" id="mGo">Add to the calendar</button>
    </form>`;
  },

  /* ── ROSTER ───────────────────────────────────────────────────
     Lives inside Progress rather than as its own tab. Same board-only
     authorisation as before: this widens nothing. */
  rosterBody(){
    const d = this.members || {};
    const rows = d.members || [];
    return `<div>
      <div class="bfilters">
        <label class="field bfilters__q"><span class="kicker">Search username</span>
          <input class="input" id="bq" type="search" value="${esc(this.q)}"
                 placeholder="type a username" autocapitalize="none" spellcheck="false"></label>
        <label class="field"><span class="kicker">Sort</span>
          <select class="input" id="bsort">
            ${[['username','Username'],['stamps_desc','Most stamps'],['stamps_asc','Fewest stamps'],
               ['recent','Most recent attendance'],['newest','Newest account']]
              .map(([v,l]) => `<option value="${v}" ${this.sort === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select></label>
      </div>

      ${rows.length ? `
        <ul class="blist blist--members">
          ${rows.map(m => `<li class="brow brow--member" data-bmember="${esc(m.id)}" tabindex="0" role="button">
            <span class="brow__mid">
              <b>${esc(m.username)}</b>
              <span class="muted">joined ${esc(fmtDay(m.created_at))}${
                m.last_attendance ? ' · last seen ' + esc(fmtDay(m.last_attendance)) : ' · never checked in'}</span>
            </span>
            <span class="brow__n">${m.stamps}</span>
            <span class="brow__sub muted">${m.rewards_unlocked}/3</span>
          </li>`).join('')}
        </ul>
        <div class="bpage">
          <button class="btn" data-bpage="${Math.max(1, d.page - 1)}" ${d.page <= 1 ? 'disabled' : ''}>Back</button>
          <span class="muted">Page ${d.page} of ${d.pages} · ${d.total} member${d.total === 1 ? '' : 's'}</span>
          <button class="btn" data-bpage="${Math.min(d.pages, d.page + 1)}" ${d.page >= d.pages ? 'disabled' : ''}>Next</button>
        </div>`
        : this.empty(this.q ? 'No member matches that username.' : 'No member accounts yet.')}
    </div>`;
  },

  memberPane(){
    const d = this.memberDetail;
    const m = d.member;
    return `<div class="panel bpanel">
      <button class="link" data-bback style="margin-bottom:var(--s4)">← Roster</button>

      <p class="kicker">Member</p>
      <h2 class="bdetail__name">${esc(m.username)}</h2>

      <div class="bstats bstats--tight">
        ${this.stat(m.stamps, 'Total stamps')}
        ${this.stat(d.attendance.length, 'Meetings attended')}
        ${this.stat(d.rewards.filter(r => r.unlocked).length, 'Rewards unlocked')}
        ${this.stat(fmtDay(m.created_at), 'Account created')}
      </div>

      <h2 class="h2 bsec">Milestones</h2>
      <ul class="blist">
        ${d.rewards.map(r => `<li class="brow brow--reward">
          <span class="brow__mid"><b>${esc(r.name)}</b>
            <span class="muted">${r.required} stamps</span></span>
          <span class="bstate bstate--${r.claimed ? 'past' : r.unlocked ? 'open' : 'upcoming'}">${
            r.claimed ? 'CLAIMED' : r.unlocked ? 'UNLOCKED' : 'LOCKED'}</span>
        </li>`).join('')}
      </ul>

      <h2 class="h2 bsec">Attendance history</h2>
      ${d.attendance.length
        ? `<ul class="blist">${d.attendance.map(a => `
            <li class="brow" ${a.meeting_id ? `data-bmeeting="${esc(a.meeting_id)}" tabindex="0" role="button"` : ''}>
              <span class="brow__no">GM ${a.meeting_number ? pad(a.meeting_number) : '—'}</span>
              <span class="brow__mid"><b>${esc(fmtDay(a.meeting_date))}</b>
                <span class="muted">${esc(a.location || 'MPR')} · checked in ${esc(fmtTime(a.checked_in_at))}</span></span>
            </li>`).join('')}</ul>`
        : this.empty('No attendance yet.')}
    </div>`;
  },

  /* ── ONE MEETING ──────────────────────────────────────────────── */
  meetingPane(){
    const d = this.meetingDetail;
    const m = d.meeting;
    return `<div class="panel bpanel">
      <button class="link" data-bback style="margin-bottom:var(--s4)">← Back</button>

      <p class="kicker">Meeting</p>
      <h2 class="bdetail__name">GM ${pad(m.meeting_number)}</h2>
      <p class="muted">${esc(fmtDay(m.meeting_date))} · ${esc(m.start_time)}${
        m.end_time ? '–' + esc(m.end_time) : ''} · ${esc(m.location || 'MPR')}</p>

      <div class="bstats bstats--tight" style="margin-top:var(--s5)">
        ${this.stat(d.attendees.length, 'Checked in')}
        ${this.stat(this.shareOfClub(d.attendees.length), 'Of members who attend')}
        ${this.stat(m.check_in_open ? 'OPEN' : 'CLOSED', 'Check-in')}
      </div>

      <h2 class="h2 bsec">Attendees</h2>
      ${d.attendees.length
        ? `<ul class="blist">${d.attendees.map(a => `
            <li class="brow brow--member" data-bmember="${esc(a.user_id)}" tabindex="0" role="button">
              <span class="brow__mid"><b>${esc(a.username)}</b></span>
              <span class="muted">${esc(fmtTime(a.checked_in_at))}</span>
            </li>`).join('')}</ul>`
        : this.empty('No one has checked in yet.')}
    </div>`;
  },

  /* A percentage needs a denominator that means something. The club
     overview may not be loaded when a meeting is opened directly, and
     dividing by a number we do not have would invent a statistic — so
     this returns a dash instead of guessing. */
  shareOfClub(n){
    const base = this.overview && this.overview.participating_members;
    if (typeof base !== 'number' || base <= 0) return '—';
    return Math.round((n / base) * 100) + '%';
  },

  /* ── ATTENDANCE SESSION + QR ──────────────────────────────────── */
  sessionPane(){
    const list = (this.meetings && this.meetings.meetings) || [];
    const open = list.find(m => m.state === 'OPEN');
    const options = list.filter(m => m.state === 'UPCOMING' || m.state === 'ENDED' || m.state === 'OPEN');
    const sel = list.find(m => m.id === boardMeeting) || open || options[0] || null;
    boardMeeting = sel ? sel.id : null;

    if (!sel) return `<div class="panel bpanel">
      ${this.empty('No General Meeting to open yet.')}
      <button class="btn btn--go" data-btab="meetings" style="margin-top:var(--s4)">Schedule one</button>
    </div>`;

    const isOpen = Boolean(sel.check_in_open);

    return `<div class="panel bpanel">
      <div class="picker picker--sub">
        ${options.map(o => `<button class="chip chip--pick ${o.id === sel.id ? 'chip--on' : ''}"
          data-bpick="${o.id}">GM ${pad(o.meeting_number)}</button>`).join('')}
      </div>

      <div class="qrpanel__head" style="margin-top:var(--s4)">
        <span class="qrpanel__no">GM ${pad(sel.meeting_number)}</span>
        <span class="qrpanel__when">${esc(fmtDay(sel.meeting_date))} · ${esc(sel.start_time)} · MPR</span>
      </div>

      ${isOpen ? `
        <!-- nothing is drawn over the code itself: a screentone or an
             ink border across a QR is a scan failure, not a flourish -->
        <div class="qrpanel__code qrpanel__code--big" id="qrBox"></div>
        <div class="bcount"><span class="kicker">Checked in</span>
          <b id="attCount">—</b></div>
        <button class="btn" data-bend="${esc(sel.id)}" style="margin-top:var(--s4)">Close check-in</button>
      ` : `
        <p class="muted" style="margin-top:var(--s4)">Check-in is closed for this meeting.</p>
        <button class="btn btn--go" data-bstart="${esc(sel.id)}" style="margin-top:var(--s4)">Open check-in</button>
      `}
    </div>`;
  },
};

</script>
<script>
/* ── js/04-fx.js ── */
"use strict";
/* keystamp — the FX choreography layer and the named sequences
   Loaded in order by index.html. Order matters. */

/* ══════════════════════════════════════════════════════════════════
   9. FX — the choreography layer.

   Everything is built from five primitives, and every named sequence
   below is a timeline over those primitives rather than a one-off
   animation. That is the difference between choreography and effects:
   a cut in the loading screen and a cut on the scanner are the same
   object with different parameters.

     Slash    the cut — anticipation, instantaneous travel, aftermath
     Impact   scrim, flash, shards, sparks, rings, frame shake
     Lines    speed lines racing out from a focal point
     Field    the ritual structure that forms behind big moments
     Ambient  pulls the background down so an impact lands in silence

   Shape of a cut: the body is charcoal, there is exactly one
   bone-white razor edge, the tail runs a shade lighter, and a single
   short mid-grey tick sits near the end — about 6% of the shape.
   (The palette was crimson/burgundy in an earlier revision; the app is
   strictly monochrome now, so the accent is a value, not a hue.) It overshoots its own length
   during travel, which is the motion blur. It is never a glowing line
   left sitting on screen.

   Sound hooks: each sequence below is written as discrete beats with
   gaps between them (cut · silence · impact), so an audio cue can be
   dropped on any beat later without re-timing anything.
   ══════════════════════════════════════════════════════════════════ */
/* The entrance's whole timing vocabulary, in one place and in
   milliseconds, because every value in it is a cut rather than a curve
   and the only thing left to tune is when each cut happens. */
const MECH = {
  CUT:  1,     /* a panel does not fade in; it is there            */
  LEAD: 40,    /* before the first panel lands                     */
  GAP:  46,    /* between panels — flat, not eased                 */
  BEAT: 90,    /* frame lands, then the type follows               */
  SLAM: 130,   /* the drive itself                                 */
};

/* anime v4 dropped the STRING form of ease. A quoted steps() is not an
   error — it warns and falls back to linear, which is what a frame
   trace of the entrance caught it doing: the type glided down
   -14 to -11.9 to -8.3 to -4.7 to 0 instead of dropping in three cuts.
   The factory is the only form that binds — and it is a TOP-LEVEL
   export, not a member of the eases table, which is the second way to
   write this and get the same silent fallback. Guarded because these
   tables are evaluated at load and anime may not be there at all. */
const STEP = n => (typeof steps === 'function' ? steps(n) : undefined);

/* The type heavy enough to be driven rather than revealed. Everything
   else on a panel is structure and arrives with the frame. */
const SLAM_SEL = '.title,.hero__num,.strike__verb,.tech__name,.who__name,'
               + '.stat b,.qrpanel__no,.entry__gain';

const EASE = {
  CUT:    cubicBezier(.03,.9,.1,1),      /* near-instant travel */
  ENERGY: cubicBezier(.4,0,.2,1),
  IMPACT: cubicBezier(.34,1.56,.5,1),
  CALM:   cubicBezier(.22,.61,.36,1),
  OUT:    'outQuart',
};

/* irregular razor tears — uneven thickness, no two alike */
const TEARS = [
  'M0 20C150 12 330 7 520 15 720 23 880 15 1000 20 880 25 720 32 520 25 330 33 150 28 0 20Z',
  'M0 20C190 17 330 9 570 12 780 14 910 18 1000 20 910 23 780 29 570 28 330 31 190 24 0 20Z',
  'M0 20C120 10 300 25 480 10 690 3 870 17 1000 20 870 26 690 13 480 28 300 37 120 30 0 20Z',
  'M0 20C160 15 280 5 460 14 660 24 850 11 1000 20 850 28 660 20 460 27 280 34 160 25 0 20Z',
];

let cutSeq = 0;
const roll = i => (i * 2.399) % 1;            /* deterministic scatter */

const Slash = {
  TYPE: {
    A: { th:7,  op:.6,  grad:'cutThin',  travel:60, fade:110, shards:0,  scrim:0,   push:0 },
    B: { th:30, op:1,   grad:'cutHeavy', travel:82, fade:160, shards:11, scrim:.38, push:4 },
    C: { th:22, op:.95, grad:'cutHeavy', travel:74, fade:150, shards:8,  scrim:.3,  push:3 },
    D: { th:13, op:.75, grad:'cutThin',  travel:54, fade:105, shards:4,  scrim:.14, push:1.4 },
    E: { th:18, op:.4,  grad:'cutGhost', travel:110,fade:200, shards:0,  scrim:0,   push:0 },
  },

  create({ type = 'B', angle = -22, offset = 0, along = 0, length = null, host = null,
           delay = 0, afterimage = true, hot = true } = {}){
    if (Motion.off) return;
    const parent = host || $('#fx');
    if (!parent) return;
    if (!host && $$('#fx .slash').length > 8) return;     /* hard cap */

    const P = this.TYPE[type] || this.TYPE.B;
    const seq = ++cutSeq;
    const len = length || (host ? Math.max(host.offsetWidth, host.offsetHeight) * 2.2 : null);
    const w = len ? len + 'px' : '180vmax';
    const h = P.th;

    const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    el.setAttribute('class', 'slash');
    el.setAttribute('viewBox', '0 0 1000 40');
    el.setAttribute('preserveAspectRatio', 'none');
    el.style.cssText = `width:${w};height:${h}px;margin-left:calc(${w} / -2);margin-top:${-h/2}px`;

    const tear = TEARS[seq % TEARS.length];
    el.innerHTML =
      `<path d="${tear}" fill="url(#${P.grad})"/>` +
      /* the lit side, offset a hair so the blade has an edge and a body */
      `<path d="${tear}" fill="url(#cutGhost)" opacity=".55" transform="translate(0,-3)"/>` +
      /* black fragments riding the cut */
      (type !== 'E' && type !== 'A'
        ? `<rect x="${180 + (seq % 4) * 90}" y="17" width="${18 + (seq % 3) * 9}" height="7" fill="var(--v6, #111)" opacity=".8"/>
           <rect x="${430 + (seq % 5) * 70}" y="16" width="${11 + (seq % 2) * 8}" height="9" fill="var(--v6, #111)" opacity=".7"/>` : '') +
      /* the only accent in the shape: one short tick toward the tail */
      (hot && type !== 'E'
        ? `<rect x="${640 + (seq % 5) * 20}" y="16" width="${30 + (seq % 3) * 14}" height="9"
                 fill="var(--v4, #666)" opacity=".62"/>` : '');

    parent.appendChild(el);

    /* load · travel past full length · snap back · gone */
    aset(el, { rotate:angle, translateY:offset, translateX:along, scaleX:.012, scaleY:1, opacity:P.op });
    createTimeline({ onComplete:() => el.remove() })
      .add(el, { scaleX:[.012, .05], duration:26, delay, ease:'linear' })
      .add(el, { scaleX:[.05, 1.14], duration:P.travel, ease:EASE.CUT })
      .add(el, { scaleX:[1.14, 1], duration:38, ease:EASE.OUT })
      .add(el, { scaleY:[1, .08], opacity:[P.op, 0], duration:P.fade, ease:EASE.OUT });

    const lands = delay + 26 + P.travel;
    if (P.scrim) Impact.scrim(P.scrim, { delay, host });
    if (P.push)   setTimeout(() => Impact.push(host || $('#view'), P.push, angle), lands);
    if (P.shards) setTimeout(() => Impact.shards(host || $('#fx'), P.shards, angle), lands);
    if (afterimage && type !== 'E')
      setTimeout(() => this.create({ type:'E', angle:angle + (seq % 2 ? 1.8 : -1.8),
                                     offset:offset + 4, host, afterimage:false, hot:false }), lands + 22);
  },

  /* two cuts crossing inside 50ms */
  cross({ angle = -26, host = null, delay = 0 } = {}){
    this.create({ type:'C', angle, host, delay });
    this.create({ type:'C', angle:angle + 76, host, delay:delay + 50, offset:-16 });
  },

  /* CUT · 20ms · CUT · 35ms · CROSS · 50ms · IMPACT */
  barrage(count = 5, { spread = 150, host = null, delay = 0 } = {}){
    for (let i = 0; i < count; i++){
      const r = roll(i);
      this.create({
        type: i % 3 === 0 ? 'B' : 'D',
        angle: -72 + r * 146,
        offset: (r - .5) * spread * 2,
        along: (((i * 1.618) % 1) - .5) * 130,
        host, delay: delay + i * (22 + (i % 3) * 16),
        afterimage: i % 2 === 0,
      });
    }
  },
};

const Impact = {
  /* the anticipation beat: everything dips before the cut lands */
  scrim(peak, { delay = 0, host = null, dur = 180 } = {}){
    if (Motion.off) return;
    const el = host ? this.plate(host, 'scrim') : $('#scrim');
    if (!el) return;
    animate(el, { opacity:[0, peak, 0], duration:dur, delay, ease:'outQuad',
            onComplete:() => { if (host) el.remove(); } });
  },

  /* one frame of blown-out contrast. Capped well below white and never
     repeated at a rate that could read as a strobe. */
  flash(peak = .3, { delay = 0, host = null, dur = 52 } = {}){
    if (Motion.off) return;
    const el = host ? this.plate(host, 'flash') : $('#flash');
    if (!el) return;
    animate(el, { opacity:[0, peak, 0], duration:dur, delay, ease:'linear',
            onComplete:() => { if (host) el.remove(); } });
  },

  plate(host, cls){
    const el = document.createElement('span');
    el.className = cls;
    host.appendChild(el);
    return el;
  },

  /* a few px perpendicular to the blade, then settle */
  push(el, px, angle){
    if (!el || Motion.off) return;
    const rad = (angle + 90) * Math.PI / 180;
    animate(el, { translateX:[0, Math.cos(rad) * px, 0], translateY:[0, Math.sin(rad) * px, 0],
      duration:140, ease:EASE.CUT, complete(){ el.style.transform = ''; } });
  },

  /* the frame itself takes the hit */
  shake(el, px = 5, dur = 110){
    if (!el || Motion.off) return;
    animate(el, { translateX:[0, -px, px * .7, -px * .35, 0],
      translateY:[0, px * .5, -px * .4, px * .2, 0],
      duration:dur, ease:'linear', complete(){ el.style.transform = ''; } });
  },

  shards(host, count, angle){
    if (!host || Motion.off) return;
    const rad = angle * Math.PI / 180;
    for (let i = 0; i < count; i++){
      const el = document.createElement('span');
      const r = roll(i);
      el.className = 'shard' + (r > .8 ? ' shard--hot' : r > .3 ? ' shard--dark' : '');
      host.appendChild(el);
      const side = i % 2 ? 1 : -1;
      const perp = rad + Math.PI / 2 + (r - .5) * 1.2;
      const dist = 30 + r * 86;
      animate(el, { translateX:[Math.cos(rad) * (r - .5) * 220, Math.cos(perp) * dist * side],
        translateY:[Math.sin(rad) * (r - .5) * 220, Math.sin(perp) * dist * side],
        rotate:[angle, angle + side * (50 + r * 130)],
        scaleX:[1.3, .25],
        opacity:[{ value:.95, duration:34 }, { value:0, duration:300 }],
        duration:340, delay:i * 9, ease:EASE.OUT, onComplete:() => el.remove() });
    }
  },

  sparks(host, { count = 9, spread = 56, delay = 0 } = {}){
    if (Motion.off || !host) return;
    for (let i = 0; i < count; i++){
      const el = document.createElement('span');
      const r = roll(i);
      el.className = 'spark' + (r > .82 ? ' spark--hot' : '');
      host.appendChild(el);
      const a = r * Math.PI * 2, d = spread * (.45 + r * .85);
      animate(el, { translateX:[0, Math.cos(a) * d], translateY:[0, Math.sin(a) * d],
        scale:[{ value:1.5, duration:60 }, { value:0, duration:280 }],
        opacity:[{ value:1, duration:40 }, { value:0, duration:300 }],
        duration:350, delay:delay + i * 8, ease:EASE.OUT, onComplete:() => el.remove() });
    }
  },

  ring(host, { size = 150, scale = 3.2, delay = 0, dur = 700 } = {}){
    if (Motion.off) return;
    const parent = host || $('#fx');
    if (!parent) return;
    const el = document.createElement('span');
    el.className = 'shockring';
    el.style.cssText = `width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px`;
    parent.appendChild(el);
    animate(el, { scale:[.25, scale], opacity:[.6, 0], duration:dur, delay,
            ease:EASE.OUT, onComplete:() => el.remove() });
  },
};

/* ── speed lines: thin strokes racing out of a focal point ── */
const Lines = {
  burst({ x = null, y = null, count = 30, host = null,
          reach = 340, delay = 0, hot = false, dur = 300 } = {}){
    if (Motion.off) return;
    const parent = host || $('#fx');
    if (!parent) return;
    const box = document.createElement('div');
    box.className = 'lines';
    const b = parent.getBoundingClientRect();
    const fx = x == null ? b.left + b.width / 2 : x;
    const fy = y == null ? b.top + b.height / 2 : y;
    box.style.transform = `translate(${fx - b.left}px,${fy - b.top}px)`;
    parent.appendChild(box);

    const frag = document.createDocumentFragment();
    const els = [];
    for (let i = 0; i < count; i++){
      const r = roll(i);
      const el = document.createElement('i');
      /* mostly grey and bone; the lightest value only when the moment earns it */
      el.className = hot && r > .88 ? 'r' : r > .55 ? 'd' : '';
      const a = (i / count) * 360 + r * 14;
      const start = 26 + r * 70;
      el.style.width = (40 + r * 190) + 'px';
      el.style.height = (r > .7 ? 2 : 1) + 'px';
      el.dataset.a = a; el.dataset.s = start;
      frag.appendChild(el); els.push(el);
    }
    box.appendChild(frag);

    els.forEach((el, i) => {
      const r = roll(i);
      aset(el, { rotate:+el.dataset.a, translateX:+el.dataset.s, scaleX:.2 });
      animate(el, { translateX:+el.dataset.s + reach * (.55 + r * .75),
        scaleX:[.2, 1, .5],
        opacity:[{ value:.9, duration:dur * .22 }, { value:0, duration:dur * .78 }],
        duration:dur, delay:delay + i * 3, ease:EASE.CUT });
    });

    setTimeout(() => box.remove(), delay + dur + count * 3 + 60);
  },
};

/* ── the structure that forms behind the biggest moments ── */
const fieldSVG = () =>
  `<svg class="verdict__field" id="verdictField" viewBox="0 0 100 100" aria-hidden="true">${seal(4)}</svg>`;

const Ambient = {
  /* silence: pull the environment down so the impact lands in a quiet room */
  hush(ms = 900){
    if (Motion.off) return;
    const layers = [$('.ground'), $('#arena')].filter(Boolean);
    animate(layers, { opacity:[1, .08], duration:150, ease:'outQuad' });
    setTimeout(() => animate(layers, { opacity:[.08, 1], duration:600, ease:EASE.CALM }), ms);
  },
  /* the environment leans in during an important interaction */
  surge(ms = 700){
    if (Motion.off) return;
    const a = $('#arena svg');
    if (!a) return;
    animate(a, { opacity:[.34, .74, .34], scale:[1, 1.04, 1], duration:ms, ease:EASE.ENERGY });
  },
};

/* ══════════════════════════════════════════════════════════════════
   10. THE NAMED SEQUENCES
   These are the only things the app calls. Each one is a timeline over
   the primitives above, with the beats spaced so a sound cue could sit
   on any of them: load · cut · silence · impact · settle.
   ══════════════════════════════════════════════════════════════════ */
const FX = {

  /* ── primitives, exposed by name ───────────────────────────── */
  slash(o){ Slash.create(o); },
  slashBarrage(n, o){ Slash.barrage(n, o); },
  speedLines(o){ Lines.burst(o); },

  /* one frame of violence: dark · blown contrast · a word · a cut · shake */
  impactFrame({ word = '', jp = '', angle = -20, host = null, hot = true } = {}){
    if (Motion.off) return;
    const parent = host || $('#fx');
    if (!parent) return;

    Impact.scrim(.78, { host, dur:230 });
    Impact.flash(.3, { delay:30, host, dur:50 });

    if (word){
      const el = document.createElement('div');
      el.className = 'frameword' + (hot ? '' : ' frameword--k');
      el.textContent = word;
      parent.appendChild(el);
      createTimeline({ onComplete:() => el.remove() })
        .add(el, { opacity:[0, 1], scale:[1.34, 1], skewX:[-9, 0],
               duration:110, ease:EASE.CUT }, 44)
        .add(el, { scale:[1, 1.05], opacity:[1, 0], duration:80, ease:'inQuad' }, 210);

      if (jp){
        const g = document.createElement('div');
        g.className = 'frameword frameword--jp';
        g.textContent = jp;
        parent.appendChild(g);
        animate(g, { opacity:[0, .9, 0], duration:250, delay:60,
                ease:'linear', onComplete:() => g.remove() });
      }
    }

    Slash.create({ type:'B', angle, host, delay:52 });
    Lines.burst({ count:26, reach:300, delay:70, host, hot });
    setTimeout(() => Impact.shake($('#shell'), 6, 120), 78);
  },

  /* dark energy leaving a surface — smoke first, one bright tick last */
  energyBurst(host, { count = 8, spread = 44, delay = 0 } = {}){
    if (Motion.off || !host) return;
    const flare = document.createElement('span');
    flare.className = 'wellflare';
    host.appendChild(flare);
    animate(flare, { scale:[.35, 2.1], opacity:[0, .7, 0], duration:620,
            delay, ease:EASE.OUT, onComplete:() => flare.remove() });
    Impact.sparks(host, { count, spread, delay:delay + 40 });
    Impact.ring(host, { size:46, scale:2.6, delay:delay + 50, dur:620 });
  },

  /* strokes draw themselves in, then the mark locks into place */
  sealReveal(svg, { delay = 0, dur = 420, spin = -14 } = {}){
    if (!svg) return;
    const strokes = svg.querySelectorAll('path,circle,polygon,line');
    if (Motion.off || !strokes.length) return;
    aset(strokes, { opacity:1 });
    animate(createDrawable(strokes), { draw:['0 0', '0 1'],
            duration:dur, delay:stagger(9, { start:delay }), ease:EASE.OUT });
    animate(svg, { rotate:[spin, 0], scale:[.82, 1], duration:dur + 140,
            delay, ease:EASE.ENERGY });
  },

  /* ── navigation: the old view is cut away ── */
  pageCutTransition(){
    if (Motion.off) return;
    Slash.create({ type:'A', angle:-17, afterimage:false });
  },

  /* Panels arrive in reading order, but only the ones you can actually
     see. A screen like Record is three times the height of the window,
     and animating the bottom of it while you are looking at the top
     spends the entrance on nothing — worse, by the time you scroll down
     it has already happened, so the page below the fold always looks
     static. Everything past the fold gets parked and handed to Reveal.

     TWO PHASES (§16). The old entrance was one gesture: every panel
     drifted in from 12px right with a 1.4deg skew on an eased curve,
     which is a card sliding onto a screen — the vocabulary of an app,
     and the one soft motion left in a system that otherwise cuts.

     Structure lands first: the panel CUTS in, one step, no travel and
     no fade, the way a plate drops into register. Its heavy type is
     held back and slams down a beat later in three hard steps. What
     you read is the frame arriving and then the word hitting it.

     The stagger is flat for the same reason. An eased one was chosen
     to read "like a hand turning pages"; a hand is exactly what this
     system is not. */
  pageEntrance(scope){
    const els = [...scope.querySelectorAll('[data-enter]')];
    if (Motion.off || !els.length) return;

    const fold = innerHeight + 40;
    const near = els.filter(el => el.getBoundingClientRect().top < fold);
    const far  = els.filter(el => !near.includes(el));

    aset(els, { opacity:0 });
    animate(near, { opacity:[0, 1], duration:MECH.CUT,
            delay:stagger(MECH.GAP, { start:MECH.LEAD }), ease:STEP(1) });
    near.forEach((el, i) => FX.slamType(el, MECH.LEAD + i * MECH.GAP + MECH.BEAT));
    far.forEach(el => Reveal.watch(el));
  },

  /* THE SLAM. The display type inside a panel starts a short way above
     where it belongs and arrives in three cuts. Three, not one: a
     single jump is a swap, and three is a thing being driven down.

     Held to the panel's own heavy type — the sizes that carry the
     page. Body copy and labels are structure and come in with the
     frame. */
  slamType(panel, at){
    if (!panel || Motion.off) return;
    const marks = [...panel.querySelectorAll(SLAM_SEL)];
    if (!marks.length) return;
    aset(marks, { opacity:0, translateY:-14 });
    animate(marks, { opacity:[0, 1], translateY:[-14, 0],
            duration:MECH.SLAM, delay:stagger(MECH.BEAT / 3, { start:at }),
            ease:STEP(3), onComplete:() => releaseTransform(marks) });
  },

  /* The ten cells of the stamp card, rippling out across the grid rather
     than running left to right. stagger()'s grid mode measures each
     cell's distance from the origin cell and delays by that, so the wave
     travels diagonally the way a block of stamps would actually ink. The
     spring gives each cell its own settle instead of a shared curve, so
     they do not land in lockstep. */
  sealGrid(list){
    if (!list || Motion.off) return;
    const cells = list.querySelectorAll('.seal');
    if (!cells.length) return;
    const cols = 5, rows = Math.ceil(cells.length / cols);
    aset(cells, { opacity:0, scale:.86 });
    animate(cells, { opacity:[0, 1], scale:[.86, 1],
            delay:stagger(44, { grid:[cols, rows], from:'first', start:120 }),
            ease:spring({ mass:1, stiffness:94, damping:13, velocity:0 }) });
  },

  /* The dossier's cells land one after another, each an instant cut —
     a sheet being stamped, not a bar filling. */
  slotStrike(list, at){
    if (!list || Motion.off) return;
    const lit = list.querySelectorAll('.dslot--set');
    if (!lit.length) return;
    aset(lit, { opacity:0 });
    animate(lit, { opacity:[0, 1], duration:1,
            delay:stagger(34, { start:at }), ease:STEP(1) });
  },

  hoverCut(btn){
    if (Motion.off || btn.dataset.cutting) return;
    btn.dataset.cutting = '1';
    Slash.create({ type:'A', angle:-11, host:btn, afterimage:false, hot:false });
    setTimeout(() => delete btn.dataset.cutting, 380);
  },

  /* ── scanner: the frame snaps shut on the code ── */
  scanLock(){
    if (Motion.off) return;
    const dirs = [[1,1],[-1,1],[1,-1],[-1,-1]];
    $$('#reticle .reticle__c').forEach((c, i) => animate(c, { translateX:dirs[i][0] * 11, translateY:dirs[i][1] * 11,
      duration:180, ease:EASE.CUT }));
    Slash.create({ type:'D', angle:-30, host:$('#viewer'), delay:90 });
    Impact.flash(.24, { host:$('#viewer'), delay:110, dur:50 });
  },

  scanReject(){
    if (Motion.off) return;
    Slash.create({ type:'A', angle:24, host:$('#viewer'), afterimage:false, hot:false });
    Impact.shake($('#viewer'), 4, 100);
    $$('#reticle .reticle__c').forEach(c =>
      animate(c, { translateX:0, translateY:0, duration:220, ease:EASE.CALM }));
  },

  /* ── the signature sequence ────────────────────────────────────
     LOCKED · silence · cut cut cross-cut · VERIFIED · +1 · settle
     Beats are deliberately uneven. The 120ms hole after the barrage
     is the impact frame: nothing new lands, which is what makes the
     verdict read as a consequence rather than the next animation.
     ────────────────────────────────────────────────────────────── */
  stampAcquire(meeting, done){
    const box = $('#verdict');
    const P = { seal:$('#vSeal'), state:$('#vState'), jp:$('#vJp'), title:$('#vTitle'),
                delta:$('#vDelta'), meet:$('#vMeet'), flare:$('#vFlare'),
                ring:$('#vRing'), ring2:$('#vRing2') };

    P.seal.innerHTML = seal(3);
    /* SEALED, not "Verified": the product's own word for what just
       happened. A stamp was pressed and it is permanent. */
    P.state.textContent = 'Sealed';
    P.meet.textContent = `GM ${pad(meeting.no)} · Wed ${fmtDay(meeting.date)} · MPR`;
    $('#verdictField')?.remove();
    box.insertAdjacentHTML('afterbegin', fieldSVG());
    const field = $('#verdictField');
    box.classList.add('is-on');

    const finish = () => {
      const close = () => { box.classList.remove('is-on'); box.style.opacity = ''; field?.remove(); done(); };
      if (Motion.off) return close();
      animate(box, { opacity:[1, 0], duration:200, ease:'inQuad', onComplete:close });
    };

    if (Motion.off){
      [P.state, P.jp, P.title, P.delta, P.meet].forEach(el => el.style.opacity = 1);
      field?.remove();
      return void setTimeout(finish, 900);
    }

    Ambient.hush(1300);

    const sealStrokes  = P.seal.querySelectorAll('path,circle,polygon,line');
    const fieldStrokes = field.querySelectorAll('path,circle,polygon,line');
    aset(sealStrokes, { opacity:1 });
    aset([P.state, P.jp, P.title, P.delta, P.meet], { opacity:0 });
    aset(box, { opacity:0 });

    /* THE STAMP LANDS.

       This used to be a 900ms build: the structure eased up over
       740ms, the word faded in with a translate, the title arrived on
       an overshoot curve. Read as a sequence of animations rather than
       as an event — and a stamp is not a sequence. It is one impact
       with consequences.

       Now: the structure draws (that part is a press being aligned),
       then at 300ms everything stops for one frame, and SEALED is
       simply THERE — no fade, no travel, full size, off square. The
       marks around it snap in after, in steps, like the register
       settling. Nothing in the impact eases. */
    createTimeline({ onComplete:() => setTimeout(finish, 200) })
      .add(box, { opacity:[0, 1], duration:1, ease:STEP(1) }, 0)
      /* alignment: the press coming down. This is the only part of the
         sequence allowed a curve, and it is under the word, not on it */
      .add(field, { opacity:[0, .5], scale:[.42, 1], rotate:[-22, 0],
             duration:300, ease:EASE.ENERGY }, 40)
      .add(createDrawable(fieldStrokes), { draw:['0 0', '0 1'],
             duration:260, delay:stagger(3), ease:'linear' }, 60)
      .add(createDrawable(sealStrokes), { draw:['0 0', '0 1'],
             duration:200, delay:stagger(7), ease:'linear' }, 90)
      .add(P.seal, { rotate:[-10, 0], scale:[.86, 1], duration:240, ease:EASE.ENERGY }, 90)

      /* 300ms: THE PRESS. Full size, instantly, nothing to watch. */
      /* opacity ONLY. Animating scale here writes an inline transform,
         and that silently overrode the -3.2deg the stamp is struck at
         — the mark landed square, which is the one thing a hand-
         pressed seal never does. */
      .add(P.state, { opacity:[0, 1], duration:1, ease:STEP(1) }, 300)
      .add(P.flare, { scale:[.4, 1.6], opacity:[.8, 0], duration:150, ease:STEP(3) }, 300)
      .add(P.ring, { scale:[.4, 3.2], opacity:[.7, 0], duration:210, ease:STEP(4) }, 302)
      .add(P.ring2, { scale:[.4, 2.2], opacity:[.5, 0], duration:250, ease:STEP(4) }, 316)
      .add(field, { scale:[1, 1.08], opacity:[.5, .16], duration:120, ease:STEP(2) }, 306)

      /* the register settling — each mark a cut, not a fade */
      .add(P.jp,    { opacity:[0, .85], duration:1, ease:STEP(1) }, 380)
      .add(P.title, { opacity:[0, 1], duration:1, ease:STEP(1) }, 430)
      .add(P.delta, { opacity:[0, 1], duration:1, ease:STEP(1) }, 480)
      .add(P.meet,  { opacity:[0, 1], duration:1, ease:STEP(1) }, 530)
      .add(P.seal,  { opacity:[1, .16], duration:160, ease:STEP(3) }, 560)
      .add(field,   { opacity:[.16, 0], duration:160, ease:STEP(3) }, 560);

    /* the cuts run on their own clocks so the timeline can't smooth
       them out, and all of them land ON the press rather than around it */
    setTimeout(() => Impact.flash(.3, { dur:44 }), 298);
    setTimeout(() => Slash.create({ type:'B', angle:-24 }), 300);
    setTimeout(() => Slash.cross({ angle:-58 }), 336);
    setTimeout(() => Lines.burst({ count:26, reach:400, hot:true, dur:260 }), 304);
    setTimeout(() => Impact.shake($('.verdict__inner'), 7, 90), 300);
  },

  /* the stamp landing on the grid, once the dashboard is back */
  stampLand(cell){
    if (!cell || Motion.off) return;
    const svg = cell.querySelector('svg');
    Slash.cross({ angle:-34, host:cell });
    Ambient.surge(760);

    /* two moves, not one. A single overshoot curve makes the stamp
       decelerate on the way in, which is backwards — a stamp is fastest
       at the moment it hits. So: a hard fast flight to slightly past
       the mark, then a spring settle. The spring works out its own
       duration from the mass and stiffness, so the recoil is physical
       rather than a number picked to look about right. */
    animate(cell, { scale:[0, 1.24], rotate:[-42, 6],
            duration:250, delay:240, ease:'outQuart' });
    animate(cell, { scale:1, rotate:0,
            delay:490, ease:spring({ mass:1, stiffness:90, damping:12, velocity:0 }) });
    this.energyBurst(cell, { count:9, spread:50, delay:250 });
    Impact.shards(cell, 10, -34);
    setTimeout(() => this.sealReveal(svg, { dur:380, spin:-24 }), 300);
    setTimeout(() => Impact.shake($('#shell'), 4, 90), 300);
  },

  /* ── the seal on a milestone breaks ── */
  rewardUnlock(rig){
    if (Motion.off || !rig) return;
    const crack = rig.querySelector('.tech__crack');
    const glyph = rig.querySelector('.tech__glyph');
    const panel = rig.querySelector('.panel');
    if (!crack) return;

    const paths = crack.querySelectorAll('path');
    aset(crack, { opacity:1 });

    createTimeline()
      /* the seal fractures */
      .add(createDrawable(paths), { draw:['0 0', '0 1'],
             duration:260, delay:stagger(50), ease:EASE.CUT }, 0)
      /* then it gives way */
      .add(crack, { opacity:[1, 0], scale:[1, 1.06], duration:200, ease:EASE.OUT }, 380);

    setTimeout(() => {
      Slash.cross({ angle:-16, host:panel });
      Impact.shards(panel, 10, -16);
      this.energyBurst(glyph || panel, { count:10, spread:56 });
      animate(glyph, { scale:[.72, 1.12, 1], rotate:[-16, 0], duration:560, ease:EASE.IMPACT });
      this.sealReveal(glyph, { dur:420 });
      Impact.shake(panel, 5, 110);
    }, 400);
  },
};

/* ── loading: the app is cut into existence ─────────────────────────
   Ten beats in about 1.7 seconds. It is a title card, not a spinner,
   so it never loops and never waits on anything — the interface is
   already rendered behind the curtain while this plays.

     1  a small seal surfaces out of black
     2  one instant cut
     3  a single frame of blown-out contrast
     4  three diagonal cuts in quick succession
     5  speed lines explode outward
     6  the mark resolves
     7  the title lands
     8  a last cut goes through the title
     9  the halves shear apart and everything collapses
    10  the interface arrives
   ─────────────────────────────────────────────────────────────────── */
Object.assign(FX, {
  loadingSequence(onReveal){
    const boot = $('#boot'), sealEl = $('#bootSeal'), mark = $('#bootMark');
    const title = $('#bootTitle'), jp = $('#bootJp');
    const halves = $$('.boot__half');

    /* both of these are idempotent on purpose. The curtain is a solid
       black layer over the whole app, so "lift it exactly once, from
       exactly one callback" is a bad bet — anything that stops the
       clock strands the page. Make them safe to call twice and then
       call them from more than one place. */
    let lifted = false, revealed = false;
    const done = () => { if (lifted) return; lifted = true; boot.classList.add('is-done'); };
    const reveal = () => { if (revealed) return; revealed = true; onReveal(); };

    sealEl.innerHTML = seal(4);
    mark.innerHTML = logoMark('boot__logo');

    if (Motion.off){ reveal(); return void done(); }

    const markStrokes = mark.querySelectorAll('path');
    const sealStrokes = sealEl.querySelectorAll('circle,polygon,path,line');
    aset(markStrokes, { opacity:1 });
    aset(title, { opacity:0 });

    /* one clock for the whole title card.

       These beats used to be a timeline plus eight loose setTimeouts.
       Two clocks means two ways to drift: minimise the tab and rAF
       stops while setTimeout keeps going, so the cuts fire against a
       frozen seal. anime.js can hold a target-less step purely as a
       timer, so every beat now hangs off the same timeline and they
       pause and resume together. */
    const tl = createTimeline({ onComplete:done });
    const beat = (at, fn) => tl.add({ duration:1, onBegin:fn }, at);

    tl
      /* 1 · a seal surfaces */
      .add(sealEl, { opacity:[0, .78], scale:[.86, 1], duration:200, ease:EASE.CALM }, 50)
      .add(createDrawable(sealStrokes), { draw:['0 0', '0 1'],
             duration:560, delay:stagger(4), ease:EASE.OUT }, 70)
      .add(sealEl, { opacity:[.78, .16], scale:[1, 1.07], duration:320, ease:EASE.OUT }, 320)
      /* 6 · the mark resolves */
      .add(mark, { opacity:[0, 1], scale:[.84, 1], duration:260, ease:EASE.IMPACT }, 580)
      .add(createDrawable(markStrokes), { draw:['0 0', '0 1'],
             duration:400, delay:stagger(48), ease:EASE.OUT }, 600)
      .add(mark, { opacity:[1, 0], translateY:[0, -26], duration:200, ease:EASE.CUT }, 830)
      /* 7 · the title lands */
      .add(title, { opacity:[0, 1], scale:[1.14, 1], duration:170, ease:EASE.CUT }, 860)
      .add(jp, { opacity:[0, .8], letterSpacing:['1.1em', '.66em'], duration:420, ease:EASE.CALM }, 900)
      /* 9 · collapse */
      .add([jp, sealEl], { opacity:0, duration:180, ease:EASE.CALM }, 1250)
      .add(boot, { opacity:[1, 0], duration:280, ease:EASE.CALM, onBegin:reveal }, 1420)
      /* 8 · the halves shear apart along the last cut */
      .add(halves[0], { translateX:-9, translateY:-27, rotate:-1.4,
             opacity:[1, 0], duration:300, ease:EASE.OUT }, 1215)
      .add(halves[1], { translateX:9, translateY:27, rotate:1.4,
             opacity:[1, 0], duration:300, ease:EASE.OUT }, 1215);

    /* the cuts, now on the same clock as everything else */
    const cut = o => Slash.create({ ...o, host:boot });
    beat(200, () => cut({ type:'B', angle:-27 }));                                    /* 2 */
    beat(240, () => Impact.flash(.34, { host:boot, dur:52 }));                        /* 3 */
    beat(310, () => cut({ type:'D', angle:52, offset:-96 }));                         /* 4 */
    beat(352, () => cut({ type:'D', angle:-64, offset:70 }));
    beat(430, () => Lines.burst({ host:boot, count:30, reach:480, dur:340, hot:true }));  /* 5 */
    beat(442, () => Impact.ring(boot, { size:120, scale:4.4, dur:700 }));
    beat(1160, () => {                                                               /* 8 */
      cut({ type:'B', angle:-18 });
      Impact.flash(.3, { host:boot, delay:26, dur:48 });
      Impact.shards(boot, 14, -18);
    });

    /* three ways out, all idempotent. The timeline's own complete is the
       one that should fire; tl itself (not a `.finished` property —
       anime.js v4 timelines have no such thing, and reading it threw
       synchronously, which skipped straight to the outer catch and
       dropped the boot curtain before the title card had even started)
       covers a rejected or replaced instance, and the timer covers the
       case where the clock stops altogether. The curtain comes up
       either way. */
    tl.then(done, done);
    setTimeout(() => { reveal(); done(); }, 2600);
  },
});

</script>
<script>
/* ── js/05-scan.js ── */
"use strict";
/* keystamp — QR encoding and the camera scanner state machine
   Loaded in order by index.html. Order matters. */

/* ══════════════════════════════════════════════════════════════════
   10b. QR ENCODING — draws the string the scanner is looking for.
   Pure black on white with a quiet zone, because that is what phone
   cameras decode most reliably. It also happens to be the most manga
   thing on the site, so it is left undecorated on purpose.
   ══════════════════════════════════════════════════════════════════ */
function qrSVG(text){
  if (!window.qrcode) return null;
  let qr;
  try { qr = qrcode(0, 'M'); qr.addData(text); qr.make(); }
  catch (_) { return null; }
  const n = qr.getModuleCount(), q = 3, size = n + q * 2;
  let d = '';
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) d += `M${c + q} ${r + q}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"
    role="img" aria-label="Attendance QR code for this meeting">
    <rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

let boardMeeting = null;
let boardTimer = null;

function paintBoard(){
  clearInterval(boardTimer);
  const box = $('#qrBox');
  if (!box) return;

  /* ONE code per meeting, fetched once.
     The server derives the token from the meeting itself, so asking
     again returns the same string — there is nothing to rotate and no
     timer to keep alive. The board still cannot mint a code: if the
     server is unreachable the screen says so rather than drawing
     something that only looks valid. */
  Backend.issueToken(boardMeeting).then(({ token }) => {
    if (!document.body.contains(box)) return;
    const svg = qrSVG(token);
    box.innerHTML = svg || `<p class="qrpanel__fail">The QR encoder did not load. Ask members
      to check in at the door instead.</p>`;
  }).catch(() => {
    if (!document.body.contains(box)) return;
    box.innerHTML = `<p class="qrpanel__fail">Could not reach the attendance server.</p>`;
  });
}

/* Board attendance count, straight from the database. Polled on a slow
   interval rather than a realtime socket: a general meeting check-in lasts minutes
   and a count that is a few seconds stale is fine, whereas a socket per
   board device is a connection to keep alive for no real gain. */
let countTimer = null;
function paintAttendanceCount(meetingId){
  clearInterval(countTimer);
  const el = () => document.querySelector('#attCount');
  const pull = async () => {
    if (!el()) return clearInterval(countTimer);
    /* Resolve the count first, then look the element up again. The node
       can be gone by the time the request lands — the board navigated
       away mid-flight — and the old code called el().textContent inside
       the catch without re-checking, so a failed request after leaving
       the screen threw a TypeError out of an async function. That became
       an unhandled rejection, which Guard reports as a red error bar
       over an app that is working fine. */
    let text;
    try { text = String(await Backend.attendanceCount(meetingId)); }
    catch (_) { text = '—'; }
    const node = el();
    if (!node) return clearInterval(countTimer);
    node.textContent = text;
  };
  pull();
  countTimer = setInterval(pull, 6000);
}

/* ══════════════════════════════════════════════════════════════════
   11. SCANNER — an explicit state machine, so every outcome has a look.
   ══════════════════════════════════════════════════════════════════ */
const Scanner = {
  stream:null, raf:null, cv:null, ctx:null, locked:false, frame:0,

  setState(state, msg){
    const ret = $('#reticle'), el = $('#scanMsg'), viewer = $('#viewer');
    if (el){
      el.textContent = msg;
      el.classList.toggle('viewer__msg--hot', state === 'hit' || state === 'good');
      el.classList.toggle('viewer__msg--soft',
        state === 'bad' || state === 'boot' || state === 'busy');
    }
    if (ret){
      ret.classList.toggle('reticle--live', state === 'live');
      ret.classList.toggle('reticle--good', state === 'good' || state === 'hit');
      ret.classList.toggle('reticle--bad',  state === 'bad');
      /* 'busy' is the wait on the server, and it used to toggle
         nothing at all: the sweep stopped, the corners fell back to
         their default weight, and the frame read as a scanner that had
         given up rather than one that was working. It has a look now. */
      ret.classList.toggle('reticle--busy', state === 'busy');
    }
    viewer?.classList.toggle('viewer--hit', state === 'good' || state === 'hit');
    /* A refusal is not a small red sentence under the frame. The frame
       itself answers — see .viewer--bad. The class is removed and
       re-added so a second bad scan in a row replays the reaction
       instead of sitting on a finished animation. */
    if (viewer){
      viewer.classList.remove('viewer--bad');
      if (state === 'bad'){ void viewer.offsetWidth; viewer.classList.add('viewer--bad'); }
    }
  },

  async start(){
    const video = $('#cam');
    if (!video) return;
    this.locked = false;
    /* a fresh attempt is not a stalled panel — clear the state the
       previous one may have left on the frame */
    $('#viewer')?.classList.remove('viewer--stalled', 'viewer--feed');
    this.setState('boot', 'Starting camera');
    this.showLoader();

    if (!navigator.mediaDevices?.getUserMedia) return this.stall('unsupported');

    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 } }, audio:false });
    } catch (err) {
      return this.stall(err && err.name === 'NotAllowedError' ? 'denied' : 'unavailable');
    }
    if (!document.body.contains(video)) return this.stop();   /* navigated away mid-await */

    this.hideLoader();
    video.srcObject = this.stream;
    try { await video.play(); } catch (_) {}
    /* Only from here is there a camera image behind the overlay, and
       only from here are paper brackets the readable choice. */
    $('#viewer')?.classList.add('viewer--feed');

    this.cv = document.createElement('canvas');
    this.ctx = this.cv.getContext('2d', { willReadFrequently:true });
    this.setState('live', 'Searching for meeting seal');
    this.loop(video);
  },

  /* The waiting mark, shown while the browser asks for camera
     permission and while the feed spins up.

     Its two circles carried a stroke-dasharray and nothing else — no
     fill, no stroke. An SVG shape with no fill declared defaults to
     BLACK and to no stroke at all, so the dash pattern described an
     outline that was never drawn and both circles painted as solid
     discs: one black blob over the whole reticle, which is what a
     member saw while deciding whether to grant camera access. Every
     other mark in this app is built by SVG() or seal(), which set
     fill:none and stroke:currentColor; this one was hand-rolled and
     inherited neither. It had no CSS either — .loader is styled
     nowhere — so nothing constrained its size. */
  showLoader(){
    const ret = $('#reticle');
    if (!ret || $('#camLoader')) return;
    const l = document.createElement('div');
    l.className = 'loader'; l.id = 'camLoader';
    /* the reticle's compass marks step back while the mark is turning,
       so the one moving thing on the frame is the one you look at */
    ret.classList.add('reticle--wait');
    /* two opposed arcs per ring rather than one, so the mark reads as a
       thing that is turning instead of as a stray scratch on the frame */
    l.innerHTML = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
        stroke-width="3" aria-hidden="true">
      <circle cx="50" cy="50" r="42" stroke-dasharray="42 90"/>
      <circle cx="50" cy="50" r="30" stroke-dasharray="24 70" opacity=".5"/></svg>`;
    ret.appendChild(l);
  },
  hideLoader(){ $('#camLoader')?.remove(); $('#reticle')?.classList.remove('reticle--wait'); },

  loop(video){
    const step = () => {
      this.raf = requestAnimationFrame(step);
      if (this.locked || video.readyState !== 4 || !window.jsQR) return;
      if ((this.frame++ % 3) !== 0) return;
      const w = 340, h = Math.round(video.videoHeight / video.videoWidth * w) || 340;
      this.cv.width = w; this.cv.height = h;
      this.ctx.drawImage(video, 0, 0, w, h);
      let img;
      try { img = this.ctx.getImageData(0, 0, w, h); } catch (_) { return; }
      const hit = jsQR(img.data, w, h, { inversionAttempts:'dontInvert' });
      if (hit && hit.data){
        this.locked = true;
        this.setState('hit', 'Locked');
        FX.scanLock();
        setTimeout(() => submitSeal(hit.data, true), 190);
      }
    };
    step();
  },

  /* the camera cannot run — say exactly why, and what to do instead */
  stall(kind){
    const viewer = $('#viewer');
    if (!viewer) return;
    this.hideLoader();
    viewer.classList.remove('viewer--feed');
    /* A fault code, then the sentence. The three dead ends used to be
       told apart by a padlock, a camera and a keypad glyph — three
       pictures doing a job this page does with words in brackets
       everywhere else. The code names the fault; the sentence says what
       to do about it. */
    const copy = {
      denied:{ code:'ERR.PERM', title:'Camera permission is off',
        body:'Allow camera access for this page in your browser settings, then reload. Or type the code below.' },
      unavailable:{ code:'ERR.CAM', title:'No camera found',
        body:'Nothing on this device is reporting a camera. Type the code printed under the seal instead.' },
      unsupported:{ code:'ERR.HTTPS', title:'Scanning needs a secure page',
        body:'Camera access only works over https. Type the code printed under the seal instead.' },
    }[kind];

    /* The dead-end reads like the rest of the system now: a fault code
       set as an annotation, the sentence at reading size, and the
       whole thing anchored to the left of the frame instead of
       floating in the middle of a grey box. */
    viewer.innerHTML = `<div class="stall">
      ${codeMark(copy.code)}
      <h2 class="stall__title">${copy.title}</h2>
      <p class="stall__note">${copy.body}</p>
    </div>`;
    /* A state class, not inline geometry. `style.minHeight = '230px'`
       is the strongest declaration in the cascade, so the stalled
       panel kept a fixed 230px box at every viewport — a wide
       letterbox with a small icon marooned in it on a laptop, and a
       box taller than it needs to be on a short phone in landscape.
       The class lets the stylesheet size this state the same way it
       sizes every other panel. */
    viewer.classList.add('viewer--stalled');
    $('#manualInput')?.focus({ preventScroll:true });
  },

  stop(){
    cancelAnimationFrame(this.raf); this.raf = null;
    this.stream?.getTracks().forEach(t => t.stop());
    this.stream = null; this.locked = false;
    $('#viewer')?.classList.remove('viewer--feed');
  },
};

/* ── one path for every code, camera or keyboard ─────────────────────
   Both the camera and the manual field land here, and here sends the
   raw payload to the server. The client no longer decides anything:
   it cannot compute a valid token, so it cannot grant a stamp. */
let pendingCell = -1;

/* Server verdicts → sentences a student can act on. Nothing here
   leaks a stack trace, a column name or a row id. */
const SCAN_MESSAGES = {
  INVALID_TOKEN:       ['Not a valid code',      'That code is not from Keystamp. Scan the one on the board screen.'],
  EXPIRED_TOKEN:       ['Code expired',          'The code refreshes every few seconds. Scan the one showing right now.'],
  MEETING_NOT_FOUND:   ['No matching meeting',   'Keystamp has no meeting for that code. Ask a board member.'],
  MEETING_NOT_ACTIVE:  ['Check-in not open',     'This meeting is not taking check-ins yet.'],
  ATTENDANCE_CLOSED:   ['Check-in has ended',    'Attendance for this meeting is closed. A board member can add you.'],
  WRONG_DAY:           ['Wrong day',             'That code is for a different meeting date.'],
  ALREADY_CHECKED_IN:  ['Already checked in',    'Your stamp for this general meeting is already recorded.'],
  PROFILE_NOT_READY:   ['Account still setting up','Your account was made seconds ago. Wait a moment and scan again.'],
  NOT_AUTHENTICATED:   ['Sign in first',         'Sign in to record your attendance.'],
  NOT_AUTHORIZED:      ['Not allowed',           'Your account cannot check in to this meeting.'],
  NETWORK_ERROR:       ['No connection',         'Keystamp could not reach the server. Check your signal and try again.'],
  VERIFIER_UNAVAILABLE:['Check-in unavailable',  'Attendance verification is not running. Tell a board member.'],
  SERVER_ERROR:        ['Something went wrong',  'Keystamp could not check that code. Try again in a moment.'],
  NO_BACKEND:          ['Not connected',         'This build has no backend configured, so check-in is unavailable.'],
};
const scanMessage = code => SCAN_MESSAGES[code] || SCAN_MESSAGES.SERVER_ERROR;

async function submitSeal(raw, fromCamera){
  /* a cheap local shape check so an unrelated QR never becomes a
     network round trip. It proves nothing — the server still decides. */
  if (!QRFormat.looksLikeKeystamp(raw)){
    const [t, d] = scanMessage('INVALID_TOKEN');
    toast({ key:'scan', title:t, detail:d, bad:true });
    if (fromCamera) rejectVisual('INVALID_TOKEN');
    return;
  }

  if (fromCamera) Scanner.setState('busy', 'Checking with the server');

  const result = await Backend.verifyCode(raw);

  if (!result || !result.ok){
    const code = (result && result.code) || 'SERVER_ERROR';
    const [t, d] = scanMessage(code);
    /* keyed: rapid rescans of a bad code replace, never pile up */
    toast({ key:'scan', title:t, detail:d, bad:true });
    if (fromCamera) rejectVisual(code);
    return;
  }

  /* A rejection toast may still be on screen from a previous attempt; the
     scan has now succeeded, so drop it rather than let the two contradict
     each other side by side. */
  dropToast('scan');
  Scanner.setState('good', 'Verified');
  Scanner.stop();
  pendingCell = Rules.progress().filled;

  /* The server already inserted the row. Re-read from the database so
     the count, the record and the rewards all come from stored data
     rather than from an optimistic client increment. */
  await Store.hydrate();
  const meeting = Store.meeting(result.meeting_id) ||
                  { id:result.meeting_id, no:result.meeting_number };
  FX.stampAcquire(meeting, () => go('home'));
}

/* A refusal is a SYSTEM EVENT, so it is reported the way this system
   reports one: a fault code, not a sentence in small red type. The
   frame flashes and kicks (see .viewer--bad), the status chip states
   the code, and the retry is explicit — the frame says it is looking
   again rather than leaving the member to guess whether it is still
   on. The human sentence is not lost; it is in the toast beside it. */
const REJECT_CODE = {
  INVALID_TOKEN:'REJ.FORMAT',      EXPIRED_TOKEN:'REJ.EXPIRED',
  MEETING_NOT_FOUND:'REJ.NOMEET',  MEETING_NOT_ACTIVE:'REJ.CLOSED',
  ATTENDANCE_CLOSED:'REJ.CLOSED',  WRONG_DAY:'REJ.DATE',
  ALREADY_CHECKED_IN:'REJ.DUP',    PROFILE_NOT_READY:'REJ.ACCT',
  NOT_AUTHENTICATED:'REJ.AUTH',    NOT_AUTHORIZED:'REJ.AUTH',
  NETWORK_ERROR:'ERR.NET',         VERIFIER_UNAVAILABLE:'ERR.SVC',
  SERVER_ERROR:'ERR.SRV',          NO_BACKEND:'ERR.CFG',
};

function rejectVisual(code){
  Scanner.setState('bad', REJECT_CODE[code] || 'REJ.CODE');
  FX.scanReject();
  setTimeout(() => {
    if (!$('#reticle')) return;
    Scanner.locked = false;
    Scanner.setState('live', 'Searching for meeting seal');
  }, 1900);
}

</script>
<script>
/* ── js/06-app.js ── */
"use strict";
/* keystamp — router, interactions, boot
   Loaded in order by index.html. Order matters. */

/* ══════════════════════════════════════════════════════════════════
   12. NAVIGATION
   Five destinations. Record and Profile are back from v1, but only
   with figures the app actually holds — no invented officer titles, no
   membership status, no controls that do nothing. The one real setting,
   reduced motion, stays in the header where it is always reachable.
   ══════════════════════════════════════════════════════════════════ */
/* The five screens are chapters of one volume. The numbering is not
   decoration — it is the navigation model, and it is what makes moving
   between screens feel like turning to a section rather than clicking a
   tab. Titles stay plain words; the chapter number carries the framing. */
const MEMBER_NAV = [
  { id:'home',    label:'Home',    icon:'home',   ch:'01', title:'The Card'   },
  { id:'record',  label:'Record',  icon:'record', ch:'02', title:'The Record' },
  { id:'scan',    label:'Scan',    icon:'scan',   ch:'03', title:'The Scan'   },
  { id:'rewards', label:'Rewards', icon:'reward', ch:'04', title:'The Reward' },
  { id:'profile', label:'Member',  icon:'member', ch:'05', title:'The Member' },
];

/* A board account is not a member account with an extra button. It gets
   its own chapters through the same nav component — same numerals, same
   rail, same tab bar — so it reads as the same book, not a control
   panel bolted on. */
const BOARD_NAV = [
  { id:'board',    label:'Club Tools', icon:'home',   ch:'01', title:'Club Tools' },
  { id:'bmeet',    label:'Meetings',   icon:'record', ch:'02', title:'Meetings'   },
  { id:'bcheckin', label:'Check-In',   icon:'scan',   ch:'03', title:'Check-In'   },
  { id:'bmembers', label:'Members',    icon:'member', ch:'04', title:'Members'    },
];

const NAV = MEMBER_NAV;                       /* kept: existing callers */
const navFor = () => (Store.isBoard ? BOARD_NAV : MEMBER_NAV);
const chapterOf = id =>
  BOARD_NAV.find(n => n.id === id) || MEMBER_NAV.find(n => n.id === id) || { ch:'—', title:'' };

const ROUTES = MEMBER_NAV.map(n => n.id)
  .concat(BOARD_NAV.map(n => n.id), 'auth');

/* ── AUTH GATE ─────────────────────────────────────────────────────
   One place decides whether a route may render. Signed out, every
   route resolves to 'auth'; signed in, 'auth' resolves away. Board
   tools additionally require the board role — and note this is a UX
   guard only: the real authorisation is the RLS policy on the server,
   which is what actually refuses a member's write. */
const AuthUI = {
  mode:'in', busy:false,

  /* Three different problems used to render as one sentence that read
     like the app was broken. They are now told apart:
       unconfigured   a developer has not connected a project yet —
                      this is a setup instruction, not a user error
       unavailable    configured, but the client could not start
       live           normal operation, no notice at all
     Students never see the first two once a project is connected. */
  setupNotice(){
    const st = Backend.status;
    if (st === 'live') return '';        /* normal operation says nothing */

    if (st === 'unavailable'){
      return `<div class="setupbox setupbox--warn">
        <p class="kicker">Backend connection failed</p>
        <p>Keystamp is configured but could not reach Supabase. This is not
           a problem with your username or password.</p>
        <p class="setupbox__hint">Check the connection and reload. If it keeps
           happening, tell a board member.</p>
      </div>`;
    }

    const why = (Backend.failure && Backend.failure.reason) || 'No Supabase project is connected.';
    return `<div class="setupbox">
      <p class="kicker">Setup needed</p>
      <p><b>${esc(why)}</b></p>
      <p class="setupbox__hint">Add the Supabase project URL and public anon key
        to the two <code>keystamp:supabase-*</code> meta tags in
        <code>dev.html</code>, then run <code>python3 build.py</code>.
        Full steps are in the README under "Connect Keystamp to Supabase".</p>
    </div>`;
  },
};

const BOARD_ROUTES = BOARD_NAV.map(n => n.id);

function gate(id){
  if (!Store.ready) return id;
  if (!Store.signedIn) return 'auth';
  if (!Store.isBoard){
    /* a member never reaches a board route, whatever the hash says */
    if (BOARD_ROUTES.includes(id)) return 'home';
    if (id === 'auth') return 'home';
    return id;
  }
  /* a board account lands in Club Tools rather than passing through the
     member spread on the way */
  if (!BOARD_ROUTES.includes(id)) return 'board';
  return id;
}

let current = 'home';
let navigating = false;
let booted = false;

function syncHash(id){
  try { if (location.hash !== '#/' + id) history.replaceState(null, '', '#/' + id); }
  catch (_) { /* sandboxed frames refuse History writes; `current` still rules */ }
}
function hashRoute(){
  try {
    const id = location.hash.replace('#/', '');
    return ROUTES.includes(id) ? id : 'home';
  } catch (_) { return 'home'; }
}

function paintBrand(){
  const el = $('#railBrand');
  if (!el) return;
  const n = navFor().length;
  el.innerHTML = wordmark() +
    `<p class="rail__vol" style="margin-top:9px">Vol. 01 · ${
      n === 4 ? 'Four' : 'Five'} chapters</p>`;
}

function paintNav(){
  const tabs = $('#tabs'), rail = $('#railNav');
  $$('.tab', tabs).forEach(el => el.remove());
  $$('.rail__link', rail).forEach(el => el.remove());

  navFor().forEach(n => {
    const cur = current === n.id ? ' aria-current="page"' : '';
    /* no icons: an icon tab bar is an OS convention and reads as an app
       no matter how it is styled. Chapter numerals instead. */
    tabs.insertAdjacentHTML('beforeend',
      `<button class="tab" data-go="${n.id}"${cur}>
         <span class="tab__no">${n.ch}</span><span>${n.label}</span></button>`);
    rail.insertAdjacentHTML('beforeend',
      `<button class="rail__link" data-go="${n.id}"${cur}>
         <span class="rail__no">${n.ch}</span>${ICON[n.icon]}<span>${n.label}</span></button>`);
  });

  requestAnimationFrame(placeIndicators);
}

let indRaf = 0;
function placeIndicators(){
  Motion.indicator($('#tabsInd'), $('#tabs .tab[aria-current]'), 'x');
  Motion.indicator($('#railInd'), $('#railNav .rail__link[aria-current]'), 'y');
}

async function go(id){
  if (!ROUTES.includes(id)) id = 'home';
  id = gate(id);
  if (navigating) return;
  if (current === 'scan' && id !== 'scan') Scanner.stop();

  const view = $('#view');
  if (view.firstChild){
    navigating = true;
    FX.pageCutTransition();               /* the cut runs while the old view is pulled away */
    await Motion.exit(view);
    navigating = false;
  }

  current = id;
  syncHash(id);
  view.style.opacity = ''; view.style.transform = '';
  Reveal.clear();                      /* the old view's parked panels go with it */
  document.documentElement.dataset.screen = id;   /* CSS lays out each spread by name */
  /* One surface for the whole app: warm paper. Black is manga ink --
     spotted blacks, panel frames, active states, the scanner border --
     and is never used as a page-level theme. */
  const ch = chapterOf(id);
  let pn = $('#pageno');
  if (!pn){
    pn = document.createElement('div');
