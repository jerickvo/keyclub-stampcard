/* ── INDEX. The numeral that says where a thing sits in a series. */
.idx{font-family:var(--f-display);line-height:.8;letter-spacing:-.04em;
  font-size:var(--idx-size,clamp(20px,2.6vw,38px));color:var(--v3)}
.idx--on{color:var(--ink)}

/* ── SPEED LINES. Direction, not texture: they always run TOWARD the
   thing that matters and they fade out behind it. */
.speed{position:relative;overflow:hidden}
.speed::before{content:"";position:absolute;inset:0;z-index:0;
  pointer-events:none;
  background-image:repeating-linear-gradient(var(--speed-a,68deg),
    currentColor 0 1px, transparent 1px var(--speed-gap,9px));
  opacity:var(--speed-o,.14);
  -webkit-mask-image:linear-gradient(var(--speed-a,68deg),#000,transparent 72%);
          mask-image:linear-gradient(var(--speed-a,68deg),#000,transparent 72%)}

/* ══════════════════════════════════════════════════════════════════
   THE REGISTER — the page is a ruled sheet, not a tray of boxes.

   The audit's finding was one thing repeated: every section on every
   screen was a bordered rectangle of the same weight, stacked with the
   same gutter. Six frames on Home, three identical cards on Rewards,
   four stat boxes on Member. That is what makes an interface read as
   assembled rather than composed, and no amount of manga detail
   applied INSIDE those boxes can fix it, because the boxes are the
   thing you see first.

   A registered section has NO frame. It is defined the way a plate is
   registered on a press: one heavy rule ruled across the full measure
   above it, and a short tick dropping from the left end of that rule.
   Sections then read as divisions of one continuous sheet — which is
   exactly what a manga page is — instead of as objects placed on it.

   The frame is not gone from the system; it is now WORTH something.
   One panel per screen keeps it, and that panel is the lead.
   ══════════════════════════════════════════════════════════════════ */
.reg{position:relative}
.reg > .panel,
.panel.reg{border:0;background:none;height:auto;
  padding:var(--space-panel-lg) 0 var(--space-panel-lg)}
/* the rule, and the registration tick that anchors it to the left */
.reg::before{content:"";position:absolute;z-index:0;
  left:0;right:0;top:0;height:var(--edge);background:var(--ink)}
.reg::after{content:"";position:absolute;z-index:0;
  left:0;top:0;width:var(--edge);height:clamp(16px,2.2vw,30px);
  background:var(--ink)}
/* a quieter division for a secondary section */
.reg--thin::before{height:var(--edge-thin)}
.reg--thin::after{width:var(--edge-thin);height:clamp(12px,1.6vw,20px)}
/* the tick can hang from the right instead, so two registered
   sections side by side are not the same mark twice */
.reg--r::after{left:auto;right:0}

/* THE INK FIELD. One concentrated black mass, and it has to mean
   something — it is never decoration. Applied to the section that
   carries the page's weight. */
.ink-field{background:var(--v6);color:var(--paper);
  padding:var(--space-panel-lg)}
.ink-field ::selection{background:var(--paper);color:var(--v6)}

/* ── BOARD: THE SAME INSTRUMENT (§38) ──────────────────────────────
   The member's reward gauges were rebuilt as discrete stamp tracks —
   a struck register, not a filling tube. The board's milestone bars
   went on being smooth fills, so the club's two audiences were reading
   the same figure off two different instruments. Ten divisions, the
   same overlay technique, keyed to tenths because this bar is a share
   of members rather than a count of stamps. */
.bmile__bar{position:relative;overflow:hidden}
.bmile__bar::after{content:"";position:absolute;inset:0;
  pointer-events:none;z-index:2;
  background-image:repeating-linear-gradient(to right,
    transparent 0 calc(10% - 1px),
    var(--ink) calc(10% - 1px) 10%)}

/* The one piece of OS chrome left in the app: a native select, with a
   system chevron and a system focus ring, sitting inside a page where
   every other control is a ruled line. Same rule, same mono, and a
   mitred mark drawn in CSS instead of the platform's glyph. */
select.input{appearance:none;-webkit-appearance:none;
  padding-right:calc(var(--s4) + 14px);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--ink) 50%),
    linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-size:7px 7px,7px 7px;
  background-position:right 8px center, right 1px center;
  background-repeat:no-repeat}
select.input:focus-visible{outline:none}

/* ── THE MEMBER CHAPTER (§38) ──────────────────────────────────────
   The credential strip: the seal, who this is, and one sentence of
   real state. It used to be a 70px mark and a 20px name in a panel
   tall enough for a headline, which is why the page opened on nothing.
   The nameplate above it now carries the name, so this panel can be
   what it always should have been — a quiet identification band. */
.who{align-items:center}
.who__id{min-width:0}
.who__line{font-size:clamp(12.5px,.95vw,14.5px);color:var(--ink-2);
  margin-top:4px}
.who .rune{color:var(--ink-2)}
@media(min-width:1024px){ .who .rune{display:block} }

/* ── THE MILESTONE LEDGER ──────────────────────────────────────────
   The same three milestones the Rewards chapter renders in full. This
   is the ledger of them, not a second card design: a ruled monospace
   register, one line each, reading tier / name / state / distance.
   One design system, two levels of detail. */
.ledger{list-style:none;margin-top:var(--space-stack);
  border-top:var(--edge-thin) solid var(--ink)}
.ledger__row{display:grid;align-items:baseline;
  grid-template-columns:auto 1fr auto;
  grid-template-areas:"at name state" ". gap gap";
  gap:2px var(--s3);padding:var(--s3) 0;
  border-bottom:var(--rule-hair) solid var(--v3);
  font-family:var(--f-mono);font-size:clamp(11px,1vw,12.5px);
  letter-spacing:.1em;text-transform:uppercase}
.ledger__at{grid-area:at;font-family:var(--f-display);
  font-size:clamp(17px,1.9vw,26px);line-height:.9;color:var(--ink-2);
  letter-spacing:-.03em}
.ledger__name{grid-area:name;color:var(--ink);letter-spacing:.14em}
.ledger__state{grid-area:state;color:var(--ink-2);justify-self:end}
/* Muted text is INK at a lower weight, not tone — this file's own
   rule, and the tier numeral and the distance both broke it at 1.98:1.
   --ink-2 on paper is 5.3:1 and still recedes. */
.ledger__gap{grid-area:gap;color:var(--ink-2)}
/* the tier that is actually reachable is the one carrying weight */
.ledger__row--ready .ledger__at{color:var(--ink)}
.ledger__row--ready .ledger__state{color:var(--seal)}
.ledger__row--claimed .ledger__at{color:var(--ink)}
.ledger__row--claimed .ledger__name{text-decoration:line-through;
  text-decoration-thickness:1.5px;color:var(--ink-2)}
.ledger__foot{margin-top:var(--space-stack);font-size:13px}
@media(min-width:768px){
  .ledger__row{grid-template-columns:auto 1fr auto auto;
    grid-template-areas:"at name gap state";gap:var(--s4)}
  .ledger__gap{justify-self:end;min-width:7ch;text-align:right}
}

/* ── ONE FIGURE LEADS ──────────────────────────────────────────────
   Four plates at identical weight is four figures nobody reads first.
   The ranked one takes the ink weight and the display size; the other
   three stay quiet and support it. */
/* [data-screen="profile"] .stat sets --ink-w at (0,2,0), so a bare
   [data-rank] could never outrank it. Matched here at the same weight
   and later in the file. */
.stat[data-rank="lead"]{--ink-w:3.2;background:var(--v1)}
.stat[data-rank="lead"] b{font-size:clamp(38px,4.6vw,64px);line-height:.86}
.stat[data-rank="lead"] span{color:var(--ink)}

/* ── THE SLOT DOSSIER (§26) ────────────────────────────────────────
   Hover or focus a landed stamp and the check-in behind it is stated:
   meeting number, date, time, method, room. It is a docket rather than
   a tooltip — no radius, no shadow, no arrow, no fade. It is either
   there or it is not, on the same 60ms cut as everything else.

   Anchored to the slot and drawn OVER the grid rather than inside it,
   so a 5-column card does not have to reserve room for a panel that is
   almost never visible. It flips to the left half of the card and up
   from the bottom row by asking where the slot is via :nth-child, not
   by measuring anything at runtime. */
.sealmeta{position:absolute;left:calc(100% - 2px);top:-2px;z-index:40;
  display:none;width:max-content;min-width:132px;
  padding:9px 11px;background:var(--paper);
  border:var(--edge-thin) solid var(--ink);
  font:400 10.5px/1.55 var(--f-mono);letter-spacing:.06em;
  color:var(--ink-2);text-align:left;text-transform:uppercase;
  pointer-events:none}
.sealmeta > *{display:block}
.sealmeta__no{font-weight:700;color:var(--ink);letter-spacing:.14em;
  padding-bottom:5px;margin-bottom:5px;
  border-bottom:var(--rule-hair) solid var(--ink)}
/* the one cinnabar mark the docket is allowed: the corner that says
   which slot it belongs to */
.sealmeta::before{content:"";position:absolute;left:-1px;top:-1px;
  width:10px;height:10px;border:var(--rule) solid var(--seal);
  border-right:0;border-bottom:0}

.seal:hover .sealmeta,
.seal:focus-visible .sealmeta,
.seal:focus-within .sealmeta{display:block}
/* The slot has to come forward with its docket. Every slot sits at
   z-index 1, so at equal depth the later ones in the grid paint over
   the card — the dossier for slot 2 was appearing underneath slots 4
   and 5. */
.seal:hover,.seal:focus-within{z-index:60}
.seal:focus-visible{outline:var(--rule) solid var(--seal);outline-offset:3px}

/* The last two columns would push the docket off the card, so those
   slots hang it to the left instead. Column count differs by tier, and
   each tier states its own rule — asking the grid, not the viewport. */
.seals > .seal:nth-child(5n) .sealmeta,
.seals > .seal:nth-child(5n - 1) .sealmeta{left:auto;right:calc(100% - 2px)}
.seals > .seal:nth-child(5n) .sealmeta::before,
.seals > .seal:nth-child(5n - 1) .sealmeta::before{left:auto;right:-1px;
  border-right:var(--rule) solid var(--seal);border-left:0}
@media(min-width:1024px){
  .seals > .seal:nth-child(5n) .sealmeta,
  .seals > .seal:nth-child(5n - 1) .sealmeta{left:calc(100% - 2px);right:auto}
  .seals > .seal:nth-child(5n) .sealmeta::before,
  .seals > .seal:nth-child(5n - 1) .sealmeta::before{left:-1px;right:auto;
    border-left:var(--rule) solid var(--seal);border-right:0}
  .seals > .seal:nth-child(6n) .sealmeta,
  .seals > .seal:nth-child(6n - 1) .sealmeta{left:auto;right:calc(100% - 2px)}
  .seals > .seal:nth-child(6n) .sealmeta::before,
  .seals > .seal:nth-child(6n - 1) .sealmeta::before{left:auto;right:-1px;
    border-right:var(--rule) solid var(--seal);border-left:0}
}

/* A pointer that cannot hover has nothing to reveal on the way past, so
   the docket opens on tap — which is a focus — and needs to sit where a
   thumb is not already covering it. */
@media(pointer:coarse){
  .sealmeta{font-size:11px;padding:10px 12px}
}

/* ── FAULT CODE ───────────────────────────────────────────────────
   A bracketed monospace token, drawn in CSS so the brackets are the
   system's targeting marks rather than characters that would set in
   whatever the mono face happens to have. Cinnabar, because a dead
   scanner is the one place on this screen the target never lights. */
.codemark{display:inline-block;position:relative;
  font:500 clamp(11px,1.4vw,13px)/1 var(--f-mono);letter-spacing:.22em;
  text-transform:uppercase;color:var(--seal);
  padding:8px 14px}
.codemark::before,.codemark::after{content:"";position:absolute;
  width:11px;height:11px;border:var(--rule-hair) solid var(--seal)}
.codemark::before{left:0;top:0;border-right:0;border-bottom:0}
.codemark::after{right:0;bottom:0;border-left:0;border-top:0}

/* ── SCANNER STATES ───────────────────────────────────────────────
   These classes were toggled in JS and styled nowhere, so a successful
   scan and a rejected one looked identical -- the scanner read as
   unfinished rather than as monochrome. Distinction is carried by
   weight, fill and inversion rather than by hue, because this theme has
   no hue to spend: every accent token resolves to ink. That also
   satisfies "not by colour alone" for free. */
.reticle--live .reticle__c{border-width:var(--edge-thin)}
/* The sweep line reads as "something is being scanned", so it is drawn
   only while something is. It used to be visible in every state that
   did not explicitly hide it — including `boot`, where a cinnabar line
   sat across the frame while the browser was still asking for camera
   permission and there was nothing behind it at all. */
.reticle__line{top:50%;opacity:0}
.reticle--live .reticle__line{opacity:.9}
/* steps(), not ease-in-out. Everything else in this system cuts; a
   sweep that accelerates and decelerates was the one soft gesture left
   on the screen, and it read as an app animation rather than as a
   mechanism ticking down the frame. */
.reticle--live .reticle__line{animation:retSweep 2.4s steps(14,end) infinite}

/* ── WAITING FOR THE CAMERA ───────────────────────────────────────
   The frame's own marks recede while the loader turns, so the moving
   mark is the one thing there is to look at. */
.reticle--wait .reticle__geo,
.reticle--wait .reticle__mark{opacity:.16}

/* ── WORKING ──────────────────────────────────────────────────────
   The code is read and the server has not answered yet. The corners
   hold at full weight — the frame has hold of something — and blink on
   a two-step cycle, while the sweep line parks dead centre. Held plus
   blinking cannot be confused with the searching state (sweeping, thin)
   or with the refusal (filled, still). */
.reticle--busy .reticle__c{border-width:var(--edge-heavy);
  animation:busyHold 260ms steps(1,end) infinite alternate}
.reticle--busy .reticle__line{top:50%;opacity:.9;
  animation:busyBar 520ms steps(4,end) infinite}
.reticle--busy .reticle__geo,
.reticle--busy .reticle__mark{opacity:.5}
@keyframes busyHold{
  from{border-color:var(--ink)}
  to  {border-color:var(--v3)}
}
@keyframes busyBar{
  from{transform:scaleX(.12);transform-origin:left}
  to  {transform:scaleX(1);transform-origin:left}
}

.reticle--good .reticle__c{border-width:var(--edge-heavy)}
.reticle--good .reticle__geo,
.reticle--good .reticle__mark{opacity:.85}
.reticle--good .reticle__line{opacity:0}

/* ── REFUSED ──────────────────────────────────────────────────────
   "The UI shouldn't just show a small red error text; the central
   frame should snap violently and flash starkly."

   So it does. The frame floods to solid ink three times in 270ms and
   kicks sideways — `steps()`, so every change is a cut with nothing
   in between. You cannot miss it and you cannot mistake it for the
   success state, which tightens quietly instead. */
.viewer--bad{animation:refuse 90ms steps(1,end) 3,refuseKick 60ms steps(2,end) 2}
/* Floods to PAPER, not ink. The viewfinder is already a black box, so
   an ink flash over it was a change nobody could see — the loud move
   on a dark field is inversion. Three white cuts over the camera feed
   in 270ms. */
@keyframes refuse{
  0%,100%{box-shadow:inset 0 0 0 0 var(--paper)}
  50%    {box-shadow:inset 0 0 0 100vmax var(--paper)}
}
@keyframes refuseKick{
  0%  {transform:translateX(0)}
  50% {transform:translateX(-7px)}
  100%{transform:translateX(7px)}
}
/* refused: the corners close into a solid block and the sweep stops */
.reticle--bad .reticle__c{border-width:var(--edge-thin);background:var(--ink)}
.reticle--bad .reticle__geo,
.reticle--bad .reticle__mark{opacity:.12}
.reticle--bad .reticle__line{opacity:0}

/* the frame itself answers: ink border thickens on a hit */
.viewer--hit{border-width:var(--edge-shout)}

.viewer__msg{padding:6px 12px;transition:background var(--snap) linear,color var(--snap) linear}
.viewer__msg--hot{background:var(--ink);color:var(--paper)}
.viewer__msg--soft{background:var(--paper);color:var(--ink);
  border:var(--rule-hair) solid var(--ink)}
/* the refusal states a fault code, and it states it in the one place
   red is allowed on this screen — the target has just refused */
.reticle--bad ~ .viewer__status .viewer__msg,
.viewer--bad .viewer__msg{background:var(--paper);color:var(--seal);
  border:var(--edge-thin) solid var(--seal);font-weight:700;letter-spacing:.2em}

@keyframes retSweep{
  from{top:6%;opacity:.4}
  to  {top:94%;opacity:.9}
}
@media (prefers-reduced-motion:reduce){
  .reticle--live .reticle__line{animation:none}
  /* working still has to be distinguishable from stopped, so the
     corners simply hold heavy and the bar holds half-drawn */
  .reticle--busy .reticle__c{animation:none}
  .reticle--busy .reticle__line{animation:none;
    transform:scaleX(.55);transform-origin:left}
  /* the refusal still has to be unmistakable without motion, so the
     flash becomes a held state rather than being dropped */
  .viewer--bad{animation:none;border-color:var(--seal);
    border-width:var(--edge-shout)}
}

/* ── BUTTON HIERARCHY AND STATES ──────────────────────────────────
   .btn--go is the primary action everywhere in the app, but outside the
   auth screen it had no treatment at all -- "Open check-in" and "Delete"
   rendered identically to "Cancel". Filling it with ink is the same move
   .btn--hot already makes, so this adds hierarchy without adding a new
   visual language.

   :active and :focus-visible were missing entirely. The hover lift had
   nothing to press back down into, and keyboard users got no ring. */
.btn--go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn--go:hover{background:var(--ink-2);border-color:var(--ink-2)}

.btn:active{transform:translate(0,0)}
.btn--go:active{background:var(--ink);border-color:var(--ink)}

.btn:focus-visible,
.chip:focus-visible,
.link:focus-visible,
.brow__del:focus-visible{outline:var(--edge-thin) solid var(--ink);outline-offset:3px}
.btn--go:focus-visible{outline-color:var(--ink);outline-offset:3px}

/* the destructive action reads as destructive through weight, not hue:
   this theme has no red to spend */
.bconfirm .btn--go{background:var(--ink);border-width:var(--edge-thin)}

/* ── SCANNER LEGIBILITY OVER AN ARBITRARY CAMERA IMAGE ────────────
   Verdict on the black-and-white question: monochrome STAYS. Every
   accent token in this theme resolves to ink, so a colour scanner would
   be the single coloured element in the whole app -- colour for its own
   sake, which is the thing to avoid.

   What actually made it look unpolished is that the overlay was ink
   drawn straight onto live video. That reads fine over a bright wall and
   disappears over a dark one, and the camera image is the one thing here
   nobody controls. So the overlay now carries its own contrast: the
   status is a paper chip in every state, and the reticle gets a paper
   halo so its edges hold against a dark scene. */
.viewer__msg{background:var(--paper);color:var(--ink);
  padding:7px 14px;border:var(--rule-hair) solid var(--ink)}

/* drop-shadow follows the painted L of each corner; box-shadow would
   ring the whole element box and turn the brackets into solid squares */
/* Two paper passes over a 2.5px cinnabar stroke bleached the target
   to white — the halo swallowed the mark it was meant to protect. One
   tight paper ring, then a dark one outside it: the red core survives,
   and the pair holds against a bright wall and a dark room alike. */
.reticle__c,
.reticle__line{filter:drop-shadow(0 0 1.1px var(--paper))
                      drop-shadow(0 0 2px rgba(0,0,0,.65))}
.reticle__geo,
.reticle__mark{opacity:.42;filter:drop-shadow(0 0 1.5px var(--paper))}
.reticle--good .reticle__geo,
.reticle--good .reticle__mark{opacity:.9}

</style>
<style>
/* ══════════════════════════════════════════════════════════════════
   KEYSTAMP — VISUAL IDENTITY
   "Spotted black, screentone, line."

   The design thesis is that this app's materials are already manga's
   materials. A tankōbon is sumi ink printed on warm kozo pulp. A hanko
   is pressed in shuniku, the vermilion seal paste. Keystamp is an app
   about *stamping*. So the palette is not a mood applied on top of the
   product — it is what the product is physically made of.

   That gives three surfaces and one accent, and a rule for when each
   is used:

     PAPER   the reading surface. Most of the app lives here.
     INK     a flooded panel. Used only for impact: the sign-in, the
             projected code, the scanner, an unlocked reward. In a
             manga these are the pages where the art goes full bleed.
     SEAL    vermilion. Reserved for the stamp itself and for the one
             action that matters on a screen. Never a background.

   The rule is compositional, not decorative: strip every colour out
   and the identity survives as inversion, gutters and keylines.
   ══════════════════════════════════════════════════════════════════ */

:root{
  /* ── LIGHT: ink on warm pulp ──────────────────────────────────── */
  --kozo:      #F1ECE2;   /* warm pulp. the page                     */
  --sumi:      #12100D;   /* warm black. never blue-black            */
  --shu:       #E53935;   /* CINNABAR. the seal paste                */
  --shu-deep:  #C62828;   /* the same mark, pressed harder           */

  /* ── the ramp between them ──────────────────────────────────────
     The ink end of the ramp was #211E1A — a warm black, but a soft
     one. "Absolute contrast" is the first principle of this system,
     and a 12.9:1 ink was doing the work of a 16.8:1 one. The two ink
     steps are deepened toward absolute while keeping their warmth
     (they are still red-shifted, never blue-black), which is what
     makes the paper read as paper rather than as grey. Everything
     between them is unchanged: the tonal structure of the page and
     the whole responsive pass that depends on it still hold. */
  --v0:#FDFDFC;           /* page highlight, the raised edge of pulp */
  --v1:#F7F7F5;           /* paper                                    */
  --v2:#E6E5E1;           /* recessive fill                           */
  --v3:#A9A8A2;           /* screentone body                          */
  --v4:#5E5D58;           /* muted ink                                */
  --v5:#0A0A0A;           /* ink — structural                         */
  --v6:#000000;           /* flooded ink — absolute                   */

  --kozo-2:    #E6E5E1;
  --kage:      #111111;   /* ink panel, one step off pure             */

  --paper:var(--v1);
  --paper-2:var(--v2);
  --ink:var(--v5);
  --ink-2:var(--v4);
  --tone:var(--v3);
  --tone-lt:var(--v2);

  /* ══ THE SEAL ═══════════════════════════════════════════════════
     One colour, and it is not a theme — it is shuniku, the vermilion
     paste a hanko is pressed in. It appears where something has been
     VERIFIED or where the system is asking you to aim, and nowhere
     else. If you can see two red things on a screen at once, one of
     them is wrong.

     Deliberately NOT wired into --crimson / --burg / --oxblood /
     --line-hot. Those aliases exist for the FX layer and currently
     resolve to ink; giving them red would put the accent in a dozen
     places at once, which is exactly how an accent stops meaning
     anything. Every use of --seal below is written out by hand. */
  --seal:var(--shu);
  --seal-deep:var(--shu-deep);

  --crimson:var(--v6);
  --burg:var(--v6);
  --oxblood:var(--v6);
  --ember:var(--v4);
  --line-hot:var(--v6);

  --void:var(--v6);  --ink-bg:var(--kage);
  --lacquer:var(--kage); --lacquer-2:#251E19; --well:var(--v2);
  --bone:var(--v0);  --chalk:var(--v2);
  --ash:var(--v3);   --faint:var(--v4);  --beige:var(--v2);
  --steel:var(--v2); --steel-2:var(--v3);
  --line:var(--ink); --line-2:var(--v4); --line-3:var(--v3);

  /* ── screentone. one dot field, three densities ───────────────── */
  --tone-dot:  rgba(23,19,15,.20);
  --tone-fine: 4px;
  --tone-mid:  6px;
  --tone-wide: 9px;

  /* ── motion ───────────────────────────────────────────────────── */
  --press: cubic-bezier(.2,.9,.25,1);
}

/* ══ THE PAGE ══════════════════════════════════════════════════════
   Paper is not flat. Real pulp has tooth, and a printed page has the
   faint regular grid of the halftone screen under the art. Two very
   low-contrast layers do that here: a fine dot screen and a warm
   vignette toward the gutter. Both are cheap and neither moves. */
body{
  /* ONE sheet. The page used to carry a --kozo tone and a top-down
     vignette, so the area below the rail read as a second, warmer
     surface butted against the first — a visible seam across every
     screen once the paper moved to #F7F7F5. There is one paper now,
     edge to edge, and the only thing on it is the dot screen that
     establishes scale. The vignette is gone: a soft directional wash
     is the one gradient this system has no use for. */
  background-color:var(--paper);
  background-image:radial-gradient(var(--tone-dot) .5px, transparent .6px);
  background-size:var(--tone-wide) var(--tone-wide);
  color:var(--ink);
}

/* ══ INK PANELS ════════════════════════════════════════════════════
   sparingly: four screens in the whole app. Inside one, the ramp
   inverts — paper becomes ink and ink becomes paper — so every child
   component inherits the flip without needing its own dark variant.
   That is what keeps this from being a second design system. */


/* ══ THE SEAL — the signature element ══════════════════════════════
   A hanko impression. It is the logo, it is what a stamp looks like
   when you earn one, and it is the chop in the corner of a finished
   panel. One bold thing, used in three places, so it reads as a mark
   rather than as ornament.

   The wobble on the border and the slight rotation matter: a real
   chop is pressed by hand and never lands square. */
.chop{
  --chop-size:clamp(38px,5vw,54px);
  position:relative;display:inline-grid;place-items:center;
  width:var(--chop-size);height:var(--chop-size);
  border:2.5px solid var(--ink);
  border-radius:0;
  color:var(--ink);
  font-family:var(--f-display);
  font-size:calc(var(--chop-size) * .34);
  line-height:1;letter-spacing:.02em;
  transform:rotate(-4deg);
  background:
none;
}
.chop::after{                     /* the ink that squeezed out */
  content:'';position:absolute;inset:-3px;border-radius:0;
  border:1px solid var(--ink);opacity:.30;
  transform:rotate(2.5deg);pointer-events:none;
}
.chop--filled{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chop--ghost{border-color:var(--tone);color:var(--tone);opacity:.55;transform:rotate(-1deg)}
.chop--ghost::after{border-color:transparent}

/* ══ PANELS ════════════════════════════════════════════════════════
   Manga panels are defined by the gutter, not the border. The white
   channel between frames is what makes a page read as a page. So the
   keyline gets heavier and the gutter gets real. */
.panel{
  background:var(--paper);
  /* style and colour only. The shorthand used to carry a width, and a
     width declared in the LAST stylesheet beats the calc() that
     --ink-w drives from an earlier one — so every panel on every
     screen measured var(--edge) and no panel could ever be ranked
     heavier or quieter than any other. The width comes from --ink-w. */
  border-style:solid;
  border-color:var(--ink);
  position:relative;
}

/* a panel that carries the accent: one per screen, maximum */
:where(.panel--seal){
  --ink-w:6;
}
.panel--seal::before{
  content:'';position:absolute;left:0;right:0;top:0;height:var(--edge-thin);
  background:var(--ink);
}

/* ══ TYPE ══════════════════════════════════════════════════════════
   Dela Gothic is already the right display face — heavy, Japanese,
   built for impact. What it lacked was scale contrast. A manga page
   is loud and quiet in the same frame; the type scale has to be too. */
.title{
  letter-spacing:-.02em;
  line-height:.88;
  text-wrap:balance;
}
.kicker{color:var(--ink-2);letter-spacing:.26em}


/* the vertical Japanese marker, now an accent rather than grey noise */
.jp{color:var(--tone);opacity:.9}

/* ══ ACTION ════════════════════════════════════════════════════════
   The primary action is the seal being pressed. Ink fill, and on
   press it deepens rather than lifting — a stamp goes down. */
.btn--go{
  background:var(--ink);border-color:var(--ink);color:var(--paper);
  font-weight:600;
}
.btn--go:hover{background:var(--v6);border-color:var(--v6)}
.btn--go:active{transform:translate(1px,1px)}

/* ══ NAVIGATION ════════════════════════════════════════════════════
   The active chapter is stamped, not highlighted. */
/* The chapter numerals are a page-number device: the label beside each
   one carries the meaning, and the numeral marks the rhythm. They sat
   at --v2, a step off the paper itself, which read as half-rendered
   rather than quiet; then at --v3, which measured 1.98:1 in the rail
   and 2.2:1 in the tab bar — recessive past the point of being
   readable, on the one control every screen depends on. --ink-2 is
   4.97:1 and still plainly the quiet state beside the active
   numeral's full ink. Muted text is ink at a lower value, not tone. */
.rail__no,.tab__no{color:var(--ink-2)}
.rail__link[aria-current],
.tab[aria-current]{color:var(--ink)}
.rail__link[aria-current] .rail__no,
.tab[aria-current] .tab__no{color:var(--ink)}
.rail__ind,.tabs__ind{background:var(--ink)}

/* ══ THE SEAL, APPLIED ══════════════════════════════════════════════
   The only places cinnabar is allowed to appear.

   1. A verdict — the moment attendance becomes a stamp.
   2. The scanner's frame, when it is asking you to aim.
   3. A field you are typing into.
   4. A destructive confirmation.

   That is the entire list. Everything else in this application is ink
   on paper, which is what makes these four read as loud. */
/* ONE mark, not three. The rule this file states is that two red
   things on a screen means one of them is wrong — and the first pass
   put the chop, its caption AND the "+1" in cinnabar, which is three.

   The impression and its legend are a single object: a hanko and the
   word under it. That is the red. Everything below is the record of
   what the stamp did, and a record is written in ink. */
.verdict__seal circle,.verdict__seal polygon,
.verdict__seal path,.verdict__seal line{stroke:var(--seal)}
/* SEALED IS THE MARK.

   It was an 11px mono label above a 58px "Stamp acquired" — the
   product's own word for what just happened, set smaller than the
   sentence describing it. It is the graphic now: display size,
   cinnabar, struck a few degrees off square because a stamp pressed
   by hand never lands true. The sentence becomes the caption it
   always was. */
.verdict__state{color:var(--seal);font-family:var(--f-display);font-weight:400;
  font-size:clamp(46px,13vw,132px);line-height:.82;letter-spacing:-.03em;
  text-transform:uppercase;transform:rotate(-3.2deg);margin-top:clamp(6px,1.4vw,14px)}
.verdict__title{font-family:var(--f-body);font-weight:500;
  font-size:clamp(13px,1.5vw,17px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);margin-top:clamp(10px,1.6vw,18px)}
/* the confirmation lands slightly off-axis, the way a hand-pressed
   chop never lands square */
.verdict__title{transform:none}
.verdict__delta{color:var(--ink)}

/* ══ STATE ═════════════════════════════════════════════════════════
   Status carries meaning, so it carries the accent — but only the
   live one. Past and upcoming stay in ink, which keeps the red rare
   enough to mean something. */
.bstate--open{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seal--set,.rec--set .rec__node{color:var(--ink)}
.entry--set .entry__verdict{color:var(--ink)}

/* ══ SCANNER ═══════════════════════════════════════════════════════
   Verdict on the colour question: the camera image stays desaturated,
   but the FRAME is vermilion. Keeping the feed monochrome is what
   makes the overlay legible over an image nobody controls, and it
   holds the manga register. Putting the accent in the reticle instead
   gives the screen its colour where colour actually does work —
   telling you where to aim and whether it worked. */
/* The frame is ink; the TARGET is cinnabar. Aiming is the one moment
   the app asks for the accent, and the sweep line that reads the code
   carries it too — over an arbitrary camera image a red line is the
   only mark guaranteed to be visible against both a bright wall and a
   dark one. */
.viewer{border-color:var(--ink)}
.reticle__c{border-color:var(--seal)}
.reticle--good .reticle__c{border-color:var(--seal);background:var(--seal)}
/* Refused: the target fills solid. Ink-on-black was a state change you
   could not see; the same element that aims in cinnabar refuses in it,
   which spends no new colour. */
.reticle--bad .reticle__c{background:var(--seal);border-color:var(--seal)}
.reticle__line{background:var(--seal)}
.viewer--hit{border-color:var(--seal)}
.viewer__msg{border-color:var(--ink)}
.viewer__msg--hot{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ══ THE QR ════════════════════════════════════════════════════════
   The code stays pure black on pure white — that is a scanning
   requirement, not a style choice, and nothing is drawn over it. The
   personality goes in the frame around it. */
/* The code stays pure black on pure white — a scanning requirement,
   not a style choice. The frame around it is a heavy rule, not a
   shadow: nothing in this system floats. */
.qrpanel__code--big{
  background:#FFFFFF;
  border:var(--edge-heavy) solid var(--sumi);
}

/* ══ SPEED LINES ═══════════════════════════════════════════════════
   Used once per impact screen, behind the title, at low contrast.
   A rake of converging lines is the cheapest manga signal there is,
   and it costs one pseudo-element. */
.rake{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.10}
.rake::before{
  content:'';position:absolute;left:50%;top:50%;
  width:200%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    var(--ink) 0deg .35deg, transparent .35deg 3deg);
  mask-image:radial-gradient(circle, transparent 22%, #000 62%);
}


/* ══ REDUCED MOTION / FOCUS FLOOR ══════════════════════════════════ */
:focus-visible{outline-color:var(--ink)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}

/* ══ SIGN-IN ═══════════════════════════════════════════════════════
   The first screen has one job: say whose app this is before the form
   is even read. The chop lands left, the wordmark sits against it,
   and the speed-line rake sits behind both. */
.authmark{display:flex;align-items:center;gap:var(--s4);
  margin-bottom:var(--s5);position:relative;z-index:1}
.authmark__wm{font-family:var(--f-display);font-size:clamp(19px,2.4vw,26px);
  line-height:1;letter-spacing:-.01em;color:var(--ink)}
.authmark__wm b{font-weight:400}
/* 9.5px of --tone under the wordmark was the least readable text in the
   application, and it is the line that says what the product is. It
   joins the 11px floor and the ink-2 ramp like every other caption. */
.authmark__wm em{display:block;margin-top:7px;
  font:500 clamp(11px,2.8vw,12px)/1.3 var(--f-mono);
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-style:normal}

[data-screen="auth"] .view{position:relative}
[data-screen="auth"] .authp{position:relative;z-index:1}

/* the mark inside the chop is the key device, not a glyph: the display
   face has no kanji coverage and fell back to a mismatched font */
.chop__key{width:58%;height:58%;fill:none;stroke:currentColor;
  stroke-width:5;stroke-linecap:square;stroke-linejoin:miter;
  vector-effect:non-scaling-stroke}
.chop--filled .chop__key{stroke:var(--paper)}

/* ══ SIGN-IN COMPOSITION ═══════════════════════════════════════════
   The form was floating in the top third of a flooded page with two
   thirds of dead ink under it. Centring the stack and capping its
   measure makes the page read as a deliberate title card. */
/* svh, not vh: on iOS the address bar makes `100vh` taller than the
   screen actually is, so a centred form is pushed under the fold on
   first paint and jumps when the bar collapses. `min-height` (never
   `height`) so a short landscape phone scrolls instead of cropping the
   form, and the cap keeps the card from floating in the middle of a
   1440px-tall monitor. */
[data-screen="auth"] .view{
  min-height:min(100svh, 900px);
  display:flex;flex-direction:column;justify-content:center;
  max-width:min(640px, 100%);
  margin-inline:auto;
  padding-block:var(--s6);
}
/* The margin belongs to the section, not to the panel inside it. On
   the panel it opened an 18px gap between the registration ghost
   (which is `inset:0` on the section) and the panel the ghost is
   supposed to sit behind — so the ghost painted as a solid ink bar
   above and below the sign-in form at every viewport. */
[data-screen="auth"] .view > .rig{margin-top:var(--s5)}

/* ══ THE SEAL GRID ═════════════════════════════════════════════════
   An unearned seal was ink-on-ink and effectively invisible, so the
   record read as an empty black field. A blank seal is now a ghost
   chop: the outline of the mark waiting to be pressed, which also
   makes the earned ones land harder by contrast. */
/* An unearned slot is an empty box waiting to be pressed: a hairline
   of muted ink, solid (never dashed — dashed reads as "disabled form
   field", and these are not controls). An earned one is the stamp
   itself: absolute ink, edge to edge. The difference between the two
   is the whole mechanic of the product, so it is the largest contrast
   on the page. */
.seal{border-color:var(--v3);border-style:solid;background:transparent}
.seal:not(.seal--set){opacity:1;border-width:var(--edge-hair)}
.seal:not(.seal--set) .seal__mark{opacity:.3}
.seal--set{border-color:var(--v6);background:var(--v6);opacity:1;
  border-style:solid;border-width:var(--edge-hair)}
/* A landed stamp is solid ink, so its ordinal has to be paper. This
   said `--ink`, which put an ink numeral on an ink cell — 1.18:1, i.e.
   the count was invisible on exactly the stamps that had been earned. */
.seal--set .seal__no{color:var(--paper)}



/* ══ THE CALM STRIKE ═══════════════════════════════════════════════
   .strike is a dark card with light type. .strike--calm flips the
   surface to paper but its children kept the colours written for the
   dark base, so the Scan card on Home rendered light-on-light and was
   effectively invisible.

   In the three tiers, "no meeting is open" is the SCREENTONE state:
   present, but not the thing being pointed at. So it gets a tone
   ground and ink type — recessive, not absent. */
.strike--calm{border-color:var(--ink-2)}
.strike--calm .strike__arrow{background:var(--ink-2);border-color:var(--ink-2)}

/* The chamber is paper, so its type is ink. The only inverted surface
   is the target block inside it, which carries its own colours. */
.strike,.strike .strike__verb{color:var(--ink)}
.strike .strike__sub{color:var(--ink-2)}
.strike .strike__arrow svg{stroke:var(--paper)}
.strike:hover .strike__arrow svg,
.strike:focus-visible .strike__arrow svg{stroke:var(--ink)}

/* ══════════════════════════════════════════════════════════════════
   RECORD — the page that is literally a record being built
   ══════════════════════════════════════════════════════════════════
   The three tiers do the whole job here. A meeting you attended is a
   spotted black; a meeting you missed is a tone ghost; the structure
   between them is line. Read down the page and the pattern of solid
   blocks IS your attendance, before a single number is parsed. */
[data-screen="record"] .log{gap:var(--edge-thin)}

[data-screen="record"] .entry{
  border:var(--edge-hair) solid var(--ink);
  background:var(--paper);
  padding:var(--s4);
  position:relative;
  transition:transform var(--snap) linear;
}
/* attended: inked in */
[data-screen="record"] .entry--set{
  background:var(--ink);color:var(--paper);border-color:var(--ink);
}
[data-screen="record"] .entry--set .entry__no,
[data-screen="record"] .entry--set .entry__verdict{color:var(--paper)}
[data-screen="record"] .entry--set .entry__meta{color:var(--tone-lt)}
[data-screen="record"] .entry--set .entry__ghost{color:rgba(255,255,255,.10)}

/* missed: screentone, present but not claimed */
[data-screen="record"] .entry--miss{
  background-image:radial-gradient(var(--tone-dot) .5px, transparent .6px);
  background-size:var(--tone-40) var(--tone-40);
  border-style:dashed;border-color:var(--tone);
}
[data-screen="record"] .entry--miss .entry__no{color:var(--ink-2)}
[data-screen="record"] .entry--miss .entry__verdict{color:var(--tone)}

/* the big ghost numeral behind each cell is the panel's page number */
[data-screen="record"] .entry__ghost{
  font-family:var(--f-display);opacity:1;color:rgba(33,30,26,.07);
}

/* ══════════════════════════════════════════════════════════════════
   REWARDS — three panels, three states, no store front
   ══════════════════════════════════════════════════════════════════
   Locked is line only. Unlocked is screentone with a heavy keyline —
   it has arrived but is not yet taken. Claimed is the spotted black,
   the seal pressed. That escalation is the whole reward moment. */
/* ══ REWARDS — THREE STATES, THREE WEIGHTS ═════════════════════════
   A dossier that is sealed, one that is ready to be opened, and one
   that has been claimed. The escalation is carried entirely by edge
   weight and ink coverage — no textures, no fills laid across type. */
.tech{
  border:var(--edge-hair) solid var(--v3);
  background:var(--paper);
  position:relative;overflow:hidden;
}
/* SEALED: a hairline and muted type. Present, closed, quiet. */
.tech--sealed{border-style:solid;border-color:var(--v3)}
.tech--sealed .tech__name{color:var(--ink-2)}
.tech--sealed .tech__glyph{opacity:.34}

/* READY: the heaviest keyline in the list, and a solid ink bar down
   the leading edge — the tab of a file that is ready to be pulled. */
.tech--open{
  border:var(--edge) solid var(--ink);
  background:var(--paper);
}
.tech--open::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:var(--edge-shout);
  background:var(--seal);
}
.tech--open{padding-left:calc(var(--s5) + var(--edge-shout))}
.tech--claimed{                      /* claimed: the seal is pressed */
  background:var(--ink);color:var(--paper);border-color:var(--ink);
  border-width:var(--edge);border-style:solid;
}
.tech--claimed .tech__name,
.tech--claimed .tech__req,
.tech--claimed .tech__state{color:var(--paper)}
.tech--claimed .tech__glyph{color:var(--paper);opacity:.9}
.tech--claimed .tech__req{color:var(--tone-lt)}

/* ══════════════════════════════════════════════════════════════════
   BOARD — the same book, administrative chapters
   ══════════════════════════════════════════════════════════════════ */
/* figures are the subject of Club Tools, so they get display scale and
   a tone ground rather than four equal boxes in a row */
.bstats{gap:var(--edge-thin)}
.bstat{
  border:var(--edge-hair) solid var(--ink);background:var(--paper);
  padding:var(--s4) var(--s4) var(--s5);
}
.bstat:first-child{
  background:var(--ink);color:var(--paper);border-color:var(--ink);
}
.bstat:first-child b{color:var(--paper)}
.bstat:first-child span{color:var(--tone-lt)}
.bstat b{font-size:clamp(26px,3.4vw,40px);line-height:.9}
.bstat span{color:var(--ink-2)}

/* the next meeting is the subject of the page */
.bnext{
  border:var(--edge) solid var(--ink);
  background-image:radial-gradient(var(--tone-dot) .5px, transparent .6px);
  background-size:var(--tone-25) var(--tone-25);
}
.bnext--live{
  background:var(--ink);color:var(--paper);border-width:var(--edge-heavy);
  background-image:none;
}
.bnext--live .bactive__no,.bnext--live .muted{color:var(--paper)}
.bnext--live .bstate--open{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* milestone bars: fill is a spotted black on a line track */
.bmile__bar{border:var(--edge-hair) solid var(--ink);background:var(--paper);height:10px}
.bmile__fill{background:var(--ink)}
.bmile__no{color:var(--ink)}

/* rows read as a register: hairline rules, no boxes */
.brow{border-bottom:var(--edge-hair) solid var(--tone)}
.brow:hover,.brow:focus-visible{background:var(--paper-2)}
.brow__no{color:var(--ink-2)}
.brow__n{font-family:var(--f-display)}

/* delete confirmation: inked, so it is unmistakably a different mode */
.brow--confirm{background:var(--ink);color:var(--paper)}
.brow--confirm b,.brow--confirm .muted{color:var(--paper)}
.brow--confirm .btn{background:transparent;color:var(--paper);border-color:var(--paper)}
.brow--confirm .btn--go{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.brow__del{border-color:var(--tone);color:var(--ink-2)}
.brow__del:hover,.brow__del:focus-visible{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* the board form is a panel of the same book */
.bform{border-bottom:var(--edge) solid var(--ink);padding-bottom:var(--s5)}
.bsec{border-bottom:var(--edge-thin) solid var(--ink);color:var(--ink)}

/* ── Rewards polish ───────────────────────────────────────────────
   The "Unlocks at N stamps" line is real information, not a caption,
   so it sits at ink-2 rather than tone. And removing the old blurb
   left a hole in the locked cards — they collapse to their content
   now instead of holding a paragraph's worth of empty. */
/* The requirement line is rendered as `.tech__at`, not `.tech__req` —
   the older class was left over from a previous markup pass, so every
   rule written for it matched nothing and the line stayed at --tone
   (#B0A99C) on a hatched ground: under 2:1 against the paper, on the
   one sentence that answers "how far am I?". Both names are set, so
   whichever the view renders is legible. */
.tech__req,.tech__at{color:var(--ink-2);letter-spacing:.08em}
.tech--sealed .tech__req,.tech--sealed .tech__at{color:var(--ink-2)}
.tech{min-height:0}
.tech--sealed{padding-bottom:var(--s4)}
.tech--sealed .tech__body{min-height:0}
.tech__state{font-family:var(--f-mono);letter-spacing:.16em}
.tech--open .tech__state{background:var(--ink);color:var(--paper);
  border-color:var(--ink);padding:5px 9px}
/* the sealed chip is a stamped label, not a status pill */
.chip--sealed{border-style:solid;border-color:var(--v3);color:var(--ink-2);
  letter-spacing:.22em}

/* ── Record polish ────────────────────────────────────────────────
   +1 stamp is the payoff on an inked row, so it gets paper weight. */
[data-screen="record"] .entry--set .entry__verdict{color:var(--paper);font-weight:600}

/* ══ NARROW — the base, not an exception ═════════════════════════════
   A phone page is a single column of stacked frames, which is how a
   tankōbon is read anyway. Panels lose their offset shadow (it costs
   horizontal room), keylines thin one step so the frames do not eat
   the content, and every tap target clears 44px.

   This used to be a `max-width:560px` block with a second
   `max-width:400px` block under it that made the title BIGGER on the
   narrowest screens (a 34px floor against a 24px default) and dropped
   the board figures to one per row at 390px — the width most phones
   actually are. Both were device-specific corrections fighting the
   scale rather than setting it. Written as the base state instead,
   with the shadows and weights returning once there is room. */
/* These set the DEFAULT weight; they must not set THE weight.

   Written as `border-width`, they made every panel one thickness
   whatever its rank — identity.css is the last stylesheet, so a fixed
   border-width here beat the calc() that --ink-w drives, and the
   entire data-rank hierarchy was inert on panels. A lead panel and a
   quiet one measured the same 3px. `--ink-w` is the dial; this only
   says where it rests, and :not([data-rank]) keeps it from touching a
   panel that has stated its own rank. */
.panel{box-shadow:none}
/* :where(), so this is a DEFAULT and not a decision.
   `.panel:not([data-rank])` looked like a default but carried (0,2,0)
   from the last stylesheet in the chain, which is more than every rank
   rule in artdirection.css — `[data-screen="home"] .hero{--ink-w:4.4}`
   is (0,2,0) too and loses on order. So the hero, the viewfinder, the
   auth panel and the QR panel all still measured the base weight. At
   zero specificity anything that has an opinion wins, which is what a
   default is for. */
:where(.panel){--ink-w:2}
:where(.panel--seal){--ink-w:3}

[data-screen="record"] .entry{padding:var(--s3)}
[data-screen="record"] .entry__meta{font-size:clamp(11.5px,3vw,13px)}

.bstat b{font-size:clamp(22px,6vw,30px)}
.bnext{padding:var(--s4)}
.bmile{grid-template-columns:auto 1fr;gap:var(--s3)}

.brow{padding-block:var(--s3)}
.brow__del{min-height:38px;padding:8px 10px}

.btn,.chip,.link{min-height:44px}
.authmark{gap:var(--s3);flex-wrap:wrap}
.authmark__wm{font-size:clamp(19px,5vw,26px)}

.log{gap:var(--edge-thin)}

@media (min-width:768px){
  :where(.panel){--ink-w:3}
  :where(.panel--seal){--ink-w:6}
  [data-screen="record"] .entry{padding:var(--s4)}
  .bnext{padding:var(--s5)}
}


/* ══════════════════════════════════════════════════════════════════
   DARK — the same book, printed white on black
   ══════════════════════════════════════════════════════════════════
   Not a mechanical inversion. The ramp is authored: warm near-blacks
   that keep the paper's temperature, a screentone that still reads as
   dots rather than mud, and text that stops short of pure white
   because pure white on near-black glares.

   The grammar is unchanged. Emphasis is still the solid mass — it is
   simply made of the other ink. A "spotted black" becomes a spotted
   white, and the three tiers keep their exact relationship:
   solid > screentone > line. */




/* ── the flood, in dark ───────────────────────────────────────────
   Inverting to paper here would fight the theme the user chose. So a
   flooded page goes DEEPER instead: the surface drops to a true void
   and panels lift off it. The composition keeps its meaning — this
   page is further from the reading surface than the rest of the book —
   without turning a dark app briefly white. */




/* ══ FLOOD, RESTATED LAST ══════════════════════════════════════════
   The light+flood ramp was being outranked somewhere in the cascade,
   which left the flooded screens (sign-in, scan, projected code) with
   near-paper text on paper — invisible. Restating it here with the
   element qualifier settles it, and body is set explicitly because it
   is the surface the reader actually sees. */




/* ══════════════════════════════════════════════════════════════════
   POLISH PASS — consistency, touch, and mobile composition
   ══════════════════════════════════════════════════════════════════ */

/* ── 1. A single control size ─────────────────────────────────────
   Buttons, chips, links and inputs were landing anywhere between 32px
   and 40px tall. One floor, one rhythm, and 44px on touch so nothing
   in the app needs a careful finger. */
.btn,.chip,.motion-btn,.input,.brow__del,.section-link{
  min-height:38px;
}
.motion-btn{padding:0 var(--s4)}
.section-link{padding:0 var(--s3)}

/* ── 2. A type floor ──────────────────────────────────────────────
   Secondary information was sitting at 9–10px, which is legible on a
   1200px monitor and not on a phone held at arm's length. The mono
   labels keep their wide tracking — that is what makes them read as
   manga captions — but they stop shrinking below 11px. */
.kicker{font-size:clamp(11px,.55vw + 9.2px,13px)}
/* the volume line is a sentence, so it takes the type floor and the
   ink ramp like every other sentence in the app */
.rail__vol{font-size:11px;line-height:1.5;color:var(--ink-2)}
/* an unearned seal's ordinal was tone-on-paper (1.98:1) — the cell is
   recessive through its dashed keyline and reduced opacity, which is
   the tier language; the number itself still has to be readable */
.seal:not(.seal--set) .seal__no{color:var(--ink-2)}
/* the scanner's fallback copy sits on the viewer's tone fill, not on
   paper, which costs it the last of its contrast */
.viewer .stack .muted,.viewer__msg{color:var(--ink)}
.entry__meta,.brow__mid .muted,.bstat span{font-size:clamp(12px,.45vw + 10.6px,13.5px)}
/* Nothing in the application is allowed under 11px. The mono labels
   keep their wide tracking — that is what makes them read as manga
   captions — they simply stop shrinking. */
.chip,.bstate,.brow__del,.tech__legend,.tech__at,.entry__verdict,
.entry__no,.qrpanel__roll,.strike__sub,.who__role,.narr__ch,
.t-utility,.brow__no,.brow__sub{font-size:clamp(11px,.4vw + 9.7px,12.5px)}

/* ══════════════════════════════════════════════════════════════════
   MUTED TEXT IS INK, NOT TONE

   --tone is the screentone BODY: a fill, used for dot fields, ghost
   keylines and unearned seals. It is #B0A99C — 1.65:1 against the
   paper, below the 3:1 floor for large text and about a third of the
   4.5:1 body copy needs. It had drifted into being the colour of most
   secondary WORDS in the application: log metadata, the "/ 10" target
   beside the count, reward requirements, the member's own milestone
   names, empty-state copy, board timestamps. On a phone held at arm's
   length in daylight those lines were not dim, they were gone.

   They move to --ink-2 (#6B6459, 4.9:1) — the ramp step that exists
   for exactly this job. Fills, borders and unearned seals keep --tone,
   so the page's value structure is unchanged: this is a contrast fix,
   not a palette change. Panels that are printed in ink keep their own
   lighter overrides, which are more specific and still win.
   ══════════════════════════════════════════════════════════════════ */
.muted,.hero__of,.hero__foot,.entry__no,.entry__meta,.entry__verdict,
.stat span,.stat b i,.tech__at,.tech__desc,.tech__legend,.chip--set,
.qrpanel__when,.qrpanel__uri,.qrpanel__roll,.who__role,.empty,
.verdict__meet,.narr__ch,.t-utility,.setupbox__hint,.bstat span,
.brow__no,.brow__sub,.bactive__no--off,.bstate--ended,.bstate--past,
.hero__state,.tech__state,.bnote,.bident__when,.bmile__mid .muted,
.brow__mid .muted{color:var(--ink-2)}
/* the record's missed rows are recessive by opacity and a dashed
   keyline, which is the tier language — not by unreadable type */
[data-screen="record"] .entry--miss .entry__verdict{color:var(--ink-2)}

/* ── 3. Grid children that cannot shrink ──────────────────────────
   `.duo` and `.rig` reported horizontal clipping: a grid child's
   default min-width is auto, so a long unbreakable string pushes the
   track wider than its column instead of wrapping. */
.duo > *,.rig > *,.entry,.brow__mid,.bmile__mid{min-width:0}
.entry__meta,.brow__mid b,.bident__say{overflow-wrap:anywhere}

/* ══ TOUCH ═════════════════════════════════════════════════════════
   Keyed to the input device, not to the screen width. A 1024px
   touchscreen laptop and a 320px phone are both operated with a
   finger; a 380px browser window on a desktop is not. Width was
   standing in for this and got both cases wrong. */
@media (pointer:coarse){
  .btn,.chip,.motion-btn,.input,.link,.section-link,.brow__del,
  .tab,select,.theme-btn{min-height:44px}
  .input{padding-inline:var(--s4)}
  .btn{padding-inline:var(--s5)}
}

/* ══ THE SINGLE-COLUMN RECORD ══════════════════════════════════════
   Each row was an outer light panel wrapping an inner ink block — two
   borders and two paddings for one piece of information, which in a
   narrow column is most of the horizontal budget. The inked entry
   becomes the frame itself, and the gain moves under the verdict
   rather than fighting it for the same baseline.

   This is a property of the COLUMN, not of the device: it applies
   wherever the log is running one card per row, which the log's own
   auto-fill rule decides. Container queries let the card ask that
   question directly instead of guessing from the viewport. */
[data-screen="record"] .log{container-type:inline-size;container-name:log}

@container log (max-width: 380px){
  [data-screen="record"] .rec{
    border:0;padding:0;background:none;box-shadow:none;
  }
  [data-screen="record"] .rec__node{display:none}
  [data-screen="record"] .entry{
    padding:var(--s4);
    border:var(--edge-thin) solid var(--ink);
    grid-template-columns:1fr;
    grid-template-areas:"no" "verdict" "meta" "gain";
    gap:3px;
  }
  [data-screen="record"] .entry--set{border-color:var(--ink)}
  [data-screen="record"] .entry__gain{
    grid-area:gain;margin-top:var(--s3);
    font-family:var(--f-display);font-size:15px;
  }
  [data-screen="record"] .entry__ghost{font-size:44px;top:var(--s3);right:var(--s3)}
}
/* Browsers without container query support keep the two-frame row,
   which is legible everywhere — it is denser, not broken. */

/* ══ NARROW COMPONENT PADDING ══════════════════════════════════════
   Interior padding is the first thing to give when the column gets
   tight and the first thing to return when it does not. Expressed as
   the base with a lift at the tablet tier, so there is one direction
   of travel rather than a stack of exceptions. */
.tech{padding:var(--s4)}
.tech__name{font-size:clamp(17px,4vw,20px)}
.brow__n{font-size:clamp(17px,4vw,19px)}
.bstat{padding:var(--s4)}
.bsec{margin-top:var(--s5)}
/* The scanner frame keeps its weight — it is the one place a heavy
   keyline does real work, telling you where to aim. Said through the
   rank system now (scan's .viewer is --ink-w:4.2) rather than pinned
   here, where a fixed width in the last stylesheet was quietly
   capping it three steps lighter than the rank asked for. */
:where(.viewer){border-width:var(--edge)}

@media (min-width:768px){
  .tech{padding:var(--s5)}
  .bstat{padding:var(--s4) var(--s4) var(--s5)}
}

/* ── 4. States, applied once, everywhere ──────────────────────────
   Hover and active were defined per-component and drifted. One rule
   each, so a control anywhere in the app answers the same way. */
/* One answer for every control in the app: invert on the spot, press
   2px down and right. No colour fade, no lift, no easing — the
   element behaves like a key being struck. */
.btn:hover,.chip:hover,.motion-btn:hover{
  background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:active,.chip:active,.motion-btn:active{transform:translate(2px,2px)}
.motion-btn:hover svg{stroke:var(--paper)}
.chip--on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.link:hover{text-decoration-thickness:2px}
:focus-visible{outline:var(--edge-thin) solid var(--ink);outline-offset:3px}
/* The router gives main#view tabindex="-1" and focuses it after every
   navigation so a screen reader announces the new chapter. It is a
   landmark, not a control, and the global ring above was therefore
   drawing a 2px ink rule right across the page — 3px under the end of
   the content, full bleed, on every screen after every tap. Focus still
   moves; only the ring is suppressed, and every real control keeps
   its own. */
main#view:focus,main#view:focus-visible{outline:none}

/* ── 5. Two measured misalignments ────────────────────────────────
   The scanner sat 8px off-centre (L=14 R=22) and the timeline entry on
   Home and Member carried a 16px phantom inset on its right (R=48
   against a log at 32). Both read as "slightly wrong" without being
   obviously broken, which is exactly the kind of thing that makes a
   layout feel unfinished. */
.viewer{width:100%;margin-inline:0}
.rec .entry{padding-right:0}

/* ── 6. Reward requirement legibility ─────────────────────────────
   "Unlocks at 20 stamps" is the single most useful line on a locked
   card — it is the answer to "how far am I?" — and it was sitting at
   secondary weight on top of screentone, which eats contrast. It gets
   full ink and mono tracking so it reads as a spec, not a whisper. */
.tech__req{color:var(--ink);font-size:11.5px;letter-spacing:.08em;opacity:1}
.tech--sealed .tech__req{color:var(--ink)}
.tech--sealed .tech__name{color:var(--ink)}
/* the badge is the state, so it carries a keyline rather than floating */
.tech__state{border:var(--edge-hair) solid var(--ink);padding:6px 10px}
</style>
</head>

<!-- ─────────────────────────────────────────────────────────────
     SCRIPTS — order matters, so no defer and no async.

     00-guard runs first and on its own. It is the reason a failure
     anywhere below shows you a message instead of a black screen.

     The three CDN libraries are third-party; if your school network
     blocks CDNs, download them into vendor/ and change these three
     src attributes to the local paths. The app degrades honestly
     without anime.js (Motion.off turns every animation into an
     instant state change) but it needs jsQR to scan.
     ───────────────────────────────────────────────────────────── -->
<script>
/* ── js/00-guard.js ── */
"use strict";
/* keystamp — boot guard. Loads before everything else.

   The black boot curtain is a fixed, full-screen, pure black layer at
   z-index 200, and the only thing that ever removed it was the complete
   callback of the boot animation. So any script that failed to load or
   threw on the way there left the page permanently black with nothing
   on it to explain why.

   This file removes that failure mode. Two jobs:
     1. anything throws  -> lift the curtain, print the error on screen
     2. nothing throws but the boot animation never finishes
                         -> lift the curtain anyway after 4 seconds
   Neither is meant to fire. If one does, you get a readable message
   instead of a black rectangle. */

window.Guard = (function(){
  var lifted = false, watchdog = null, reported = 0;

  function lift(){
    if (lifted) return;
    lifted = true;
    clearTimeout(watchdog);
    var b = document.getElementById('boot');
    if (b) b.classList.add('is-done');
  }

  function report(msg, where){
    lift();
    if (++reported > 3) return;                 /* one cascade is enough */
    var bar = document.getElementById('guardbar');
    if (!bar){
      bar = document.createElement('div');
      bar.id = 'guardbar';
      (document.body || document.documentElement).appendChild(bar);
    }
    bar.textContent = 'Keystamp error — ' + msg + (where ? '  [' + where + ']' : '');
    console.error('[keystamp]', msg, where || '');
  }

  function ours(url){
    try { return new URL(url, location.href).origin === location.origin; }
    catch (_) { return false; }
  }

  /* capture phase, because resource load failures do not bubble */
  window.addEventListener('error', function(e){
    var t = e.target;
    if (t && t.tagName === 'IMG') return;       /* missing artwork is fine */

    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')){
      var url = t.src || t.href || '';
      /* A third-party file failing is survivable and not worth a red
         bar: the fonts fall back, and without anime.js Motion.off turns
         every animation into an instant state change. One of our own
         files failing is not survivable, so that one gets shouted. */
      if (!ours(url)){
        console.warn('[keystamp] third-party file did not load:', url,
                     '— the app still runs, it just loses that piece.');
        return;
      }
      report('could not load ' + url + ' — check that the file is there ' +
             'and the path in index.html matches.');
      return;
    }
    report(e.message, (e.filename || '').split('/').pop() + ':' + e.lineno);
  }, true);

  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    report(String((r && r.message) || r));
  });

  watchdog = setTimeout(function(){
    var b = document.getElementById('boot');
    if (b && !b.classList.contains('is-done')){
      console.warn('[keystamp] boot animation never finished; watchdog lifted the curtain.');
      lift();
    }
  }, 4000);

  return { lift: lift, report: report };
})();

</script>

<script>
/* ── js/anime-bridge.js ── */
"use strict";
/* keystamp — anime.js v4 bridge (classic script, deliberately not a module).

   This was an ES module with an importmap. That cannot work when the page
   is opened as a file: browsers fetch module scripts with CORS semantics,
   and a file:// page has an opaque origin, so every module request is
   rejected before it reaches the disk. The file was present the whole
   time — the error said "could not load", but the browser had refused to
   try. Opening it from inside a mounted .zip made it doubly impossible.

   So: the UMD build, loaded as an ordinary script, which has no origin
   requirements and works from file://, from a subdirectory, and from a
   server. Same v4 API, same version, no importmap, no build step.

   The UMD bundle publishes one global, `anime`, holding the v4 namespace.
   Note it is a namespace, not the v3 callable — anime(...) is not a
   function any more, anime.animate(...) is. */

(function(){
  var A = window.anime;

  /* v4 removed the string form of ease: 'cubicBezier(...)' — the curve has
     to be built by the factory and passed as a function. EASE tables are
     evaluated at the top level of 04-fx.js, so these globals must exist
     even when anime.js is missing, or that file throws on load and takes
     the whole app with it. Absent anime, they return undefined, which
     every call site already tolerates because Motion.off short-circuits
     before any of them are used. */
  var missing = !A || typeof A.animate !== 'function';
  if (missing){
    console.warn('[keystamp] anime.js did not load; starting without animation.');
    window.cubicBezier  = function(){ return undefined; };
    window.steps        = function(){ return undefined; };
    window.createSpring = function(){ return undefined; };
    window.spring      = function(){ return undefined; };
    return;
  }
  window.cubicBezier = A.cubicBezier;
  window.eases       = A.eases;
  window.animate        = A.animate;
  window.createTimeline = A.createTimeline;
  window.createTimer    = A.createTimer;
  window.createDrawable = A.svg.createDrawable;
  /* createSpring() is deprecated as of 4.5; spring() is the current name */
  window.spring         = A.spring;
  window.createSpring   = A.spring;
  window.stagger        = A.stagger;
  /* steps() is a top-level export, NOT a member of eases — reaching for
     eases.steps returns undefined, anime falls back to its default
     out-curve, and a motion written to cut arrives eased instead. */
  window.steps          = A.steps;
  window.onScroll       = A.onScroll;
  window.splitText      = A.text.splitText;
  window.aset           = A.utils.set;
  window.aremove        = A.utils.remove;
  window.around         = A.utils.round;
})();

</script>
