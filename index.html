<link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Archivo+Narrow:wght@400;500;600;700&family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Comic+Neue:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════════════
   KEYSTAMP — v5, "spread"

   v4 called itself a manga spread in its own comments and then drew a
   dark neon dashboard: one column of equal cards, 1px borders, glow,
   rounded-off corners. The comments were a design brief nobody built.

   v5 is the brief. The page is paper. Panels are irregular, hard-edged
   and unequal, separated by white gutters rather than stacked in a
   column. Two panels per screen break their box — one bleeds off the
   page edge, one is cut on the diagonal. Callouts are angular balloons
   with tails, not toasts. Shading is line hatching and dot tone, never
   a gradient. There is no colour: black, white, and grey that only
   ever appears as tone.

   One theme: ink on warm paper. Black is manga ink -- spotted
   blacks, frames and active states -- never a page surface. Set on
   <html>; the toggle in the topbar writes it.
   ══════════════════════════════════════════════════════════════════ */

:root{
  /* ── ink and paper. Everything else is a shade of these two ── */
  /* ── a real tonal scale, not two colours.
     A manga page is not black text on white; it is seven values, and
     the contrast between them is the storytelling. Panels are assigned
     a value, and the page is composed so that some are nearly empty
     paper and some are almost solid ink. ── */
  --v0:#fefdfb;   /* paper — the page itself           */
  --v1:#f4f1ea;   /* off-white — a quiet panel          */
  --v2:#ddd9d0;   /* light tone — recessive fill        */
  --v3:#a8a49c;   /* mid tone — screentone body         */
  --v4:#6d6a64;   /* dark tone — shadow                 */
  --v5:#2a2825;   /* ink — borders, type                */
  --v6:#080807;   /* deep black — the dominant panel    */

  --paper:var(--v0);
  --paper-2:var(--v1);
  --ink:var(--v5);
  --ink-2:var(--v4);
  --tone:var(--v3);
  --tone-lt:var(--v2);

  /* ── border hierarchy. A page where every panel has the same edge
     has no weight to it. Five, used to say how loud a panel is. ── */
  --edge-hair:1px;
  --edge-thin:2px;
  --edge:3px;
  --edge-heavy:6px;
  --edge-shout:10px;

  /* v4 names kept alive so the FX layer keeps working, remapped to
     ink and paper. Nothing in js/ has to change. */
  --void:var(--paper); --sumi:var(--paper); --ink-bg:var(--paper);
  --lacquer:var(--paper); --lacquer-2:var(--paper-2); --well:var(--paper-2);
  --steel:var(--tone-lt); --steel-2:var(--tone);
  --burg:var(--ink); --oxblood:var(--ink); --crimson:var(--ink); --ember:var(--ink-2);
  --bone:var(--ink); --chalk:var(--ink-2); --ash:var(--tone); --faint:var(--tone);
  --beige:var(--tone);
  --line:var(--ink); --line-2:var(--ink); --line-3:var(--ink); --line-hot:var(--ink);

  /* panel border. The single most manga number here — and the one that
     costs the most on a narrow screen, where 3px of ink on four edges
     is 12px of a 288px column. It thins with the page and returns to
     full weight once there is room for it. */
  --rule:2.5px;
  --rule-hair:1.5px;

  /* ══ THE CONTAINER ════════════════════════════════════════════════
     One container rule for the whole application: a full-width outer
     layout, an inner column that is capped, centred, and padded by a
     value that grows with the viewport. Nothing in this file may give
     a page section a fixed width — a section either spans the column
     or takes a fraction of it.

     page-max  the content column ceiling (widened per tier at the
               bottom of this file, so a 2560px monitor is not 1320px
               of content marooned in paper)
     gutter    page margin, and the exact distance a bleed may travel
     gut       between panels inside a tier
     gut-tier  between tiers, deliberately wider than gut          */
  --page-max:1320px;
  --gutter:clamp(16px,4.4vw,56px);
  --gut:clamp(8px,1vw,14px);
  --gut-tier:clamp(12px,1.8vw,24px);
  --bleed:var(--gutter);

  /* ══ TYPE ═════════════════════════════════════════════════════════
     Every size is fluid across the entire range — one clamp per role,
     no per-device overrides anywhere. The floors are set from the
     narrowest supported column (320px minus two gutters minus two
     panel paddings ≈ 236px), so the largest words on each screen fit
     without the clamp having to be re-fought further down the file.

     The previous scale had a 96px floor on the hero number and a
     34px floor on titles applied below 400px — sizes chosen for a
     phone-sized *panel* rather than a phone-sized *column*, which is
     what made the narrow layouts read as an oversized mobile page. */
  --t-title:clamp(30px,7.2vw,92px);
  --t-hero:clamp(72px,20vw,204px);
  --t-verb:clamp(21px,3.2vw,38px);
  --t-name:clamp(16px,1.4vw,21px);
  --t-body:clamp(14.5px,.32vw + 13.5px,17px);
  --t-caption:clamp(10px,.75vw,12px);
  --t-sfx:clamp(64px,15vw,200px);
  --t-meta:clamp(12px,.85vw,14px);
  --tap:44px;            /* minimum touch target */
  --tabs-h:56px;         /* the bottom bar owns exactly this much */

  --f-display:'Dela Gothic One',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Archivo Narrow',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-label:'Oswald',var(--f-body);
  --f-accent:'CC Wild Words Roman','CCWildWords','Comic Neue',cursive;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --f-jp:'Noto Sans JP',var(--f-body);

  /* The step scale. s1-s4 are detail spacing and stay fixed — 4px is
     4px on every device. From s5 up the value is structural (panel
     padding, tier gaps, page rhythm) and has to answer to the
     viewport, so those steps are fluid. Every existing call site
     inherits the responsive behaviour without being touched, which is
     the point of fixing this here rather than per component. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --s5:clamp(18px,1.6vw,22px);
  --s6:clamp(22px,2.4vw,32px);
  --s7:clamp(28px,3.4vw,44px);
  --s8:clamp(40px,5vw,72px);
  /* THE PILLAR. 15vw put the navigation at a seventh of a wide screen
     and left the numerals cramped against their labels. A fifth is
     the brief's proportion and it is also the one that lets the
     numeral run at display size with the label on its own baseline. */
  --rail:clamp(208px,20vw,340px); --pad:var(--gutter);
  /* Mechanical, not eased. A stamp does not accelerate into the paper
     and glide out again — it lands. Every state change in this system
     is either instantaneous or one 60ms step; the choreography that
     genuinely deserves duration (the verdict sequence) still owns it
     in the FX layer, where it is composed rather than interpolated. */
  --ease:linear;
  --snap:60ms;
}



*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:clip}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ══════════════════ TONE — hatching and dots ══════════════════
   Two shading languages, both flat. Dot tone for large calm fills,
   line hatching for anything meant to read as shadow. Never both on
   the same panel — that is what makes a page look muddy. */
.tone-dot{
  background-image:radial-gradient(var(--ink) 1px,transparent 1px);
  background-size:5px 5px;opacity:.17;
}
.tone-dot--fine{background-size:3.5px 3.5px;opacity:.13}
.tone-hatch{
  background-image:repeating-linear-gradient(72deg,
    var(--ink) 0 1px,transparent 1px 5px);
  opacity:.2;
}
.tone-hatch--steep{
  background-image:repeating-linear-gradient(28deg,
    var(--ink) 0 1.2px,transparent 1.2px 6px);
}

/* ══════════════════ THE PAGE ══════════════════ */
.ground{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:var(--paper)}
.ground__tone{position:absolute;inset:0;opacity:.05;
  background-image:radial-gradient(var(--ink) 1px,transparent 1px);
  background-size:6px 6px}
.ground__vig,.ground__grain{display:none}
.arena{display:none}
.backdrop{position:absolute;inset:0;background-repeat:repeat;
  background-size:340px;opacity:.07;filter:grayscale(1) contrast(1.6)}

.shell{position:relative;z-index:1;display:grid;
  grid-template-columns:var(--rail) 1fr;min-height:100%}

/* ══════════════════ RAIL — the margin column ══════════════════
   Held to the left edge with a hard rule, the way a page number and
   chapter mark sit outside the panel area. */
.rail{display:flex;flex-direction:column;padding:var(--s5) var(--s4);min-width:0;
  border-right:var(--rule) solid var(--ink);background:var(--paper);
  position:sticky;top:0;height:100dvh}
.rail__brand{padding-bottom:var(--s5);border-bottom:var(--rule-hair) solid var(--ink)}
.rail__nav{position:relative;display:flex;flex-direction:column;gap:2px;
  padding-top:var(--s4);flex:1}
.rail__nav button{display:flex;align-items:center;gap:var(--s3);
  padding:9px var(--s3);background:none;border:0;cursor:pointer;
  font:500 12px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);border-radius:0}
.rail__nav button svg{width:17px;height:17px;stroke-width:1.9}
.rail__nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.rail__nav button:hover:not([aria-current="page"]){background:var(--paper-2)}
.rail__ind{display:none}
.rail__foot{padding-top:var(--s4);border-top:var(--rule-hair) solid var(--ink)}

.topbar{display:none;align-items:center;justify-content:space-between;
  padding:var(--s3) var(--pad);border-bottom:var(--rule) solid var(--ink);
  background:var(--paper);position:sticky;top:0;z-index:60;
  padding-left:calc(var(--pad) + env(safe-area-inset-left, 0px));
  padding-right:calc(var(--pad) + env(safe-area-inset-right, 0px))}
.motion-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
  background:var(--paper);border:var(--rule-hair) solid var(--ink);
  color:var(--ink);cursor:pointer;font:500 10px/1 var(--f-body);
  letter-spacing:.14em;text-transform:uppercase}
.motion-btn svg{width:14px;height:14px}

main#view{width:100%;max-width:var(--page-max);margin-inline:auto;
  padding:var(--gut-tier) calc(var(--gutter) + env(safe-area-inset-right, 0px))
          var(--s8) calc(var(--gutter) + env(safe-area-inset-left, 0px))}

/* ══════════════════ THE SPREAD — irregular panel tiers ══════════════════
   Six columns, and panels take unequal spans of them. The point is that
   no two rows are the same shape: a wide establishing panel, then a tall
   one beside a narrow black one, then a full-width strip. Equal cards in
   a single column is what made v4 read as a dashboard. */
.view{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:var(--gut-tier) var(--gut);align-content:start;position:relative}
.view > *{grid-column:1/-1;min-width:0}

/* Home is placed by hand, because it is the page you look at most */
[data-screen="home"] .view > .head{grid-area:1/1/2/-1}
[data-screen="home"] .view > section:nth-of-type(1){grid-area:2/1/3/5}
[data-screen="home"] .view > .strike{grid-area:2/5/3/-1}
[data-screen="home"] .view > section:nth-of-type(2){grid-area:3/1/4/-1}
[data-screen="home"] .view > .duo{grid-area:4/1/5/-1}

/* every other screen alternates spans so tiers stay unequal without
   knowing what is in them. Record only ever has two sections — the
   held log and, sometimes, the scheduled log below it — and they are
   wildly different heights (the held log can run many screens tall).
   Placing them 4-cols/2-cols side by side (the old rule) put the
   short "Scheduled" section into the grid's leftover top-row space
   beside the tall log instead of a fresh row under it, squeezing its
   cards down to ~80px wide and wrapping/overlapping their own text.
   Record's sections now always take the full row; the alternating
   split still applies to Rewards. */
[data-screen="rewards"] .view > section:nth-of-type(3n+1){grid-column:1/5}
[data-screen="rewards"] .view > section:nth-of-type(3n+2){grid-column:5/-1}

.duo{display:grid;grid-template-columns:4fr 2fr;gap:var(--gut)}

/* ══════════════════ PANELS ══════════════════ */
/* A `.rig` is a panel and the registration ghost printed behind it. The
   ghost is `inset:0` on the rig, so the rig's box and the panel's box
   have to be the same box — the moment a panel carries a block margin,
   the ghost paints as a bar of solid ink in the gap the margin opened,
   which is not a print shadow, it is a stripe. Spacing between panels
   comes from the view grid's gap or from the section; never from the
   panel inside the ghost. */
.rig{position:relative;min-width:0}
.rig > .panel{margin-block:0}
/* THE GHOST IS GONE.

   `.rig__ghost` was a solid ink rectangle offset 6px behind every
   panel — a hard-edged print shadow. However it is drawn, a shape
   sitting behind another shape to imply lift is a drop shadow, and a
   drop shadow says "this card floats above the page". This system says
   the opposite: there is one sheet of paper, and structure is ruled
   onto it. The element stays in the markup (every view emits it) and
   simply stops painting, so no view template has to change. */
.rig__ghost{display:none}

.panel{position:relative;z-index:1;background:var(--paper);
  border:var(--rule) solid var(--ink);border-radius:0;height:100%}
.panel > *:not([data-layer]){position:relative;z-index:1}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;
  z-index:0;background-image:radial-gradient(var(--ink) 1px,transparent 1px);
  background-size:5px 5px;opacity:.06}
.panel--flat::after{opacity:0}
.panel__rule{display:none}

/* a panel that is cut on the diagonal. The ink layer is the element,
   the paper layer is the pseudo — that is the only way to keep a black
   edge on a non-rectangular shape */
.panel--cut{background:var(--ink);border:0;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%)}
.panel--cut::before{content:"";position:absolute;inset:var(--rule);z-index:0;
  background:var(--paper);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 27px),calc(100% - 27px) 100%,0 100%)}

/* a panel that runs off the edge of the page */
.panel--bleed{margin-right:calc(var(--bleed) * -1);border-right:0}

/* panels sit very slightly off-square, the way inked panels do */
[data-screen="home"] .view > section:nth-of-type(2){transform:rotate(-.35deg)}
[data-screen="home"] .view > .duo > .rig:last-child{transform:rotate(.4deg)}

/* ══════════════════ LETTERING ══════════════════ */
.kicker{font:500 10px/1 var(--f-mono);letter-spacing:.22em;
  text-transform:uppercase;color:var(--tone)}
.kicker--bone{color:var(--ink)}
.title{font-family:var(--f-display);font-size:var(--t-title);
  line-height:.92;letter-spacing:-.02em;text-transform:uppercase;
  /* last-resort guard: a single word longer than the panel breaks rather
     than escaping it. Normal titles never reach this. */
  overflow-wrap:break-word}
.title--name em{font-style:normal}
.h2{font:500 13px/1.2 var(--f-body);letter-spacing:.16em;
  text-transform:uppercase}
.jp{font-family:var(--f-jp);font-size:12px;letter-spacing:.5em;color:var(--tone);
  writing-mode:vertical-rl}

/* ══════════════════ THE EDGE RUNE ══════════════════
   Microscopic vertical monospace running up the right edge of a
   container. It is the counterweight to the display type: the whole
   composition is one enormous word and one line you have to lean in to
   read, and the tension between those two scales is the system.

   Hidden below the laptop tier — a phone has no spare edge to spend,
   and a rune squeezed against a 320px viewport is decoration rather
   than framing. */
.rune{display:none;position:absolute;
  /* Its own column in the right lane, INSIDE the one already reserved
     for the Japanese mark — two parallel vertical rules, not one mark
     fighting another. `.jp` is anchored to the top of that lane, the
     rune is centred in it, so the two can never meet however tall the
     container grows. */
  right:calc(var(--space-panel) + 17px);
  top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;
  /* Sized from the viewport, not fixed: at 1024 the nameplate is only
     about 130px tall and a 9.5px rune with this tracking overran it. */
  font:500 clamp(8px,.62vw,10px)/1 var(--f-mono);letter-spacing:.24em;
  /* Muted ink, not screentone. At 8-10px a --v3 rune is a smudge you
     have to hunt for; --ink-2 is quiet without being illegible, which
     is the whole point of a mark you are meant to lean in and read. */
  text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;pointer-events:none;user-select:none}
@media(min-width:1024px){
  .rune{display:block}
}
.muted{color:var(--tone)}
.emph{font-weight:500}
.emph--hot{background:var(--ink);color:var(--paper);padding:0 5px}

.head{display:flex;align-items:flex-start;justify-content:space-between;
  gap:var(--s4);padding:var(--s4) var(--s5);border:var(--rule) solid var(--ink);
  background:var(--paper);position:relative;overflow:hidden}
.head--bare{align-items:center}
.head__rake{position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(72deg,var(--ink) 0 1px,transparent 1px 5px);
  opacity:.14}
.head__stack{position:relative}

/* the giant cropped word, now genuinely cropped by the page edge */
.bleed{position:absolute;font-family:var(--f-display);
  font-size:clamp(90px,17vw,220px);line-height:.8;text-transform:uppercase;
  color:var(--ink);opacity:.055;pointer-events:none;white-space:nowrap;z-index:0}
.bleed--fill{opacity:.05}

/* ══════════════════ HERO ══════════════════ */
.hero{padding:var(--s5)}
.hero__top{display:flex;align-items:center;justify-content:space-between;
  gap:var(--s3);margin-bottom:var(--s5)}
.hero__core{display:flex;align-items:baseline;gap:var(--s2)}
.hero__num{font-family:var(--f-display);font-size:var(--t-hero);
  line-height:.84}
.hero__of{font:500 13px/1 var(--f-mono);color:var(--tone)}
.hero__label{font:500 11px/1 var(--f-body);letter-spacing:.2em;
  text-transform:uppercase;margin-top:var(--s3)}
.hero__ring{position:absolute;right:var(--s5);top:var(--s5);
  width:110px;height:110px;opacity:.16}
.hero__ring circle,.hero__ring polygon,.hero__ring path,.hero__ring line{
  fill:none;stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.hero__foot{margin-top:var(--s4);font-size:13px;color:var(--tone)}

.gauge{position:relative;height:9px;margin-top:var(--s5);
  border:var(--rule-hair) solid var(--ink);background:var(--paper);overflow:hidden}
.gauge__fill{position:absolute;inset:0;transform:scaleX(0);
  transform-origin:0 50%;background:var(--ink)}
.gauge__tick{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink);
  opacity:.45}

/* ══════════════════ THE STAMP CARD ══════════════════ */
.seals{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gut);
  list-style:none;padding:var(--s5)}
.seal{position:relative;aspect-ratio:1;display:grid;place-items:center;
  border:var(--rule) solid var(--ink);background:var(--paper)}
.seal svg{width:62%;height:62%}
.seal__mark circle,.seal__mark polygon,.seal__mark path,.seal__mark line{
  fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.seal__no{position:absolute;right:5px;bottom:3px;font:500 9px/1 var(--f-mono);
  color:var(--tone)}
/* a landed stamp is solid ink — the strongest thing on the page */
.seal--set{background:var(--ink)}
.seal--set .seal__mark circle,.seal--set .seal__mark polygon,
.seal--set .seal__mark path,.seal--set .seal__mark line{stroke:var(--paper)}
.seal--set .seal__no{color:var(--paper);opacity:.65}
.seal--next{border-style:dashed}
.seal--next .seal__mark circle,.seal--next .seal__mark polygon,
.seal--next .seal__mark path,.seal--next .seal__mark line{opacity:.35}
.seal[data-seal="empty"]{background-image:radial-gradient(var(--ink) 1px,transparent 1px);
  background-size:5px 5px}
.seal[data-seal="empty"] .seal__mark{opacity:.22}

/* ══════════════════ THE ACTION CHAMBER ══════════════════
   This was a solid black card with a pinstripe fill — the one dark
   surface in a light application, which read as a widget borrowed from
   a different product. It is now a chamber: a marked-off region of the
   same paper, filled with a dense diagonal rake (speed lines, drawn
   in tone rather than ink so type stays readable on it) and pinned at
   the corners by four heavy targeting marks.

   It still dominates the page — but by being AIMED AT rather than by
   being the only dark thing on the screen. */
/* A column, not a row: the label reads from the top-left the way a
   heading does, and the target block lands in the opposite corner —
   the diagonal is what gives an otherwise square chamber its tension.
   Both ends stay clear of the corner marks. */
.strike{display:flex;flex-direction:column;align-items:flex-start;
  justify-content:space-between;gap:var(--s5);
  width:100%;padding:var(--s6);text-align:left;cursor:pointer;
  border-radius:0;background:var(--paper);color:var(--ink);
  border:var(--edge-thin) solid var(--ink);
  position:relative;overflow:hidden;font-family:var(--f-body);
  transition:none}
.strike__arrow{align-self:flex-end}
/* the rake: 1px diagonal hatch, tone not ink, so it is texture and
   never competes with the words sitting on it */
.strike::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(74deg,var(--v3) 0 1px,transparent 1px 7px);
  opacity:.38}

/* ── the corner marks ─────────────────────────────────────────────
   Four painted Ls, one per corner, drawn as spans rather than as a
   border so they can move on their own. */
.chamber__c{position:absolute;width:clamp(16px,2.6vw,28px);
  height:clamp(16px,2.6vw,28px);border:var(--edge) solid var(--ink);
  pointer-events:none;z-index:3;transition:none}
/* flush at 0, not -1px: the chamber clips its own rake with
   `overflow:hidden`, which would take a bite out of any mark that
   hangs outside the box */
.chamber__c--tl{top:0;left:0;border-right:0;border-bottom:0}
.chamber__c--tr{top:0;right:0;border-left:0;border-bottom:0}
.chamber__c--bl{bottom:0;left:0;border-right:0;border-top:0}
.chamber__c--br{bottom:0;right:0;border-left:0;border-top:0}
/* LOCK ON. The marks step inward and the keyline snaps to the seal.
   No transition property is set, so this is instantaneous — the whole
   point of the gesture is that it is mechanical, not eased. */
.strike:hover .chamber__c,.strike:focus-visible .chamber__c{
  margin:5px;border-color:var(--seal)}
.strike:hover,.strike:focus-visible{border-color:var(--seal)}
.strike:active{transform:translate(2px,2px)}
.strike__body{position:relative;z-index:2;min-width:0}
.strike__verb{display:block;font-family:var(--f-display);font-size:var(--t-verb);
  line-height:1;text-transform:uppercase}
.strike__sub{display:block;margin-top:8px;font:500 10px/1.3 var(--f-mono);
  letter-spacing:.14em;text-transform:uppercase;opacity:.72}
/* the target itself: a solid stamped block, inverted on approach */
.strike__arrow{display:grid;place-items:center;
  width:clamp(48px,7vw,68px);height:clamp(48px,7vw,68px);
  background:var(--ink);color:var(--paper);border:var(--edge-thin) solid var(--ink);
  flex:none;position:relative;z-index:2;transition:none}
.strike__arrow svg{width:44%;height:44%}
.strike:hover .strike__arrow,.strike:focus-visible .strike__arrow{
  background:var(--paper);color:var(--ink);border-color:var(--seal)}
/* "no meeting is open" is the screentone state: present, but not the
   thing being pointed at, so the rake thins and the corners quieten */
.strike--calm::before{opacity:.28}
.strike--calm .chamber__c{border-color:var(--ink-2)}

/* ══════════════════ BUTTONS ══════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:10px var(--s4);
  border:var(--rule-hair) solid var(--ink);background:var(--paper);color:var(--ink);
  cursor:pointer;border-radius:0;font:500 11px/1 var(--f-body);
  letter-spacing:.16em;text-transform:uppercase;position:relative;overflow:hidden}
.btn--hot{background:var(--ink);color:var(--paper)}
/* the strike: the control's whole face inverts for two frames */
.btn__strike{position:absolute;inset:0;background:currentColor;
  mix-blend-mode:difference;pointer-events:none}
.btn--ghost{border-style:dashed}
.btn--wide{width:100%;justify-content:center}
.btn:hover{transform:translate(-1px,-1px)}
.link,.section-link,.board-link{background:none;border:0;cursor:pointer;
  color:var(--ink);font:500 11px/1 var(--f-body);letter-spacing:.14em;
  text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;
  border:var(--rule-hair) solid var(--ink);font:500 9.5px/1 var(--f-mono);
  letter-spacing:.16em;text-transform:uppercase}
.chip--hot{background:var(--ink);color:var(--paper)}
.chip--set{border-style:dashed;color:var(--tone)}

/* ══════════════════ BALLOONS ══════════════════
   Angular, not elliptical, with a tail. Manga balloons are polygons
   with slightly uneven sides — a perfect ellipse reads as a web tooltip. */
/* z-index 45 keeps notifications UNDER the tab bar (100) and the rail (60):
   a message must never cover the control you would use to leave it. It
   still sits above page content. On mobile it clears the 56px tab bar and
   the home indicator, and it is capped so a stack can never fill the
   screen — with LIMIT 3 the worst case is roughly a third of a phone. */
.toasts{position:fixed;right:var(--s5);bottom:var(--s5);z-index:45;
  display:flex;flex-direction:column;gap:var(--s3);max-width:330px;
  pointer-events:none}
.toasts > *{pointer-events:auto}
/* The angular silhouette used to be a `clip-path` on the element itself.
   clip-path clips descendants AND pseudo-elements, and the tail sits at
   bottom:-15px — outside the polygon — so no tail ever drew, and the
   polygon sliced the 3px border at every corner into disconnected ticks.
   Every callout in the app rendered as a plain web toast, which is the
   one thing the stylesheet's brief says these must not be.
   The skew now supplies the "not a rectangle" read, the border survives
   intact, and the tail is a bordered square rotated 45deg with its top
   two edges hidden behind the balloon's own fill — so the outline runs
   continuously around balloon and tail together. */
/* A CALLOUT IS A NOTICE, NOT A SPEECH BUBBLE.

   These carried a 1.1deg skew and a rotated square tail — the comic
   balloon. In an editorial system a message is a ruled notice: square,
   flush, with a heavy rule down its leading edge marking it as an
   aside rather than body copy. No skew, no tail, no rotation. */
.bubble,.toast{position:relative;background:var(--paper);
  border:var(--rule-hair) solid var(--ink);
  border-left:var(--edge-heavy) solid var(--ink);
  padding:var(--s4) var(--s5)}
[hidden]{display:none!important}
.bubble p,.toast p{font-family:var(--f-mono);font-size:12.5px;line-height:1.45;
  letter-spacing:.02em;text-align:left;color:var(--ink-2)}
.toast strong{display:block;font-family:var(--f-label);font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;color:var(--ink)}

/* ══════════════════ RECORD / LOG ══════════════════ */
.log{display:flex;flex-direction:column}
.entry__no{font:500 11px/1 var(--f-mono);color:var(--tone)}
.entry__meta{font-size:13px;color:var(--tone)}
.entry__verdict{font:500 10px/1 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase}
.entry__gain{font-family:var(--f-display);font-size:15px}
.entry__ghost{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
  gap:var(--gut)}
.stat{padding:var(--s4);border:var(--rule-hair) solid var(--ink)}
/* The stat plate shipped with markup (`<b>07<i>/09</i></b><span>label</span>`)
   but no rules for its children, so all three stayed inline and ran
   together — the profile read "07 / 09Meetings attended" with the label
   welded to the figure. Value and label are separate lines, matching how
   the hero states its number above its caption. */
.stat b{display:block;font-family:var(--f-display);font-weight:400;
  font-size:clamp(24px,2.6vw,32px);line-height:1;letter-spacing:-.02em}
.stat b i{font-family:var(--f-mono);font-style:normal;font-size:.5em;
  letter-spacing:0;color:var(--tone);margin-left:.24em}
.stat span{display:block;font:500 10.5px/1.3 var(--f-label);
  letter-spacing:.18em;text-transform:uppercase;color:var(--tone);
  margin-top:var(--s3)}
.rec__node{width:9px;height:9px;background:var(--ink)}
.pip{width:6px;height:6px;background:var(--ink)}
.tick{position:absolute;width:11px;height:11px;border:var(--rule-hair) solid var(--ink)}
.tick--tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
.tick--br{right:-1px;bottom:-1px;border-left:0;border-top:0}

/* ══════════════════ REWARDS ══════════════════ */
.tech__top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3)}
.tech__name{font-family:var(--f-display);font-size:clamp(16px,1.4vw,20px);text-transform:uppercase;line-height:1.05}
.tech__at{font:500 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--tone)}
.tech__desc{font-size:13.5px;color:var(--tone);margin-top:var(--s2)}
.tech__glyph svg{width:52px;height:52px}
.tech__glyph circle,.tech__glyph polygon,.tech__glyph path,.tech__glyph line{
  fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke}
.tech__legend{font:500 9.5px/1 var(--f-mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--tone)}
/* The locked state was a diagonal CSS hatch laid over the whole card —
   the single most generic treatment in the old build, and it fought
   every word printed on it. A sealed reward is now stated by weight
   and by its label, not by a texture: hairline keyline, muted type,
   and the word SEALED. Nothing is drawn across the content. */
.tech__crack{position:absolute;inset:0;pointer-events:none;opacity:0}
/* This was `height:6px` — a hard height on a wrapper that contains a
   9px track, its 20px top margin, and a two-item legend. Everything
   past 6px fell out of the card and was cut off by the panel's
   `overflow:hidden`, so the "9 / 10 stamps · 90%" legend was invisible
   on every reward card at every viewport. The wrapper is a stack; its
   height is its content. */
/* ── THE STAMP TRACK ──────────────────────────────────────────────
   A reward's progress is a count of stamps, so it is drawn as stamp
   cells: the meter is divided into exactly `--slots` compartments by
   hairline rules laid over the fill. It reads as "9 of 10 pressed"
   rather than as "90% of a bar", and it scales to any tier size
   without the markup knowing the width. */
.tech__gauge{margin-top:var(--s3)}
.tech__gauge .gauge{margin-top:0;height:clamp(14px,1.5vw,20px);
  border:var(--edge-hair) solid var(--ink);background:transparent;
  position:relative;overflow:hidden}
.tech__gauge .gauge::after{content:"";position:absolute;inset:0;
  pointer-events:none;z-index:2;
  background-image:repeating-linear-gradient(to right,
    transparent 0 calc(100% / var(--slots, 10) - 1px),
    var(--ink) calc(100% / var(--slots, 10) - 1px) calc(100% / var(--slots, 10)))}
.tech__gauge .gauge__fill{background:var(--v6)}
.tech__legend{display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s3);flex-wrap:wrap;margin-top:var(--s2)}
.tech__top > div{min-width:0}
.tech__name{overflow-wrap:break-word}

/* ══════════════════ SCAN ══════════════════ */
.viewer{position:relative;display:grid;place-items:center;overflow:hidden;
  border:var(--rule) solid var(--ink);aspect-ratio:3/4;
  /* Frame furniture, not a target. These brackets are fixed to the box
     and never change; the reticle inside is the mark that aims and
     reacts, and it is the one that carries cinnabar. Two red bracket
     sets on one screen was the accent spent twice — paper on the dark
     camera image reads as instrument housing and leaves the red to the
     thing that earns it.

     INK is the default, because the box's own ground is paper. Paper
     brackets were keyed to the absence of .viewer--stalled, which is
     only one of the states with no picture in it: while the browser is
     asking for camera permission, and for as long as the feed takes to
     start, the frame is paper and the brackets were painted paper on
     top of it. .viewer--feed is set when a video is actually playing,
     which is the real question being asked.

     Declared HERE and not on ::after: a custom property re-declared on
     the pseudo-element wins over whatever the element passes down, so
     no state could override it from the outside. */
  --bracket-c:var(--ink);
  /* The camera frame is the one panel that has to answer to viewport
     HEIGHT: it is the thing you hold up, and on a phone in landscape,
     or a short laptop, a 3/4 box taller than the screen puts the
     reticle out of reach. dvh (not vh) so the mobile address bar
     collapsing does not resize it mid-scan, and the tab bar's own
     height comes out of the budget. */
  max-height:calc(72dvh - var(--tabs-h));
  background:var(--paper-2)}
/* Landscape is a different composition, not a shorter portrait: the
   frame turns with the device. Keyed to orientation and aspect rather
   than to a width, so a phone on its side and a laptop both get it. */
@media(min-aspect-ratio:1/1){.viewer{aspect-ratio:4/3}}
@media(min-width:768px){.viewer{aspect-ratio:4/3}}
/* No camera, permission refused, or an insecure page: the frame stops
   being a viewfinder and becomes a message panel. It is sized by the
   message with a floor for presence, so it is a panel on a phone and a
   panel on a monitor rather than a 230px letterbox on both. */
.viewer--stalled{aspect-ratio:auto;min-height:clamp(200px,32dvh,320px);
  max-height:none}
/* a picture is playing: the housing goes paper so it holds against it */
.viewer--feed{--bracket-c:var(--paper)}
.viewer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  /* Monochrome stays: every accent token in this theme is remapped to
     ink, so a colour camera would be the one coloured thing in the whole
     app. But contrast(1.5) crushed the midtones of a live feed until you
     could not see what you were pointing at -- the code is decoded from
     the raw frame, not this filtered view, so the filter's only job is
     legibility for the person aiming. Eased accordingly. */
  filter:grayscale(1) contrast(1.12)}
.viewer__scrim{position:absolute;inset:0;
  background-image:radial-gradient(var(--ink) 1px,transparent 1px);
  background-size:5px 5px;opacity:.09}     /* screentone, not a veil */
/* ── THE VIEWFINDER FRAME ─────────────────────────────────────────
   Four heavy right-angle brackets in cinnabar, pinned to the corners
   of the camera frame. This is one of the four sanctioned uses of the
   seal colour: the system is asking you to aim.

   It has to be a PSEUDO-ELEMENT. The scanner rewrites `viewer.innerHTML`
   wholesale on every state change (no camera, permission refused,
   insecure page), so any child element carrying the frame is destroyed
   the first time the state changes — which is exactly when a user most
   needs the screen to still look like a viewfinder. A pseudo-element
   belongs to the box, not to its contents, and survives every rewrite.

   Eight gradients: a horizontal and a vertical arm per corner. They
   sit at the corners and never across the middle, so they cannot
   obscure what the camera is pointed at. */
.viewer__grain{display:none}
.viewer::after{content:"";position:absolute;inset:clamp(6px,1vw,12px);
  pointer-events:none;z-index:6;
  --bracket:clamp(20px,3.2vw,40px);
  --bracket-w:var(--edge);
  background-repeat:no-repeat;
  background-image:
    linear-gradient(var(--bracket-c) 0 0),linear-gradient(var(--bracket-c) 0 0),
    linear-gradient(var(--bracket-c) 0 0),linear-gradient(var(--bracket-c) 0 0),
    linear-gradient(var(--bracket-c) 0 0),linear-gradient(var(--bracket-c) 0 0),
    linear-gradient(var(--bracket-c) 0 0),linear-gradient(var(--bracket-c) 0 0);
  background-size:
    var(--bracket) var(--bracket-w),var(--bracket-w) var(--bracket),
    var(--bracket) var(--bracket-w),var(--bracket-w) var(--bracket),
    var(--bracket) var(--bracket-w),var(--bracket-w) var(--bracket),
    var(--bracket) var(--bracket-w),var(--bracket-w) var(--bracket);
  background-position:
    left top,left top, right top,right top,
    left bottom,left bottom, right bottom,right bottom}
/* a hit tightens the brackets inward — the frame closing on the code */
.viewer--hit::after{inset:clamp(12px,2vw,22px)}

.viewer--hit .viewer__grain{inset:6px}
.viewer__status,.viewer__msg{position:relative;font-family:var(--f-accent);
  text-transform:uppercase;text-align:center}
/* THE WAITING MARK. `.loader` was applied in JS and styled in no
   stylesheet, so the only thing sizing it was an inline
   `inset:0;margin:auto` and the SVG's own default of filling its box.
   It is a mark now: sized like the reticle's inner ring, centred in
   it, and turning in twelve discrete steps because nothing in this
   system eases. */
.loader{position:absolute;top:50%;left:50%;
  width:clamp(54px,42%,116px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  color:var(--ink);pointer-events:none;z-index:4;
  animation:loaderTurn 1.2s steps(12,end) infinite}
.loader svg{width:100%;height:100%;display:block}
@keyframes loaderTurn{from{transform:translate(-50%,-50%) rotate(0deg)}
                      to  {transform:translate(-50%,-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .loader{animation:none} }

.reticle{position:relative;width:64%;aspect-ratio:1;max-width:250px}
.reticle__c{position:absolute;width:26px;height:26px;border:var(--rule) solid var(--ink)}
.reticle__c--tl{top:0;left:0;border-right:0;border-bottom:0}
.reticle__c--tr{top:0;right:0;border-left:0;border-bottom:0}
.reticle__c--bl{bottom:0;left:0;border-right:0;border-top:0}
.reticle__c--br{bottom:0;right:0;border-left:0;border-top:0}
.reticle__line{position:absolute;left:0;right:0;height:2px;background:var(--ink)}
.reticle__geo,.reticle__mark{position:absolute;inset:-14%;opacity:.3;pointer-events:none}
.reticle__geo circle,.reticle__geo polygon,.reticle__geo path,.reticle__geo line,
.reticle__mark circle,.reticle__mark polygon,.reticle__mark path,.reticle__mark line{
  fill:none;stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke}
/* `.manual` is a child of the view grid, so the tier gap already
   separates it from the frame above. The extra margin was a second
   gap stacked on the first — 92px of paper between the scanner and
   the fallback that belongs with it. */
.manual{padding:var(--s5);border:var(--rule) solid var(--ink)}
/* A text field and its button are a row until the row stops working.
   `flex-wrap` plus a real basis on the input is the whole rule: the
   pair sits side by side wherever there is room for both, and the
   button drops to its own full-width line when there is not, instead
   of squeezing the input down to a few characters. */
.field{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:stretch}
/* A `.field` is used in two shapes: a control beside its button (the
   manual code entry), and a label above its control (every form in the
   board tools). One rule serves both — a label given a full flex basis
   takes its own line and the controls flow under it — so neither shape
   needs a per-screen `display` override, and neither can end up with a
   caption wedged beside a text box in a narrow column. */
.field > .kicker{flex:1 0 100%;margin-bottom:2px}
/* The input takes essentially all of the row's growth and the button
   takes its natural width — until the row wraps, at which point the
   button is alone on its line and its `1 1` basis fills it. One
   declaration covers "beside the field" and "under the field" without
   a breakpoint deciding which. */
.field > .btn{flex:1 1 auto;min-width:max-content}
.field > .input{flex:999 1 min(100%,13ch)}
/* ══════════════════ INPUTS ══════════════════
   A precision data-entry field, not a rounded box. There is no
   bounding rectangle: the field is a ruled line you write on, which is
   what a form on paper actually is. Focus is the one place the seal
   appears on an otherwise idle screen — the rule turns cinnabar and a
   terminal caret marks the entry point. */
.input{flex:1 1 min(100%,13ch);min-width:0;
  padding:11px var(--s2) 9px;
  background:transparent;color:var(--ink);
  border:0;border-bottom:var(--edge-thin) solid var(--ink);border-radius:0;
  font:500 clamp(13px,.4vw + 11.7px,14.5px)/1.2 var(--f-mono);
  letter-spacing:.08em;transition:none}
.input::placeholder{color:var(--tone);letter-spacing:.06em}
/* Focus thickens the rule; it does not colour it. Cinnabar belongs to
   the TARGET, and on the scan screen a red underline meant the page
   could show three red marks at once — the reticle, the rule and the
   prompt — which is three more than this system allows. Weight is the
   signal, and weight reads for someone who cannot see the hue. */
.input:focus{outline:0;border-bottom-color:var(--ink);
  border-bottom-width:var(--edge-heavy)}
/* The caret marker rides on the field wrapper, not on the input, so it
   cannot shift the text it is marking. */
.field{position:relative}
.field:focus-within::before{content:">";position:absolute;left:2px;bottom:11px;
  font:700 13px/1 var(--f-mono);color:var(--ink);pointer-events:none;z-index:2}
.field:focus-within > .input{padding-left:var(--s4)}
select.input{padding-right:var(--s4)}

/* ══════════════════ BOARD / QR ══════════════════ */
.qrpanel{padding:var(--s5);border:var(--rule) solid var(--ink);background:var(--paper)}
.qrpanel__head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.qrpanel__no{font-family:var(--f-display);font-size:30px;white-space:nowrap}
.qrpanel__when{font:500 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--tone)}
/* A display numeral and a letterspaced date cannot sit side by side in
   ~250px: "MPR 09" broke across two lines and the date wrapped back
   into it, so the two ran together. Wrapping is the rule rather than a
   breakpoint — the pair sits on one line when there is room for it and
   stacks when there is not, which is also the reading order. */
.qrpanel__head{flex-wrap:wrap}
.qrpanel__no{font-size:clamp(22px,3.4vw,32px)}
.qrpanel__when{line-height:1.4}
.qrpanel__code{display:grid;place-items:center;padding:var(--s5);background:#fff;
  margin-top:var(--s4);border:var(--rule) solid var(--ink)}
.qrpanel__uri{font:500 11px/1.5 var(--f-mono);word-break:break-all;color:var(--tone);
  margin-top:var(--s3)}
.qrpanel__roll{font:500 10px/1 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;margin-top:var(--s2)}
.picker{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* ══════════════════ MEMBER ══════════════════ */
.who{display:flex;align-items:center;gap:var(--s4);padding:var(--s5)}
.who__name{font-family:var(--f-display);font-size:var(--t-name);text-transform:uppercase}
.who__role{font:500 10px/1 var(--f-mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--tone);margin-top:6px}
.who__seal{width:70px;height:70px;flex:none}
.who__seal circle,.who__seal polygon,.who__seal path,.who__seal line{
  fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.who__seal--img{object-fit:contain}
/* ══════════════════ EMPTY STATES ══════════════════
   Centred text in a dashed box is a placeholder, not a state. An empty
   state here is a blank seal: the mark that would have been pressed,
   drawn faint and large behind a technical line of copy explaining
   what would fill it. The geometry comes from the app's own seal
   glyph, so an empty screen still looks like Keystamp. */
.panel.empty{position:relative;isolation:isolate;
  padding:var(--s8) var(--s5);text-align:left;color:var(--ink-2);
  border:0;border-top:var(--edge) solid var(--ink);
  display:flex;flex-direction:column;align-items:flex-start;
  gap:var(--space-stack-sm);min-height:clamp(180px,26vh,280px);
  justify-content:center;overflow:hidden}
/* the unpressed seal: concentric geometry, tone weight, cropped by
   the panel so it reads as a watermark rather than as an icon */
.panel.empty::before{content:"";position:absolute;z-index:0;pointer-events:none;
  right:calc(var(--s5) * -1);top:50%;transform:translateY(-50%);
  width:clamp(140px,22vw,240px);aspect-ratio:1;
  border:var(--edge-thin) solid var(--v3);border-radius:50%;
  background:
    radial-gradient(circle, transparent 0 38%, var(--v3) 38% 39%, transparent 39%),
    repeating-conic-gradient(from 0deg at 50% 50%,
      var(--v3) 0deg 1deg, transparent 1deg 22.5deg);
  opacity:.5}
.panel.empty > *{position:relative;z-index:1;max-width:46ch}
.panel.empty .h2{color:var(--ink);font-size:clamp(13px,1.2vw,16px)}
.panel.empty p{font-size:clamp(12.5px,.9vw,14px);line-height:1.55;color:var(--ink-2)}
.panel.empty svg{width:clamp(30px,3vw,40px)!important;height:clamp(30px,3vw,40px)!important;
  /* it is a drawn mark now rather than a stock glyph, so it can hold
     its own weight — .55 had it dissolving into the watermark behind */
  opacity:.75;margin-bottom:var(--s2)}

/* ══════════════════ VERDICT — a full-page reaction panel ══════════════════ */
.verdict{position:fixed;inset:0;z-index:120;display:none;place-items:center;
  overflow:hidden;background:var(--paper)}
.verdict.is-on{display:grid}
.verdict__flare{position:absolute;inset:0;
  background-image:repeating-conic-gradient(from 0deg at 50% 50%,
    var(--ink) 0deg 1.4deg,transparent 1.4deg 5deg);opacity:0}
.verdict__ring{position:absolute;border:var(--rule) solid var(--ink);
  border-radius:50%;opacity:0}
.verdict__field{position:absolute;inset:0;margin:auto;width:min(128vmin,820px);opacity:.1}
/* viewport-fit=cover means this full-screen panel extends under the
   notch and the home indicator. The insets keep its content out of
   both, and the width cap stops a single line running the full measure
   of a monitor. */
.verdict__inner{position:relative;text-align:center;
  padding:calc(var(--s6) + env(safe-area-inset-top, 0px))
          calc(var(--s6) + env(safe-area-inset-right, 0px))
          calc(var(--s6) + env(safe-area-inset-bottom, 0px))
          calc(var(--s6) + env(safe-area-inset-left, 0px));
  width:100%;max-width:min(46ch,100%);margin-inline:auto}
.verdict__seal{width:min(34vmin,190px);height:min(34vmin,190px);margin:0 auto}
.verdict__seal circle,.verdict__seal polygon,.verdict__seal path,.verdict__seal line{
  fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.verdict__state{font:500 11px/1 var(--f-mono);letter-spacing:.24em;
  text-transform:uppercase;margin-top:var(--s4)}
.verdict__jp{font-family:var(--f-jp);font-size:12px;letter-spacing:.6em;color:var(--tone)}
.verdict__title{font-family:var(--f-display);font-size:clamp(30px,7vw,58px);
  text-transform:uppercase;line-height:1;margin-top:var(--s3)}
.verdict__delta{font-family:var(--f-display);font-size:26px;margin-top:var(--s2)}
.verdict__meet{font:500 10px/1 var(--f-mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--tone);margin-top:var(--s3)}

/* ══════════════════ FX LAYER ══════════════════ */
.fx{position:fixed;inset:0;z-index:125;pointer-events:none;overflow:hidden;
  contain:layout paint}
.scrim{position:absolute;inset:0;background:var(--ink);opacity:0}
.flash{position:absolute;inset:0;background:var(--paper);opacity:0}
.frameword{position:absolute;inset:0;display:grid;place-items:center;opacity:0;
  font-family:var(--f-display);font-size:clamp(48px,13vw,150px);
  text-transform:uppercase;color:var(--ink)}
.wellflare{display:none}
.fxdefs{position:absolute;width:0;height:0}

/* ══════════════════ TABS — the held-device navigation ══════════════
   viewport-fit=cover is set in the document head, which deliberately
   extends the page under the home indicator. The bar keeps its own
   height and adds the inset as padding, so the strip is paper rather
   than a cropped control.

   --tabs-h is the single source of truth for how much of the bottom of
   the screen this bar owns. Page padding, callout placement and the
   scanner's height budget all read it, so the bar can never end up
   covering the end of a page: there is one number, not four guesses.
   It goes to 0 on the tier where the rail replaces it. */
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:var(--paper);border-top:var(--rule) solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:env(safe-area-inset-left, 0px);
  padding-right:env(safe-area-inset-right, 0px)}
/* Five tabs share a 320px bar, so a tab is 64px wide and the label has
   to fit inside it. min-width:0 lets the flex item shrink below its
   longest word instead of forcing the bar wider than the screen, and
   the tracking is fluid so "REWARDS" stays one line at 320 and still
   reads as a letterspaced label at 430. */
.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  min-height:var(--tabs-h);padding:8px 2px;background:none;border:0;cursor:pointer;
  color:var(--ink);font:500 clamp(8px,2.2vw,9.5px)/1 var(--f-body);
  letter-spacing:clamp(.02em,.5vw - 1.5px,.14em);text-transform:uppercase;
  white-space:nowrap;overflow:hidden}
.tabs button svg{width:19px;height:19px;stroke-width:1.9}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tabs__ind{display:none}

/* ══════════════════ BOOT — the title page ══════════════════ */
.boot{position:fixed;inset:0;z-index:200;background:var(--paper);display:grid;
  place-items:center;overflow:hidden}
.boot.is-done{display:none}
.boot__seal{position:absolute;width:min(44vmin,250px);height:min(44vmin,250px);opacity:0}
.boot__seal circle,.boot__seal polygon,.boot__seal path,.boot__seal line{
  fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.boot__mark{position:relative;opacity:0}
.boot__mark svg,.boot__mark img{width:94px;height:94px;object-fit:contain}
.boot__mark path{fill:none;stroke:var(--ink);stroke-linecap:round}
.boot__title{position:absolute;inset:0;display:grid;place-items:center;
  opacity:0;pointer-events:none}
.boot__half{grid-area:1/1;font-family:var(--f-display);
  font-size:clamp(46px,15vw,116px);line-height:1;letter-spacing:-.01em;
  text-transform:uppercase;color:var(--ink);white-space:nowrap}
.boot__half--a{clip-path:polygon(-20% -20%,120% -20%,120% 34%,-20% 66%)}
.boot__half--b{clip-path:polygon(-20% 66%,120% 34%,120% 120%,-20% 120%)}
/* dvh, and a safe-area floor: on a notched phone `12vh` measured
   against the tall viewport put this line in the home-indicator strip
   whenever the address bar was collapsed. */
.boot__jp{position:absolute;
  bottom:max(12dvh, calc(var(--s7) + env(safe-area-inset-bottom, 0px)));
  font-family:var(--f-jp);font-size:13px;
  letter-spacing:.66em;color:var(--tone);opacity:0}

/* ══════════════════════════════════════════════════════════════════
   RESPONSIVE — THE SHELL

   The application used to change shape exactly once, at 900px. That
   put a 768px iPad portrait and a 1024px laptop on opposite sides of
   the same cliff, and everything from 320px to 900px got one identical
   phone layout — which is why a tablet rendered as a stretched phone
   and a 320px phone rendered as a squeezed tablet.

   Five tiers now, written mobile-first so each one only says what
   CHANGES. The narrow layout is the base, so nothing has to be undone
   at the small end and no `max-width` exception is needed to protect
   it.

     base     ≤ 767   phones. One column, tab bar, tight gutters.
     ≥ 768    tablets. Still the tab bar (a thumb-reachable bar is the
              right control on a held slab) but a genuine two-column
              spread and desktop-scale gutters, so it stops being a
              wide phone.
     ≥ 1024   laptops. The chapter rail replaces the tab bar and the
              six-column spread begins.
     ≥ 1280   desktop. The composition opens to its designed
              proportions.
     ≥ 1600   large monitors. The column ceiling lifts so the page
              fills the screen instead of stranding content in the
              middle of it.
   ══════════════════════════════════════════════════════════════════ */

/* ── base: the phone page ─────────────────────────────────────────
   Written as the default rather than inside a max-width query, so it
   is what every unknown or very narrow device gets. */
.shell{grid-template-columns:1fr}
.rail{display:none}
.topbar{display:flex}
.tabs{display:flex}
.view{grid-template-columns:repeat(2,minmax(0,1fr))}
[data-screen="home"] .view > .head,
[data-screen="home"] .view > section:nth-of-type(1),
[data-screen="home"] .view > .strike,
[data-screen="home"] .view > section:nth-of-type(2),
[data-screen="home"] .view > .duo{grid-area:auto/1/auto/-1}
[data-screen="record"] .view > section,
[data-screen="rewards"] .view > section{grid-column:1/-1}
.duo{grid-template-columns:1fr}
/* A bleed needs page margin to run into. On a phone the margin IS the
   safe edge, so the panel keeps its gutter rather than sitting on the
   glass with its border removed. */
.panel--bleed{margin-right:0;border-right:var(--rule) solid var(--ink)}

/* ── ≥768: tablets get a spread, not a wide phone ─────────────── */
@media(min-width:768px){
  .duo{grid-template-columns:3fr 2fr}
  [data-screen="record"] .view > section,
  [data-screen="rewards"] .view > section{grid-column:1/-1}
}

/* ── ≥1024: the rail, and the six-column spread ─────────────────── */
@media(min-width:1024px){
  :root{--tabs-h:0px;--rule:3px}
  .shell{grid-template-columns:var(--rail) 1fr}
  .rail{display:flex}
  .topbar{display:none}
  .tabs{display:none}
  .view{grid-template-columns:repeat(6,minmax(0,1fr))}
  [data-screen="home"] .view > .head{grid-area:1/1/2/-1}
  [data-screen="home"] .view > section:nth-of-type(1){grid-area:2/1/3/4}
  [data-screen="home"] .view > .strike{grid-area:2/4/3/-1}
  [data-screen="home"] .view > section:nth-of-type(2){grid-area:3/1/4/-1}
  [data-screen="home"] .view > .duo{grid-area:4/1/5/-1}
  .duo{grid-template-columns:1fr 1fr}
  .panel--bleed{margin-right:calc(var(--bleed) * -1);border-right:0}
}

/* ── ≥1280: the designed proportions ────────────────────────────── */
@media(min-width:1280px){
  [data-screen="home"] .view > section:nth-of-type(1){grid-area:2/1/3/5}
  [data-screen="home"] .view > .strike{grid-area:2/5/3/-1}
  .duo{grid-template-columns:4fr 2fr}
}

/* ── ≥1600: a wider column, so the page is not an island ────────── */
@media(min-width:1600px){
  :root{--page-max:1560px}
}

.no-motion *{animation:none!important;transition:none!important}

/* ══════════════════ GUARD BAR ══════════════════ */
#guardbar{position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:12px 16px;
  background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:12px;
  line-height:1.5;border-top:var(--rule) solid var(--ink);word-break:break-word}

/* ══════════════════════════════════════════════════════════════════
   LOG ROWS — the entry grid the v4 sheet carried and this one dropped.
   Without it every field collapses into one run-on line.
   ══════════════════════════════════════════════════════════════════ */
/* min-width:0 overrides the flex/grid-item default of `auto`, which
   resolves to the item's min-content size. `.rec` sits as a grid item
   inside `.log`'s `repeat(2,1fr)` (or `repeat(6,1fr)`) columns, and
   without this its own content's min-content width won capped by the
   track — that forced both mobile card columns to ~186px each against
   an available ~170px, pushing the whole grid (and the page) wider
   than the viewport instead of letting the card text wrap. */
/* Interior padding belongs on the component, not on one screen. `.rec`
   is drawn with an ink frame at its box edge, and it is used in two
   places: the record log (which set its own padding) and the profile's
   milestone list (which did not). There the frame's top edge was ruled
   straight through the first line of text — "Club Merch" was cut in
   half by its own card border. The record screen's own padding rule is
   more specific and still wins. */
.rec{display:flex;align-items:stretch;gap:var(--s3);position:relative;
  padding:var(--s3) var(--s4);min-width:0}
.rec + .rec{border-top:var(--rule-hair) solid var(--ink);padding-top:var(--s3)}
.rec__node{width:9px;height:9px;background:var(--ink);flex:none;margin-top:6px}
.rec--upcoming .rec__node,.rec--miss .rec__node{background:var(--paper);
  border:var(--rule-hair) solid var(--ink)}
/* `1fr` carries an automatic minimum of min-content, so the text column
   could not shrink below its longest word — "ATTENDANCE" plus "+1
   stamp" needed 162px inside a 151px card and the whole grid simply
   grew past the card, where `overflow:hidden` cut the gain in half
   ("+1 stan"). `minmax(0,1fr)` lets the column give, so the text wraps
   instead of the box overflowing. This is the single most common cause
   of a grid child that will not fit, and it belongs here rather than
   at each call site. */
.entry{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"no gain" "verdict gain" "meta meta";
  gap:2px var(--s3);align-items:baseline;text-align:left;background:none;
  border:0;padding:0;cursor:inherit;color:var(--ink);position:relative;
  overflow:hidden;font-family:var(--f-body)}
/* The clip stays — it is what crops the decorative page numeral to the
   row's frame — but with a track that can shrink there is no longer any
   content for it to cut. */
.entry__verdict{line-height:1.25}
.entry__gain{white-space:nowrap}
button.entry{cursor:pointer}
.entry__no{grid-area:no}
.entry__verdict{grid-area:verdict;display:flex;align-items:center;gap:6px}
.entry__meta{grid-area:meta;margin-top:3px}
.entry__gain{grid-area:gain;align-self:center}
.entry__ghost{position:absolute;right:-2px;top:-14px;font-family:var(--f-display);
  font-size:44px;line-height:1;color:var(--ink);opacity:.07;pointer-events:none}
.entry--open .entry__verdict{background:var(--ink);color:var(--paper);
  padding:2px 7px;justify-self:start}
.entry--open .pip{background:var(--paper)}
.entry--miss{opacity:.55}

/* ══════════════════════════════════════════════════════════════════
   THE TWO PANELS THAT BREAK THEIR BOX

   A page where every panel is an aligned rectangle is a grid, not a
   spread. One panel per screen is cut on the diagonal and one runs off
   the right edge of the paper. Applied here rather than in the markup
   so the views stay untouched.
   ══════════════════════════════════════════════════════════════════ */
[data-screen="home"] .view > section:nth-of-type(1) .panel{
  --cut:clamp(20px,2.6vw,36px); --cut-in:calc(var(--cut) - var(--rule));
  background:var(--ink);border:0;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
[data-screen="home"] .view > section:nth-of-type(1) .panel::before{
  content:"";position:absolute;inset:var(--rule);z-index:0;background:var(--paper);
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut-in)),calc(100% - var(--cut-in)) 100%,0 100%)}
[data-screen="home"] .view > section:nth-of-type(1) .rig__ghost{display:none}

/* The right-edge bleed only reads as a bleed when there is page gutter
   for it to run into. On a phone the gutter IS the safe margin, so the
   negative margin put the panel's edge exactly on the viewport edge
   (measured 390.0px at 390px wide) with its right border removed — the
   panel looked cut off by the browser rather than by the layout, and it
   was the only element on the page without a margin. Desktop keeps the
   break; mobile keeps its gutter. */
@media(min-width:1024px){
  [data-screen="home"] .view > .duo > .rig:last-child .panel{
    margin-right:calc(var(--bleed) * -1);border-right:0}
}
[data-screen="home"] .view > .duo > .rig:last-child .rig__ghost{display:none}

/* tiers are deliberately unequal heights — the establishing panel is
   short, the stamp card is the tall one, the closers are shallow */
[data-screen="home"] .view > .head{min-height:clamp(72px,7vw,104px)}
/* `align-items:flex-end` dated from when the chamber was a horizontal
   black card and the value meant "bottom". The chamber is a column
   now, so that same declaration meant "right" and pushed the label
   off its own left margin. The label reads from the top-left corner,
   which is where a heading starts. */
[data-screen="home"] .view > .strike{align-items:flex-start}
[data-screen="home"] .view > .duo{margin-top:calc(var(--gut-tier) * -.35)}

/* ══════════════════ RAIL BRAND ══════════════════ */
.rail__brand svg,.rail__brand img{width:44px;height:44px;display:block}
.rail__brand svg *{stroke:var(--ink)!important;fill:none!important}
.rail__brand,.topbar #barBrand{font-family:var(--f-display);font-size:15px;
  text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
#barBrand svg{width:26px;height:26px}
#barBrand svg *{stroke:var(--ink)!important;fill:none!important}
.boot__mark svg *{stroke:var(--ink)!important;fill:none!important}

/* ══════════════════ SPEED LINES ══════════════════
   The FX layer draws these; they only ever appear in ink. */
.lines line,.lines path,.slash path,.slash rect{stroke:var(--ink);fill:var(--ink)}

/* The per-tier home composition now lives in one place — the ladder
   above — rather than in three overlapping ranges here. What remains is
   the small-screen behaviour of individual components, expressed as the
   base state and lifted at ≥768 rather than as a `max-width` exception.

   The stat plate is a good example of why: it was `repeat(auto-fit,
   minmax(96px,1fr))` with a hard two-column override under 560px, so
   the number of columns depended on which of the two rules won rather
   than on how much room there actually was. auto-fit with a floor is
   the whole answer, at every width. */
.stats{grid-template-columns:repeat(auto-fit,minmax(clamp(120px,40%,168px),1fr))}
.hero__ring{display:none}          /* it sits under the number at this width */
/* Callouts clear the tab bar AND the home indicator, so a message never
   lands on the navigation or in the gesture strip. */
.toasts{left:var(--gutter);right:var(--gutter);max-width:none;
  bottom:calc(var(--tabs-h) + var(--s3) + env(safe-area-inset-bottom, 0px))}
@media(min-width:1024px){
  .hero__ring{display:block}
  .toasts{left:auto;right:var(--s5);bottom:var(--s5);max-width:min(330px,32vw)}
}

/* the giant cropped word is decorative and aria-hidden; it is allowed to
   run off the page but never to create a scrollbar */
.bleed{max-width:none;contain:paint}
html,body{overflow-x:clip;max-width:100%}

/* ══════════════════════════════════════════════════════════════════
   PANEL VALUE — what tone a panel is printed at.

   Assigned per panel rather than globally, because the point of the
   tonal scale is contrast between neighbours. A page reads as manga
   when one panel is nearly empty paper and the one beside it is solid
   ink; it reads as a website when they are all the same card.
   ══════════════════════════════════════════════════════════════════ */
.p-quiet{background:var(--v0);border-width:var(--edge-hair)}
.p-soft {background:var(--v1);border-width:var(--edge-thin)}
.p-tone {background:var(--v2);border-width:var(--edge)}
.p-deep {background:var(--v6);color:var(--v0);border-width:var(--edge-heavy);border-color:var(--v6)}
.p-shout{background:var(--v6);color:var(--v0);border-width:var(--edge-shout);border-color:var(--v6)}
.p-open {background:transparent;border:0}

.p-deep .kicker,.p-shout .kicker,.p-deep .muted,.p-shout .muted{color:var(--v3)}
.p-deep .h2,.p-shout .h2{color:var(--v0)}

/* ══════════════════════════════════════════════════════════════════
   CONTROLLED IMPERFECTION

   Inked panel edges are not machine-straight. These are small enough
   that you feel them rather than see them — a fraction of a degree of
   rotation, an edge that is heavier on one side than the other, a
   corner that does not quite close. Applied by position so the page
   stays composed rather than becoming noise.
   ══════════════════════════════════════════════════════════════════ */
.ink-a{transform:rotate(-.28deg)}
.ink-b{transform:rotate(.34deg)}
.ink-c{transform:rotate(-.15deg) translateY(-2px)}
/* one side inked heavier, the way a brush loads unevenly */
.ink-load{border-left-width:calc(var(--edge) * 1.9)}
.ink-load-t{border-top-width:calc(var(--edge) * 1.7)}
/* a corner that does not quite close */
.ink-open-br{border-bottom-right-radius:0;
  clip-path:polygon(0 0,100% 0,100% 92%,97% 100%,0 100%)}

/* ══════════════════════════════════════════════════════════════════
   NARRATION BOX — the caption in the corner of a panel, not a card.
   Hard-cornered, always tight to an edge, always small.
   ══════════════════════════════════════════════════════════════════ */
.narr{position:absolute;z-index:6;background:var(--v0);color:var(--v5);
  border:var(--edge-thin) solid var(--v5);padding:7px 11px 8px;
  max-width:min(48%,300px);font-family:var(--f-accent);
  font-size:clamp(10px,.95vw,13px);line-height:1.3;text-transform:uppercase}
.narr--tl{top:0;left:0;border-top:0;border-left:0}
.narr--tr{top:0;right:0;border-top:0;border-right:0}
.narr--bl{bottom:0;left:0;border-bottom:0;border-left:0}
.narr__ch{display:block;font-family:var(--f-mono);font-size:9px;
  letter-spacing:.24em;color:var(--v3);margin-bottom:3px}

/* ══════════════════════════════════════════════════════════════════
   SFX — lettering as artwork. Outlined, rotated, oversized, and always
   clipped by the panel that contains it. Never a floating decoration.
   ══════════════════════════════════════════════════════════════════ */
.sfx{position:absolute;z-index:5;pointer-events:none;font-family:var(--f-display);
  font-size:var(--t-sfx);line-height:.78;text-transform:uppercase;
  letter-spacing:-.03em;white-space:nowrap;
  color:transparent;-webkit-text-stroke:2.5px var(--v5);
  paint-order:stroke fill}
.sfx--solid{color:var(--v6);-webkit-text-stroke:0}
.sfx--knock{color:var(--v0);-webkit-text-stroke:2.5px var(--v0)}
.sfx--a{right:-4%;bottom:-9%;transform:rotate(-8deg);opacity:.13}
.sfx--b{left:-3%;top:-7%;transform:rotate(6deg);opacity:.1}

/* ══════════════════════════════════════════════════════════════════
   CHAPTER RAIL — a volume index, not a navbar.
   ══════════════════════════════════════════════════════════════════ */
.rail__vol{font-family:var(--f-mono);font-size:9px;letter-spacing:.26em;
  color:var(--v3);text-transform:uppercase}
.rail__link{position:relative}
.rail__no{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
  color:var(--v3);margin-right:9px;min-width:18px}
.rail__link[aria-current="page"] .rail__no{color:var(--v0)}
.pageno{position:fixed;right:calc(var(--gutter) * .5);bottom:var(--s5);z-index:40;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--v3);
  writing-mode:vertical-rl;pointer-events:none}
.pageno{display:none}
@media(min-width:1024px){.pageno{display:block}}

/* ══════════════════════════════════════════════════════════════════
   PAGE RHYTHM — the tiers are deliberately unequal in height.

   Establishing shot, then the dominant panel beside a loud narrow one,
   then the wide quiet card, then two small closers. The proportions
   below are the composition; they are not derived from content.
   ══════════════════════════════════════════════════════════════════ */
/* The hero tier is given presence by a minimum, not a fixed height:
   `minmax(300px,38vh)` made the row 38vh on a 720px-tall laptop —
   274px — which is SHORTER than the 300px floor it was paired with, so
   the row lost the argument and clipped the panel's own header off the
   top. `auto` with a min-height on the panel states the intent
   (at least this tall, taller if the content needs it) without ever
   being able to crop it. */
[data-screen="home"] .view{grid-template-rows:auto auto auto auto}
@media(min-width:1024px){
  [data-screen="home"] .hero{min-height:min(38dvh,320px)}
}
[data-screen="home"] .view > .head{min-height:clamp(84px,9vw,132px);
  display:flex;align-items:flex-end}
[data-screen="home"] .view > .head .title{margin-bottom:-.12em}

/* the hero is the one thing you look at first: a number cropped by its
   own panel, printed on near-empty paper */
[data-screen="home"] .hero{display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;padding:var(--s5) var(--s5) var(--s4)}
/* Dela Gothic One's digits overrun their line box: `line-height:.84` on a
   216px face leaves the glyphs sitting up to 5.6px BELOW the box bottom
   (measured 1.4px at 375 rising to 5.6px at 1440). A negative margin here
   subtracted from space the glyphs were already borrowing, so the caption
   was struck through by the 0 and the 7 — mid-word, which reads as a
   rendering fault rather than a composed overlap.
   NOTE: this is invisible unless the real webfont is loaded. With the
   fallback stack the glyphs stay inside the box and the collision does
   not reproduce, which is exactly how it survived an earlier pass.
   A positive .03em reserves the overrun and holds 12-13px of clear space
   at every width. */
/* `letter-spacing` is applied AFTER the last glyph as well as between
   glyphs, so a negative value on the number pulls whatever follows it
   backwards — at 204px that is 11px of "/ 10" sitting on top of the
   final digit. The tracking is what gives the figure its weight, so it
   stays; the trailing space it removes is given back explicitly. */
[data-screen="home"] .hero__num{letter-spacing:-.055em;margin-bottom:.03em;
  padding-right:.055em}
/* The count and its target are one figure, so they stay on one line and
   shrink together rather than wrapping the "/ 10" under the number. */
[data-screen="home"] .hero__core{align-items:flex-end;flex-wrap:nowrap;
  min-width:0}
/* The status pair above it is two independent labels, and on a 320px
   column they need 300px between them. They wrap rather than collide. */
.hero__top{flex-wrap:wrap;row-gap:var(--s2)}
.hero__top > *{min-width:0}
.hero__state{font:500 clamp(10.5px,2.9vw,12px)/1.2 var(--f-mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
/* The caption and the vertical mark shared a block box, so the mark ran
   into the end of the sentence at every width where the sentence was
   long. They are a row with a gap now, and the sentence is allowed to
   take the room it needs. */
/* One line, always. Wrapping put the vertical mark on a second row
   where the bottom-aligned panel had no space for it, so on a narrow
   laptop column it landed half outside the panel's cut corner. The
   caption is the flexible half: it wraps inside its own box and the
   mark keeps its place at the end of the line. */
.hero__foot{display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s3);flex-wrap:nowrap}
.hero__foot .kicker{min-width:0;flex:1 1 auto;line-height:1.35}
.hero__foot .jp{flex:none}

/* and the chamber beside it is the loud one — heaviest edge on paper,
   not a black card. The weight comes from the keyline and the corner
   marks; the darkness is spent on the target block inside it. */
[data-screen="home"] .view > .strike{border-width:var(--edge)}

/* the closers are quiet and small — the silence after the impact */
[data-screen="home"] .view > .duo .panel{background:var(--v1);
  border-width:var(--edge-thin)}
[data-screen="home"] .view > .duo .h2{font-size:11px;letter-spacing:.2em}

/* the stamp card is the wide detail panel: light tone, not white */
[data-screen="home"] .view > section:nth-of-type(2) .panel{background:var(--v1)}
[data-screen="home"] .seals{gap:clamp(6px,.9vw,13px)}

.head{position:relative;overflow:visible}
.hero{position:relative}
.rig{isolation:isolate}

/* A narrow page is a vertical page, not a stacked desktop. The tier
   heights below the laptop breakpoint come from content, never from a
   fraction of the screen — a bottom-aligned panel with a fixed height
   reserves air it never fills, which is what made the hero read as a
   mostly-empty rectangle on a phone. */
[data-screen="home"] .view{grid-template-rows:none}
.narr{max-width:min(70%,320px);font-size:clamp(10.5px,2.8vw,13px)}
.sfx{font-size:clamp(56px,22vw,140px)}

/* ── corrections after looking at the render ──
   Type cropped by a panel edge is a manga move, but only when the crop
   is decisive. Clipped by exactly the border width reads as a bug, so
   the establishing panel is taller and the name sits clear of the edge
   with the narration box out of its way. */
/* Type cropped by a panel edge is a manga move, but only when the crop
   is decisive — clipped by exactly the border width reads as a bug. The
   nameplate is sized by its title (which is a member's name, and can be
   one long word) with a floor for presence, and it no longer clips: the
   descender of a name is not a composition. */
[data-screen="home"] .view > .head{min-height:clamp(104px,11vw,168px);
  padding-top:calc(var(--s6) + 6px);overflow:visible}
[data-screen="home"] .view > .head .title{margin-bottom:-.16em;
  line-height:.9;max-width:100%}
/* Home's title is a member's name — arbitrary user data, not a designed
   word, and it can be far longer than any chapter heading. At the
   chapter scale "MEMBERUSER." needed 250px of a 218px column on a
   320px phone and `overflow-wrap:anywhere` duly split it mid-word into
   "MEMBERUSE / R.". It gets its own floor, well under the chapter
   scale, so ordinary names sit on one line at every width, and
   `break-word` so a genuinely enormous name still wraps inside the
   nameplate rather than escaping it. */
.title--name{font-size:clamp(24px,7.2vw,92px);overflow-wrap:break-word}
.narr--tl{max-width:min(38%,240px)}

/* SFX belongs at a panel corner, cropped by it, behind the content —
   not floating across the middle of the gauge */
.sfx{z-index:0}
/* `.sfx` is excluded so the decorative word stays absolutely
   positioned behind the content instead of being pulled into flow by
   this rule's higher specificity — on the mobile hero that alone added
   56px of empty panel height. */
.hero > *:not([data-layer]){position:relative;z-index:2}
.sfx--a{right:auto;left:-2%;bottom:-14%;top:auto;transform:rotate(-7deg);
  opacity:.22;-webkit-text-stroke-width:3px}
[data-screen="home"] .hero{overflow:hidden}

/* SFX still crossed the gauge and the caption at desktop width. Pushed
   fully into the corner and cropped hard, which is where lettering sits
   on a real page — anchored to the panel, not floating in it. */
.sfx--a{left:auto;right:-3%;bottom:-18%;transform:rotate(-6deg);opacity:.16}
.sfx--a{right:-8%;bottom:-12%;opacity:.2}
@media(min-width:1024px){.sfx--a{right:-3%;bottom:-18%;opacity:.16}}

/* ══════════════════════════════════════════════════════════════════
   THE EDGE — a ruled line, not a drawn one.

   Every panel edge used to be a filled SVG band with two independently
   wobbling contours, drawn by 07-ink.js: the CSS border stayed in the
   box model and turned transparent so the drawing could take its
   place. The intent was "a person drew this". The result read as a
   generic rough-border effect, and — more damagingly for this system —
   it softened every edge in the application, removing exactly the
   tension the composition depends on.

   The drawing layer is gone. The borders that were always there in the
   box model simply paint again, which is why removing ~200 lines of
   SVG changed no geometry at all: every measurement from the
   responsive pass still holds.

   What the ink layer got right was that panels should not all carry
   the same edge. That survives as --ink-w, which is now a real border
   width in px rather than a stroke weight, assigned by rank in the art
   direction layer. A lead panel is 4px of absolute ink; a quiet one is
   a hairline.
   ══════════════════════════════════════════════════════════════════ */
.panel,.head,.strike,.seal,.narr,.qrpanel,.manual,.viewer,.stat,.rec,
.authp,.bpanel,.bnext,.tech{
  border-width:calc(var(--ink-w, 2.8) * 1px);
  border-style:solid;
  border-radius:0;
}
/* Decorative layers must never contribute to layout.

   These `> *` rules exist so a panel's real content stacks above its
   background art. The trouble is that `.panel > *` outranks the single
   class an absolutely-positioned child declares itself with, so every
   new out-of-flow element was silently dragged back into the layout —
   .chamber__c bunched into a corner, .rune doubled the nameplate's
   height, .sealmeta stretched its slot to twice its size, and the
   hero's .tick corner marks have been in flow this whole time.

   Chasing that with a growing list of :not() class names was the
   defect: it only ever excluded the ones somebody had already been
   bitten by. The exclusion is one MARKER now — `data-layer`, written
   on the element that positions itself — so an out-of-flow child
   declares its own status at the point it is created and no stylesheet
   has to be told about it afterwards. */
.panel > *:not([data-layer]),.head > *:not([data-layer]),
.strike > *:not([data-layer]),.seal > *:not([data-layer]){
  position:relative;z-index:1}

/* ══════════════════════════════════════════════════════════════════
   TYPOGRAPHY — a graduated scale, not two sizes.

   The critique was that a 230px number sat beside 15px body with
   nothing between, so the page jumped and then went flat. Six steps
   now, and the small end is Oswald and Archivo Narrow rather than
   Inter, which read as product UI at every size it appeared.
   ══════════════════════════════════════════════════════════════════ */
.kicker,.chip,.entry__no,.entry__verdict,.tech__at,.tech__legend,
.who__role,.qrpanel__when,.strike__sub,.rail__vol{font-family:var(--f-mono)}
.h2,.rail__link span,.tabs button,.btn,.link,.section-link,
.board-link,.motion-btn,.hero__label{font-family:var(--f-label);font-weight:500}
body{font-family:var(--f-body);font-size:var(--t-body);line-height:1.45}
.title{letter-spacing:-.035em}
.h2{font-size:clamp(11px,1.05vw,14px);letter-spacing:.22em}

/* ══════════════════════════════════════════════════════════════════
   CHAPTER SPINE — the sidebar is gone.

   Icon + label + active pill is the SaaS sidebar from every product
   built since 2015, and it anchored the whole page as "web app". What
   replaces it is a spine: large rotated numerals down the page edge,
   the chapter title set small beside them. No icons anywhere.
   ══════════════════════════════════════════════════════════════════ */
.rail{padding:var(--s5) 0 var(--s5) var(--s3);border-right:0;overflow:hidden}
.rail::after{content:"";position:absolute;top:0;bottom:0;right:0;width:2px;
  background:var(--v5)}
.rail__brand{padding:0 var(--s3) var(--s5) 0;border-bottom:0}
.rail__nav{gap:0;padding-top:var(--s5)}
.rail__link{display:grid!important;grid-template-columns:auto 1fr;
  align-items:baseline;gap:var(--s3);padding:var(--s3) var(--s3) var(--s3) 0!important;
  background:none!important;text-align:left;position:relative}
.rail__link svg{display:none}
/* --ink-2, not --v3, and the !important is why identity.css could not
   correct this from outside: the rail numeral measured 1.98:1 against
   a 3:1 requirement at 26px. The hover and current states below are
   unchanged, so the three-way distinction still reads. */
