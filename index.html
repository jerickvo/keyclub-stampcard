<script>
/* ── js/01a-backend.js ── */
"use strict";
/* ══════════════════════════════════════════════════════════════════
   keystamp — BACKEND BOUNDARY

   Everything that used to be an array literal now sits behind this
   object. The rule the rest of the app follows:

       views  →  Store  →  Backend  →  Supabase

   No view, no effect, no scanner talks to Supabase directly. That is
   what makes Phase 3 (moving verification server-side) a change to
   one adapter rather than a change to the application.

   Two adapters implement the same interface:

     SupabaseAdapter   real data. Used whenever credentials are
                       configured. This is the production path.

     PreviewAdapter    an empty, in-memory stand-in so the interface
                       can be exercised with no backend attached. It
                       is NOT sample data and NOT a fake user — it
                       returns an unauthenticated session and empty
                       collections, so an unconfigured build shows the
                       signed-out state instead of quietly pretending
                       somebody is logged in. The old prototype did
                       the opposite, and that is precisely the failure
                       mode this phase exists to remove.
   ══════════════════════════════════════════════════════════════════ */

/* ── configuration ────────────────────────────────────────────────
   Credentials are read from the page, never hardcoded here. Set them
   on window before the scripts load, or via <meta>:

     <meta name="keystamp:supabase-url"      content="https://xxx.supabase.co">
     <meta name="keystamp:supabase-anon-key" content="ey...">

   The anon key is a public, row-level-security-gated key. It is safe
   in the page ONLY because every table is protected by RLS policies
   (see supabase/schema.sql). It is not an authorisation mechanism.
   ────────────────────────────────────────────────────────────────── */
const Config = {
  meta(name){
    const el = document.querySelector(`meta[name="keystamp:${name}"]`);
    const v = el && el.getAttribute('content');
    return v && !/^\{\{|^\s*$/.test(v) ? v.trim() : null;
  },
  /* A window value wins whenever it is a string — including an empty
     one — so a host page can explicitly declare "no backend" and not be
     silently overridden by whatever the meta tags happen to hold. Only
     an undefined window value falls through to the built-in meta. */
  get supabaseUrl(){
    return typeof window.KEYSTAMP_SUPABASE_URL === 'string'
      ? window.KEYSTAMP_SUPABASE_URL : this.meta('supabase-url');
  },
  get supabaseAnonKey(){
    return typeof window.KEYSTAMP_SUPABASE_ANON_KEY === 'string'
      ? window.KEYSTAMP_SUPABASE_ANON_KEY : this.meta('supabase-anon-key');
  },

  /* Placeholders copied straight out of the README are the most likely
     way to end up "configured" with values that cannot work. They are
     rejected explicitly so the setup notice says WHY rather than
     letting the app try, fail, and look broken. */
  PLACEHOLDERS: [
    'your_project', 'your-project', 'yourproject', 'xxx', 'example',
    'your_public_anon_key', 'your-anon-key', 'changeme', 'todo',
  ],
  looksPlaceholder(v){
    const t = String(v || '').trim().toLowerCase();
    if (!t) return false;
    if (this.PLACEHOLDERS.some(ph => t.includes(ph))) return true;
    /* "ey..." and similar elisions from documentation */
    if (/^ey\.{2,}$/.test(t) || /\.\.\.$/.test(t)) return true;
    return false;
  },

  /* Three distinct states, never collapsed into one boolean:
       ok           usable values are present
       missing      nothing has been filled in yet
       placeholder  something is there but it is documentation text
     `reason` is safe to display: it names WHICH field is wrong and
     never echoes the key itself. */
  status(){
    const url = this.supabaseUrl, key = this.supabaseAnonKey;
    if (!url && !key) return { state:'missing', reason:'No Supabase URL or anon key has been set.' };
    if (!url) return { state:'missing', reason:'The Supabase project URL is missing.' };
    if (!key) return { state:'missing', reason:'The Supabase anon key is missing.' };
    if (this.looksPlaceholder(url))
      return { state:'placeholder', reason:'The Supabase URL is still the example value from the README.' };
    if (this.looksPlaceholder(key))
      return { state:'placeholder', reason:'The Supabase anon key is still the example value from the README.' };
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(String(url).trim()))
      return { state:'placeholder', reason:'The Supabase URL should look like https://yourproject.supabase.co' };
    if (String(key).trim().length < 40)
      return { state:'placeholder', reason:'The Supabase anon key looks too short to be a real key.' };
    return { state:'ok', reason:null };
  },

  get configured(){ return this.status().state === 'ok'; },

  /* Usernames are the only credential the member ever sees or types.
     Supabase Auth is email-based underneath, so a username is mapped
     to a routable-looking internal address that is never shown in the
     UI and never collected from the user. */
  /* Username rules. Mirrored by a CHECK constraint and a unique index
     on lower(username) in schema.sql — the database is the authority,
     these run first only so the member gets a friendly message. */
  USERNAME_MIN: 3,
  USERNAME_MAX: 24,
  USERNAME_RE: /^[a-zA-Z0-9_.]+$/,
  /* names that would let an account impersonate the system */
  USERNAME_BLOCKED: ['admin','administrator','board','keystamp','root','system','staff','moderator','mod','owner','support','null','undefined'],
  PASSWORD_MIN: 8,

  /* One canonical form for comparison so Jvo / jvo / JVO cannot become
     three identities. The typed casing is kept separately for display. */
  canonUsername(u){ return String(u || '').trim().toLowerCase(); },

  AUTH_DOMAIN: 'keystamp.invalid',
  emailForUsername(username){
    return `${this.canonUsername(username)}@${this.AUTH_DOMAIN}`;
  },

  /* returns null when fine, otherwise a sentence a student can act on */
  validateUsername(raw){
    const u = String(raw || '').trim();
    if (!u) return 'Username is required.';
    if (u.length < this.USERNAME_MIN) return `Username must be at least ${this.USERNAME_MIN} characters.`;
    if (u.length > this.USERNAME_MAX) return `Username must be ${this.USERNAME_MAX} characters or fewer.`;
    if (!this.USERNAME_RE.test(u)) return 'Username can only use letters, numbers, underscore and full stop.';
    if (this.USERNAME_BLOCKED.includes(this.canonUsername(u))) return 'That username is reserved. Pick another.';
    return null;
  },
  validatePassword(pw){
    if (!pw) return 'Password is required.';
    if (String(pw).length < this.PASSWORD_MIN) return `Password must be at least ${this.PASSWORD_MIN} characters.`;
    return null;
  },
};

/* ── reward definitions ───────────────────────────────────────────
   Tiers are product rules, not user data, so they stay in the client.
   Whether a given member has CLAIMED one is user data and comes from
   the backend. */
const REWARD_TIERS = [
  { id:'r1', name:'Club Merch',    required:10, desc:'Get some official club merch.' },
  { id:'r2', name:'Free Blindbox', required:20, desc:'Get a blindbox on us.' },
  { id:'r3', name:'???',           required:30, desc:'A surprise. You will find out.' },
];

/* ══════════════════════════════════════════════════════════════════
   SUPABASE ADAPTER
   ══════════════════════════════════════════════════════════════════ */
const SupabaseAdapter = {
  name: 'supabase',
  client: null,

  /* poll for the deferred library, up to ~6s */
  awaitLibrary(timeoutMs = 6000){
    if (window.supabase && window.supabase.createClient) return Promise.resolve(true);
    return new Promise(resolve => {
      const started = Date.now();
      const tick = () => {
        if (window.supabase && window.supabase.createClient) return resolve(true);
        if (Date.now() - started > timeoutMs) return resolve(false);
        setTimeout(tick, 60);
      };
      tick();
    });
  },

  async init(){
    if (this.client) return this.client;
    /* supabase-js is loaded as a plain script when configured; if it is
       absent we fail loudly rather than silently falling back to fake
       data, because silently-fake data is the bug we are removing. */
    /* The client library is a deferred third-party script, so it may not
       have executed yet when boot reaches this point. Wait briefly for
       it rather than racing it — and if it never arrives, fail loudly.
       A missing client must surface as "backend unavailable", never as
       a silent downgrade to empty local data. */
    await SupabaseAdapter.awaitLibrary();
    if (!window.supabase || !window.supabase.createClient)
      throw new Error('supabase-js did not load');
    this.client = window.supabase.createClient(
      Config.supabaseUrl, Config.supabaseAnonKey,
      { auth:{ persistSession:true, autoRefreshToken:true } });
    return this.client;
  },

  /* ── auth: username + password only, no email surface ── */
  async currentSession(){
    const { data } = await this.client.auth.getSession();
    if (!data || !data.session) return null;
    return this.profileFor(data.session.user);
  },

  /* The database trigger (on_auth_user_created) is the ONE authority
     that creates a profile row. The frontend never inserts one — two
     writers would race and collide on the primary key. But the trigger
     commits as part of the auth transaction, and the very next request
     can arrive before that is visible, so a fresh signup could read
     back "no profile" and look like a broken account. Waiting is the
     correct fix, not a second insert. */
  async profileFor(authUser, { waitMs = 0 } = {}){
    const deadline = Date.now() + waitMs;
    for (;;){
      const { data, error } = await this.client
        .from('profiles').select('id, username, display_name, role')
        .eq('id', authUser.id).maybeSingle();
      if (error) throw error;
      if (data) return this.shapeProfile(data);
      if (Date.now() >= deadline) return null;
      await new Promise(r => setTimeout(r, 150));
    }
  },

  shapeProfile(data){
    /* role comes from the database and nowhere else. Nothing the browser
       can send changes it — see the freeze_identity_fields trigger. */
    return { id:data.id, username:data.username,
             name:data.display_name || data.username,
             role:data.role === 'board' ? 'board' : 'member',
             isBoard:data.role === 'board' };
  },

  async signIn(username, password){
    const { data, error } = await this.client.auth.signInWithPassword({
      email: Config.emailForUsername(username), password });
    /* One message for "no such username" and "wrong password" on purpose:
       distinguishing them tells an attacker which usernames exist. */
    if (error) throw new Error('That username and password do not match.');
    const profile = await this.profileFor(data.user, { waitMs:1500 });
    if (!profile) throw new Error('That account has no profile yet. Ask a board member.');
    return profile;
  },

  async signUp(username, password){
    const display = String(username).trim();
    const { data, error } = await this.client.auth.signUp({
      email: Config.emailForUsername(display),
      password,
      /* the trigger reads these to build the profile row; role is NOT
         accepted from here — the database always writes 'member' */
      options:{ data:{ username: Config.canonUsername(display), display_name: display } },
    });
    if (error){
      const m = String(error.message || '').toLowerCase();
      if (m.includes('already registered') || m.includes('already exists') || error.status === 422)
        throw new Error('Username is already taken.');
      if (m.includes('password')) throw new Error('Password is too weak. Use at least 8 characters.');
      throw new Error('Could not create that account. Try again in a moment.');
    }
    if (!data.session){
      /* email confirmation is on in the project settings; with synthetic
         addresses nobody can confirm, so this must be surfaced, not hidden */
      throw new Error('Account created but sign-in is not enabled. Ask a board member to turn off email confirmation.');
    }
    /* give the trigger up to 3s to land before declaring failure */
    const profile = await this.profileFor(data.user, { waitMs:3000 });
    if (!profile)
      throw new Error('Your account was created but its profile did not appear. Tell a board member before signing in again.');
    return profile;
  },

  async signOut(){ await this.client.auth.signOut(); },

  /* ── meetings: the board creates these; the client never invents them ── */
  async listMeetings(){
    const { data, error } = await this.client
      .from('meetings')
      .select('id, meeting_number, meeting_date, start_time, end_time, location, check_in_open')
      .order('meeting_number', { ascending:false });
    if (error) throw error;
    return (data || []).map(this.toMeeting);
  },

  async createMeeting(m){
    const { data, error } = await this.client.from('meetings').insert({
      meeting_number:m.no, meeting_date:m.date, start_time:m.startTime,
      end_time:m.endTime, location:'MPR' }).select().single();
    if (error) throw error;
    return this.toMeeting(data);
  },

  /* Deletes only an EMPTY meeting. The RLS policy hides any meeting with
     attendance from this statement, so a delete that matches nothing is
     not a failure to report as an error -- it means the meeting has
     stamps against it. That case gets its own answer. */
  async deleteMeeting(id){
    const { data, error } = await this.client.from('meetings')
      .delete().eq('id', id).select('id');
    if (error) throw error;
    if (!data || data.length === 0) return { ok:false, code:'HAS_ATTENDANCE' };
    return { ok:true };
  },

  /* one shape for the whole app, so views never see column names */
  toMeeting(row){
    const today = new Date().toISOString().slice(0, 10);
    return {
      id: row.id,
      no: row.meeting_number,
      date: row.meeting_date,
      time: row.start_time,
      endTime: row.end_time,
      place: row.location || 'MPR',
      open: Boolean(row.check_in_open),
      upcoming: row.meeting_date > today && !row.check_in_open,
    };
  },

  async listAttendance(userId){
    const { data, error } = await this.client
      .from('attendance').select('id, meeting_id, checked_in_at, verification_method')
      .eq('user_id', userId).order('checked_in_at', { ascending:false });
    if (error) throw error;
    return (data || []).map(r => ({ id:r.id, meetingId:r.meeting_id,
                                    at:r.checked_in_at, method:r.verification_method }));
  },

  /* recordAttendance() used to live here: a direct insert into the
     attendance table from the browser. Nothing called it — verifyCode()
     below has been the only stamp path since Phase 3 — and RLS refused
     it for members anyway, because there is no member insert policy.

     It is deleted rather than left dead because of what it was: a
     working, exported "grant myself a stamp" method sitting on
     window.Backend, one policy edit away from being the hole. There is
     now exactly one way a stamp can come into existence, and it is on
     the server. */

  async listRewardClaims(userId){
    const { data, error } = await this.client
      .from('reward_claims').select('reward_id, claimed_at').eq('user_id', userId);
    if (error) throw error;
    return (data || []).map(r => r.reward_id);
  },

  async claimReward(userId, rewardId){
    const { error } = await this.client.from('reward_claims')
      .insert({ user_id:userId, reward_id:rewardId });
    if (error && error.code !== '23505') throw error;
    return rewardId;
  },

  /* ── ATTENDANCE VERIFICATION ─────────────────────────────────────
     The server is the only authority. This call sends the raw scanned
     payload and returns whatever the Edge Function decides.

     There is deliberately NO local fallback. An earlier revision fell
     back to the client-side prototype verifier when the function was
     not deployed, which meant a misconfigured production build would
     quietly accept tokens the browser could mint itself. A configured
     build now FAILS CLOSED: if verification is unreachable, nobody
     gets a stamp. Refusing a real member is recoverable; awarding
     attendance to a forged code is not. */
  async verifyCode(rawCode){
    let res;
    try {
      res = await this.client.functions.invoke('verify-attendance', { body:{ code:rawCode } });
    } catch (err){
      return { ok:false, code:'NETWORK_ERROR' };
    }
    if (res.error){
      const status = (res.error.context && res.error.context.status) || res.error.status;
      if (status === 401) return { ok:false, code:'NOT_AUTHENTICATED' };
      if (status === 403) return { ok:false, code:'NOT_AUTHORIZED' };
      if (status === 404) return { ok:false, code:'VERIFIER_UNAVAILABLE' };
      /* the function returns its verdicts with a 200, so anything else
         here is a genuine fault, not a rejected code */
      return { ok:false, code:'SERVER_ERROR' };
    }
    return res.data || { ok:false, code:'SERVER_ERROR' };
  },

  /* ── board administration ─────────────────────────────────────────
     One privileged endpoint, one place. Views never issue these
     queries themselves, and the function re-reads the caller's role
     from the database, so a member calling the same method gets 403
     rather than data. */
  async board(action, params){
    const { data, error } = await this.client.functions
      .invoke('board-data', { body:{ action, ...(params || {}) } });
    if (error){
      const status = (error.context && error.context.status) || error.status;
      if (status === 401) throw new Error('NOT_AUTHENTICATED');
      if (status === 403) throw new Error('NOT_AUTHORIZED');
      throw new Error('SERVER_ERROR');
    }
    if (!data || !data.ok) throw new Error((data && data.code) || 'SERVER_ERROR');
    return data;
  },

  /* ── board: attendance sessions and rotating tokens ── */
  async startAttendance(meetingId){
    const { data, error } = await this.client.functions
      .invoke('attendance-session', { body:{ action:'start', meeting_id:meetingId } });
    if (error) throw new Error('Could not start attendance.');
    return data;
  },
  async endAttendance(meetingId){
    const { data, error } = await this.client.functions
      .invoke('attendance-session', { body:{ action:'end', meeting_id:meetingId } });
    if (error) throw new Error('Could not end attendance.');
    return data;
  },
  async issueToken(meetingId){
    const { data, error } = await this.client.functions
      .invoke('attendance-session', { body:{ action:'token', meeting_id:meetingId } });
    if (error) throw new Error('Could not get a code.');
    return data;                       /* { token, expires_at } — same every time */
  },
  async attendanceCount(meetingId){
    const { count, error } = await this.client
      .from('attendance').select('id', { count:'exact', head:true })
      .eq('meeting_id', meetingId);
    if (error) throw error;
    return count || 0;
  },
};

/* ══════════════════════════════════════════════════════════════════
   PREVIEW ADAPTER — no backend attached.

   Deliberately empty. It exists so the app boots, renders its
   signed-out state and exercises the interface without a database. It
   never invents a user, a meeting or a stamp.
   ══════════════════════════════════════════════════════════════════ */
const PreviewAdapter = {
  name: 'preview',
  async init(){ return this; },
  async currentSession(){ return null; },
  async signIn(){ throw new Error('No backend is configured, so sign-in is unavailable.'); },
  async signUp(){ throw new Error('No backend is configured, so accounts cannot be created.'); },
  async signOut(){},
  async listMeetings(){ return []; },
  async createMeeting(){ throw new Error('No backend is configured.'); },
  async deleteMeeting(){ throw new Error('No backend is configured.'); },
  async listAttendance(){ return []; },
  async listRewardClaims(){ return []; },
  async claimReward(){ throw new Error('No backend is configured.'); },
  async verifyCode(){ return { ok:false, code:'NO_BACKEND' }; },
  async startAttendance(){ throw new Error('No backend is configured.'); },
  async endAttendance(){ throw new Error('No backend is configured.'); },
  async issueToken(){ throw new Error('No backend is configured.'); },
  async attendanceCount(){ return 0; },
  async board(){ throw new Error('No backend is configured.'); },
};

/* ══════════════════════════════════════════════════════════════════
   UNAVAILABLE ADAPTER — configured, but the client could not start.

   This is NOT PreviewAdapter. A configured project whose connection
   fails must never look like a working app with an empty account: a
   member would see 00 stamps and conclude their attendance was lost.
   Every call here refuses with BACKEND_UNAVAILABLE so the UI can say
   "cannot reach the club records" rather than showing a blank record
   as though it were the truth.
   ══════════════════════════════════════════════════════════════════ */
const UnavailableAdapter = {
  name: 'unavailable',
  detail: null,
  async init(){ return this; },
  async currentSession(){ return null; },
};
['signIn','signUp','signOut','listMeetings','createMeeting','deleteMeeting','listAttendance',
 'listRewardClaims','claimReward','startAttendance',
 'endAttendance','issueToken','attendanceCount','board'].forEach(fn => {
  UnavailableAdapter[fn] = async () => { throw new Error('BACKEND_UNAVAILABLE'); };
});
UnavailableAdapter.verifyCode = async () => ({ ok:false, code:'BACKEND_UNAVAILABLE' });

const Backend = {
  adapter: null,
  failure: null,

  get mode(){ return this.adapter ? this.adapter.name : 'none'; },

  /* live === true means the real Supabase adapter is running. It is
     never true for preview or for a failed connection, so any code
     that gates on it is gating on a genuine backend. */
  get live(){ return this.mode === 'supabase'; },
  get configured(){ return Config.configured; },
  get status(){
    if (!this.adapter) return Config.status().state === 'ok' ? 'starting' : 'unconfigured';
    if (this.mode === 'supabase') return 'live';
    if (this.mode === 'unavailable') return 'unavailable';
    return Config.status().state === 'ok' ? 'unavailable' : 'unconfigured';
  },

  async init(){
    const cfg = Config.status();
    this.failure = null;
    /* until init resolves, nothing is live */
    this.adapter = null;

    if (cfg.state !== 'ok'){
      /* genuinely unconfigured: preview is correct here, and only here */
      this.adapter = PreviewAdapter;
      this.failure = cfg;
      await this.adapter.init();
      return this.adapter;
    }

    try {
      /* Assign only AFTER init succeeds. Assigning first made
         Backend.live report true for the whole time the library was
         still being awaited, so early callers saw a "live" backend
         whose client was null. */
      await SupabaseAdapter.init();
      this.adapter = SupabaseAdapter;
    } catch (err){
      /* Configured but the client would not start — almost always the
         supabase-js script failing to load. Deliberately does NOT fall
         back to PreviewAdapter. */
      console.error('[keystamp] Supabase client failed to start:', err.message);
      this.adapter = UnavailableAdapter;
      UnavailableAdapter.detail = err.message;
      this.failure = { state:'unavailable', reason:'Keystamp could not start the Supabase client.' };
      await this.adapter.init();
    }
    return this.adapter;
  },
};

/* forward the interface so callers use Backend.x, not Backend.adapter.x */
['currentSession','signIn','signUp','signOut','listMeetings','createMeeting','deleteMeeting','listAttendance',
 'listRewardClaims','claimReward','verifyCode',
 'startAttendance','endAttendance','issueToken','attendanceCount','board'].forEach(fn => {
  Backend[fn] = function(...a){ return this.adapter[fn](...a); };
});

</script>
<script>
/* ── js/01-core.js ── */
"use strict";
/* keystamp — assets, the seal, the meeting store, the schedule, QR rules
   Loaded in order by index.html. Order matters. */

/* ══════════════════════════════════════════════════════════════════
   1. THE SEAL — one original mark, drawn at four levels of detail.

   Everything in this app is the same symbol at a different scale: the
   empty stamp slot, the scanner core, the verdict sigil, the sealed
   reward, the boot frame, the structure in the background. That
   repetition is the whole identity system. It is built from a hexagon,
   a ticked ring and a key device (triangle, bar, point) — no existing
   anime symbol is referenced.
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   0. ASSETS — every replaceable image in one object.

   Drop your files into the folders below and the UI picks them up. If
   a file is missing the app falls back to the built-in SVG mark, so
   nothing breaks while you are still gathering artwork.

     assets/logo/keystamp-logo.png    the header + boot mark
     assets/logo/school-seal.png      shown on the member screen
     assets/headers/home-header.jpg   banner across the top of Home
     assets/backgrounds/paper.png     tiled texture behind everything
     assets/icons/favicon.png         browser tab icon (see <head>)

   Set a value to null to keep the built-in vector version.
   ══════════════════════════════════════════════════════════════════ */
const ASSETS = {
  logo:       null,   /* e.g. 'assets/logo/keystamp-logo.png'   */
  schoolSeal: null,   /* e.g. 'assets/logo/school-seal.png'     */
  homeHeader: null,   /* e.g. 'assets/headers/home-header.jpg'  */
  background: null,   /* e.g. 'assets/backgrounds/paper.png'    */
};

/* used by the schedule and the store, both of which run on load */
const pad = n => String(n).padStart(2, '0');

const HEX = '50,16 79.4,33 79.4,67 50,84 20.6,67 20.6,33';

/* the key device on its own — legible down to 14px */
const KEY = `<path d="M50 29 68.5 64.5h-37Z"/><path d="M38.5 56.5h23"/><circle cx="50" cy="45.5" r="3.6"/>`;

function ticks(n, r1, r2, hotEvery){
  let out = '';
  for (let i = 0; i < n; i++){
    const a = (i * 360 / n - 90) * Math.PI / 180;
    const long = i % 3 === 0 ? r2 + 2.4 : r2;
    out += `<line class="${hotEvery && i % hotEvery === 0 ? 'r' : ''}"
      x1="${(50 + Math.cos(a) * r1).toFixed(2)}" y1="${(50 + Math.sin(a) * r1).toFixed(2)}"
      x2="${(50 + Math.cos(a) * long).toFixed(2)}" y2="${(50 + Math.sin(a) * long).toFixed(2)}"/>`;
  }
  return out;
}

/* level 1 slot glyph · 2 medium · 3 full sigil · 4 the arena structure */
function seal(level = 3){
  if (level === 1) return KEY;
  if (level === 2) return `<polygon points="${HEX}"/><circle cx="50" cy="50" r="45"/>${KEY}`;
  if (level === 3) return `
    <circle cx="50" cy="50" r="47"/><circle cx="50" cy="50" r="41" stroke-dasharray="2 6"/>
    <polygon points="${HEX}"/><circle cx="50" cy="50" r="24" class="r"/>
    ${KEY}${ticks(24, 41, 46, 6)}
    <path d="M50 1v6M50 93v6M1 50h6M93 50h6"/>`;
  return `
    <circle cx="50" cy="50" r="49"/><circle cx="50" cy="50" r="44"/>
    <circle cx="50" cy="50" r="36" stroke-dasharray="10 6"/>
    <circle cx="50" cy="50" r="21" class="r"/>
    <polygon points="${HEX}"/><polygon points="50,10 90,50 50,90 10,50"/>
    <path d="M50 4a46 46 0 0 1 39.8 23"/><path d="M50 96a46 46 0 0 1-39.8-23"/>
    ${ticks(36, 44, 47.5, 9)}`;
}

/* Geometric marks, not app icons.

   The set these replace was the standard tray — a house, a bookmark, a
   star, a person, a rounded padlock — drawn with round caps and round
   joins. That vocabulary is an operating system's, and it read as one
   however the rest of the page was set: soft terminals on a page where
   nothing else is soft, and a metaphor (house = home) where everything
   else is a label.

   These are drawn the way the rest of the system is drawn: 1.5px,
   butt caps, mitre joins, right angles and 45s, no radius anywhere. A
   line that ends, ends. */
const SVG = (b) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">${b}</svg>`;

const ICON = {
  /* the five below are the rail's, and the rail hides them in favour of
     its chapter numerals — kept as the fallback the markup still asks
     for, redrawn so the fallback is not the odd one out */
  home:   SVG('<path d="M3.5 11 12 4l8.5 7"/><path d="M6 11v9h12v-9"/><path d="M10 20v-5h4v5"/>'),
  record: SVG('<path d="M5 3.5h14v17l-7-3.5-7 3.5z"/><path d="M9 9h6M9 12.5h4"/>'),
  scan:   SVG('<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M4 12h16"/>'),
  reward: SVG('<path d="M12 3 20 12l-8 9-8-9z"/><path d="M12 7.5 16 12l-4 4.5L8 12z"/>'),
  member: SVG('<path d="M8 4h8v7H8z"/><path d="M4.5 20.5v-3h15v3"/>'),

  /* a camera is a box with an aperture, drawn square */
  camera: SVG('<path d="M3 8h18v12H3z"/><path d="M8.5 8V5h7v3"/>'
            + '<path d="M12 10.5 15.5 14 12 17.5 8.5 14z"/>'),
  /* a lock is a bolt in a housing — a square shackle standing clear of
     the body, no bent wire and no radius */
  lock:   SVG('<path d="M4.5 11.5h15v9h-15z"/><path d="M8.5 11.5V5.5h7v6"/>'
            + '<path d="M12 14.5v3"/>'),
  /* the keypad is the dot grid the whole system is registered to.
     The dots are squares: with butt caps a zero-length segment paints
     nothing, which is how nine of them turned into nine smudges. */
  keypad: SVG('<path d="M3.5 8V4h4M16.5 4h4v4M20.5 16v4h-4M7.5 20h-4v-4"/>'
            + [8,12,16].flatMap(y => [7,11.5,16].map(x =>
                `<rect x="${x}" y="${y}" width="2" height="2" fill="currentColor" stroke="none"/>`
              )).join('')),
  /* AN UNSTRUCK SEAL. The empty state is not a question mark in a
     dashed circle — it is the stamp that has not landed yet: the
     silhouette present, the mark inside it missing. */
  blank:  SVG('<path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/>'
            + '<path d="M12 7.5 16.5 12 12 16.5 7.5 12z" stroke-dasharray="1.6 3.4"/>'),
  /* an engineering arrow: a rule that terminates in a solid head */
  arrow:  SVG('<path d="M3.5 12h11"/><path d="M14 7.5 20.5 12 14 16.5z" fill="currentColor"/>'),
  /* motion on: a square wave. motion off: a rule between two stops. */
  waves:  SVG('<path d="M2.5 16h4v-8h5v8h5v-8h5"/>'),
  still:  SVG('<path d="M4 12h16"/><path d="M4 8v8M20 8v8"/>'),
};

/* A bracketed monospace token — the fault codes on the scanner's dead
   ends. `[ERR.CAM]` says the same thing a padlock glyph says and says
   it in the page's own voice, which is words in brackets, not pictures. */
const codeMark = (s) => `<span class="codemark" aria-hidden="true">${s}</span>`;

/* If ASSETS.logo is set, your image is used; otherwise this vector mark
   is drawn. Both render at the same size, so swapping is safe. */
const logoMark = (cls = 'mark__seal') => ASSETS.logo
  ? `<img class="${cls}" src="${ASSETS.logo}" alt="" aria-hidden="true">`
  : LOGO.replace('class="mark__seal"', `class="${cls}"`);

const LOGO = `
<svg class="mark__seal" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <path d="M16 1.4 29.2 9v14L16 30.6 2.8 23V9Z" stroke="currentColor" stroke-width="1.2" opacity=".62"/>
  <path d="M16 4.6 26.4 10.5v11.8L16 28.2 5.6 22.3V10.5Z" stroke="currentColor" stroke-width=".7" opacity=".3"/>
  <path d="M12.2 10v12M12.2 16.4 19 10M12.2 15.6 19.4 22" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
</svg>`;

const wordmark = () => `<span class="mark">${logoMark()}<span class="mark__word">Key<b>stamp</b></span></span>`;

/* ══════════════════════════════════════════════════════════════════
   2. STORE — Key Club general meetings. Nothing invented beyond the
   sample data itself. Every read goes through a method, so swapping in
   Supabase touches this object and nothing else.
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   2a. SCHEDULE — every general meeting falls on a Wednesday, in the MPR.

   Dates are not typed in by hand anywhere. They are generated from one
   anchor Wednesday plus a fixed interval, and `wednesdayOf` snaps any
   date it is handed back to the Wednesday of that week. That means a
   future meeting cannot silently land on a Tuesday because someone
   mistyped a date or the interval changed.
   ══════════════════════════════════════════════════════════════════ */
/* Schedule keeps only its DATE MATHS. It is no longer a source of
   meetings — the board creates real meeting rows and the client reads
   them. What survives is the guarantee that any date the board tools
   propose lands on a Wednesday, which is a club rule, not sample data.
   `build()` and the ANCHOR/EVERY_DAYS generators are gone: the app no
   longer invents a season. */
const Schedule = {
  TIME: '3:15 PM',
  PLACE: 'MPR',              /* every meeting is held in the MPR */

  /* snap any date to the Wednesday of its own week */
  wednesdayOf(d){
    const out = new Date(d.getTime());
    out.setDate(out.getDate() + ((3 - out.getDay() + 7) % 7));   /* 3 = Wednesday */
    return out;
  },
  iso(d){
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  },
  /* the next Wednesday on or after today — used by the board tools */
  nextWednesday(from = new Date()){
    const d = new Date(from.getTime());
    d.setHours(12, 0, 0, 0);
    return this.iso(this.wednesdayOf(d));
  },
};

/* ══════════════════════════════════════════════════════════════════
   STORE — a read-through cache over Backend.

   The views render synchronously and there are a lot of them, so the
   read API is kept synchronous exactly as it was: every method below
   answers from `snap`, a snapshot hydrated from the backend. Writes
   are async because they are network calls, and they re-hydrate.

   What changed underneath:
     · `user` is null until a real session is loaded. There is no
       fallback identity — a signed-out build renders signed-out.
     · `meetings` and `scans` start EMPTY and are filled from the
       backend. Nothing is generated.
     · a stamp is created by the verify-attendance Edge Function. It
       writes through the backend and only then updates the snapshot.
   ══════════════════════════════════════════════════════════════════ */
const Store = {
  user: null,
  meetings: [],
  scans: [],
  rewards: REWARD_TIERS.map(r => ({ ...r, claimed:false })),
  ready: false,
  listeners: new Set(),

  onChange(fn){ this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(){ this.listeners.forEach(fn => { try { fn(); } catch (_) {} }); },

  /* Pull everything this member is allowed to see. Called at boot and
     after any write. Failure leaves the snapshot empty rather than
     stale-but-wrong. */
  /* `loadError` is the difference between "you have no stamps" and
     "we could not find out how many stamps you have". Those used to be
     the same screen: every fetch below was `.catch(() => [])`, so a
     database outage rendered as 00/10 with an empty record — a member
     would reasonably conclude their attendance had been deleted. The
     failure is now carried, and the views say so instead of lying. */
  loadError: null,

  async hydrate(){
    let session = null;
    try {
      session = await Backend.currentSession();
    } catch (_){
      /* could not even determine who is signed in: say nothing about
         their data rather than guess */
      this.loadError = 'SESSION';
      this.ready = true; this.emit();
      return this;
    }

    this.user = session;
    if (!session){
      this.meetings = []; this.scans = [];
      this.rewards = REWARD_TIERS.map(r => ({ ...r, claimed:false }));
      this.loadError = null; this.ready = true; this.emit();
      return this;
    }

    const [meetings, scans, claims] = await Promise.all([
      Backend.listMeetings().then(v => v, () => null),
      Backend.listAttendance(session.id).then(v => v, () => null),
      Backend.listRewardClaims(session.id).then(v => v, () => null),
    ]);

    /* attendance is the one that must never be faked: stamps, record and
       rewards are all derived from it, so a failure there poisons three
       screens at once */
    if (scans === null || meetings === null || claims === null){
      this.loadError = 'DATA';
      this.ready = true; this.emit();
      return this;
    }

    this.meetings = meetings;
    this.scans = scans;
    this.rewards = REWARD_TIERS.map(r => ({ ...r, claimed:claims.includes(r.id) }));
    this.loadError = null;
    this.ready = true;
    this.emit();
    return this;
  },

  /* true when the snapshot cannot be trusted — views check this before
     rendering any figure derived from attendance */
  get failed(){ return this.loadError !== null; },

  get signedIn(){ return Boolean(this.user); },
  get role(){ return this.user ? this.user.role : null; },
  get isBoard(){ return this.role === 'board'; },

  /* ── auth: the only path in and out of a session ──────────────────
     Views call these; nothing else touches Supabase auth. Each one
     re-hydrates so the snapshot and the session can never disagree. */
  /* A backend problem and a wrong password are different failures and
     must not collapse into one message: telling a member their details
     are wrong when the server is down sends them to reset a password
     that was never the problem. */
  authGuard(){
    const st = Backend.status;
    if (st === 'unconfigured')
      throw new Error('Keystamp is not connected to a Supabase project yet.');
    if (st === 'unavailable')
      throw new Error('Keystamp cannot reach the server right now. Try again in a moment.');
  },

  async signIn(username, password){
    this.authGuard();
    const bad = Config.validateUsername(username) || Config.validatePassword(password);
    if (bad) throw new Error(bad);
    await Backend.signIn(username, password);
    await this.hydrate();
    return this.user;
  },
  async signUp(username, password, confirm){
    this.authGuard();
    const bad = Config.validateUsername(username)
             || Config.validatePassword(password)
             || (password !== confirm ? 'Passwords do not match.' : null);
    if (bad) throw new Error(bad);
    await Backend.signUp(username, password);
    await this.hydrate();
    return this.user;
  },
  async signOut(){
    await Backend.signOut();
    /* clear locally too, so a failed network call cannot leave a
       signed-out user looking signed in */
    this.user = null; this.meetings = []; this.scans = [];
    this.rewards = REWARD_TIERS.map(r => ({ ...r, claimed:false }));
    await this.hydrate();
  },

  /* ── reads (unchanged signatures) ── */
  meeting(id){ return this.meetings.find(m => m.id === id) || null; },
  totalStamps(){ return this.scans.length; },
  attended(id){ return this.scans.some(s => s.meetingId === id); },
  scanFor(id){ return this.scans.find(s => s.meetingId === id) || null; },
  openMeeting(){ return this.meetings.find(m => m.open) || null; },
  nextMeeting(){ return [...this.meetings].reverse().find(m => m.upcoming) || null; },
  pastMeetings(){ return this.meetings.filter(m => !m.upcoming && !m.open); },
  heldMeetings(){ return this.meetings.filter(m => !m.upcoming); },
  rewardsUnlocked(){ const t = this.totalStamps(); return this.rewards.filter(r => t >= r.required).length; },
  attendanceRate(){
    const past = this.pastMeetings();
    if (!past.length) return 0;
    return Math.round(past.filter(m => this.attended(m.id)).length / past.length * 100);
  },
  state(m){
    if (m.upcoming) return 'upcoming';
    if (this.attended(m.id)) return 'set';
    return m.open ? 'open' : 'miss';
  },

  /* ── writes: real, and therefore async ──
     There is no recordScan() here any more. A stamp is created by the
     verify-attendance Edge Function and by nothing else; the client's
     part is to scan, submit, and re-read what the server decided. */
  async claimReward(id){
    if (!this.user) throw new Error('Not signed in.');
    await Backend.claimReward(this.user.id, id);
    await this.hydrate();
    return this.rewards.find(x => x.id === id) || null;
  },
};

/* ══════════════════════════════════════════════════════════════════
   QR ATTENDANCE — where verification lives now

   Nothing in this file can grant a stamp any more. The prototype
   verifier that used to sit here (an FNV hash over a secret compiled
   into this very file) has been deleted, not disabled: any secret the
   browser holds is a secret the member holds, so it could never be
   more than a demo.

   Production flow:

     board   → attendance-session Edge Function → signed token → QR
     member  → verify-attendance  Edge Function → attendance row

   The signing secret lives only in Edge Function environment
   variables. The browser sends the scanned string and is told yes or
   no; it cannot compute the answer itself. See
   supabase/functions/ for both functions.
   ══════════════════════════════════════════════════════════════════ */

/* Parsing is not security, so it stays on the client: it lets the
   scanner reject an unrelated QR code instantly instead of asking the
   server about a bus timetable. A payload that parses still proves
   nothing — only the server decides. */
const QRFormat = {
  SCHEME: 'keystamp://a/',
  looksLikeKeystamp(raw){
    const t = String(raw || '').trim();
    if (t.toLowerCase().startsWith(this.SCHEME)) return true;
    /* another app's deep link */
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) return false;
    /* a manually typed code: opaque, server-checked */
    return /^[A-Za-z0-9_.\-]{12,}$/.test(t);
  },
};

/* Product rules — reward tiers and progress maths. No secrets, no
   crypto, safe on the client because none of it grants anything. */
const Rules = {
  TIERS: REWARD_TIERS.map(r => r.required),

  progress(){
    const total = Store.totalStamps();
    const next  = this.TIERS.find(t => total <= t) ?? null;
    const floor = next ? (this.TIERS.filter(t => t < next).pop() || 0) : this.TIERS[this.TIERS.length - 1];
    const span  = next ? next - floor : 10;
    return { total, next, floor, span, filled: next ? total - floor : span,
             remaining: next ? next - total : 0 };
  },
};

</script>
<script>
/* ── js/02-motion.js ── */
"use strict";
/* keystamp — Motion base layer, utilities, ambient background
   Loaded in order by index.html. Order matters. */

/* ══════════════════════════════════════════════════════════════════
   4. MOTION — the base layer every triggered animation goes through.
   Division of labour: anime.js owns everything discrete and triggered.
   CSS keyframes own only the endless ambient loops (the turning
   structure, the scan line, the waiting slot), because an anime
   instance looping forever burns a phone battery for no gain.
   ══════════════════════════════════════════════════════════════════ */
const systemReducedMotion = () => {
  try { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (_) { return false; }
};

const Motion = {
  forced: false,
  E: cubicBezier(.22,.61,.36,1),
  get off(){ return this.forced || !window.animate || systemReducedMotion(); },

  exit(scope){
    if (this.off) return Promise.resolve();
    /* anime.js v4's animate() return value is itself thenable — it
       resolves when the animation completes. There is no `.finished`
       property on it (that was a v3/WAAPI habit); reading it just
       gives `undefined`, and `await undefined` resolves on the next
       microtask instead of waiting ~130ms for the real exit to play
       out. That let the caller reset the view's inline style while
       this animation was still running, and the animation then kept
       writing opacity/transform over the reset for its full duration
       — landing the freshly-rendered next page at opacity:0. */
    return animate(scope, { opacity:[1,0], translateX:[0,-14], skewX:[0,-2.5],
                   duration:130, ease:'inQuad' });
  },

  /* THE STRIKE. This was a Material ripple — a circle expanding from
     the pointer over 560ms on an outQuad. That gesture belongs to a
     different design language entirely: it is soft, it is round, and
     it is the single most recognisable "generic app" motion there is.

     A control in this system is struck, not rippled. The whole face
     inverts for two frames and cuts back. No travel, no curve, no
     radius, nothing to follow with the eye — you register that it
     happened rather than watching it happen. */
  ripple(btn){
    if (this.off) return;
    const s = document.createElement('span');
    s.className = 'btn__strike';
    btn.appendChild(s);
    animate(s, { opacity:[1, 1, 0], duration:110,
            ease: (typeof steps === 'function' ? steps(2) : undefined),
            onComplete:() => s.remove() });
  },

  /* energy accumulating: overshoots, then settles. scaleX not width —
     animating width relayouts the page every frame. */
  meter(el, pct, delay = 220){
    if (!el) return;
    const to = pct / 100;
    if (this.off){ el.style.transform = `scaleX(${to})`; return; }
    animate(el, { scaleX:[0, Math.min(1, to + .03), to],
            duration:1050, delay, ease:cubicBezier(.16,.84,.36,1) });
  },

  countUp(el, to, delay = 140){
    if (!el) return;
    if (this.off){ el.textContent = pad(to); return; }
    const o = { v:0 };
    animate(o, { v:to, modifier:around(0), duration:760, delay,
            ease:'outExpo', onUpdate:() => { el.textContent = pad(o.v); } });
  },

  indicator(ind, target, axis){
    if (!ind || !target || !ind.parentElement) return;
    const p = ind.parentElement.getBoundingClientRect();
    const t = target.getBoundingClientRect();
    if (!t.width) return;                       /* the other nav is display:none */
    const to = axis === 'x'
      ? { translateX: t.left - p.left + t.width * .26, width: t.width * .48, opacity:1 }
      : { translateY: t.top - p.top + (t.height - 18) / 2, opacity:1 };
    if (this.off){
      ind.style.opacity = 1;
      ind.style.transform = axis === 'x'
        ? `translateX(${to.translateX}px)` : `translateY(${to.translateY}px)`;
      if (axis === 'x') ind.style.width = to.width + 'px';
      return;
    }
    animate(ind, { ...to, duration:300, ease:cubicBezier(.03,.88,.12,1) });
  },
};

/* ══════════════════════════════════════════════════════════════════
   4b. REVEAL — panels below the fold wait until you reach them.

   IntersectionObserver only decides *when*; anime.js still does the
   move, so a panel revealed by scrolling and a panel revealed by the
   page entrance are the same animation and land the same way.

   The timeout is not decoration. Anything parked here is sitting at
   opacity 0, and an element that never intersects — inside something
   that turns out not to scroll, or on a screen shorter than the
   observer expected — would stay invisible forever. Six seconds and
   it shows itself regardless.
   ══════════════════════════════════════════════════════════════════ */
/* The entrance used to offset a panel 12px right with a 1.4deg skew and
   slide it home, and the X component had to be zeroed below the tab-bar
   breakpoint because it parked every unrevealed panel past the right
   edge of a 390px screen. Nothing travels now — a panel cuts into place
   and its type is driven down after it — so the offset that needed
   guarding no longer exists to guard. */

/* anime.js leaves its final values inline. A residual
   `transform:translate(0px,0px)` outranks every stylesheet :hover
   transform, so hover states were permanently dead on anything that had
   been revealed. Handing the property back to CSS on completion fixes
   that and leaves no stale offset behind if a later reflow moves things. */
const releaseTransform = els => {
  (Array.isArray(els) ? els : [els]).forEach(el => {
    if (el && el.style) el.style.transform = '';
  });
};

const Reveal = {
  io: null,

  /* Below the fold and above it are the same event, so they are the
     same motion: the panel cuts in, then its heavy type is driven down
     after it. This used to drift and skew on an eased curve while the
     top of the page cut — two different entrances for one page. */
  enter(el){
    clearTimeout(el._revealFuse);
    if (el.dataset.revealed) return;
    el.dataset.revealed = '1';
    animate(el, { opacity:[0, 1], duration:MECH.CUT, ease:STEP(1) });
    FX.slamType(el, MECH.BEAT);
  },

  watch(el){
    if (Motion.off || !('IntersectionObserver' in window)){
      el.style.opacity = '';
      return;
    }
    if (!this.io){
      this.io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          this.io.unobserve(en.target);
          this.enter(en.target);
        });
      }, { rootMargin:'0px 0px -6% 0px', threshold:.04 });
    }
    this.io.observe(el);
    el._revealFuse = setTimeout(() => {
      this.io?.unobserve(el);
      this.enter(el);
    }, 6000);
  },

  /* the old view's nodes are gone; drop the observer with them */
  clear(){ this.io?.disconnect(); this.io = null; },
};

/* ══════════════════════════════════════════════════════════════════
   5. UTILITIES
   ══════════════════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const fmtDate = iso => new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''))
  .toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
const fmtDay = iso => new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''))
  .toLocaleDateString('en-US', { month:'short', day:'numeric' });
const fmtTime = iso => new Date(iso)
  .toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });

/* NOTIFICATIONS — a keyed, capped register, not an append-only list.

   This used to create an element per call and remove it 4.2s later, with
   no cap, no identity and no replacement. Toggling reduced motion eight
   times therefore mounted eight live toasts; at 390x844 that is 736px of
   an 844px screen, painted over the tab bar. The listeners were never the
   problem (they are delegated on document and bound once) — the queue was.

   Three rules now:
     key      a caller that speaks about one thing passes a key, and its
              new message REPLACES its old one in place instead of queuing
     LIMIT    at most 3 live at once; the oldest is evicted first
     cleanup  every element owns its timer, and the timer is cleared
              whenever that element is replaced or evicted, so no timer
              outlives the node it refers to */
const TOAST_LIMIT = 3;
const TOAST_LIFE = 2600;
const liveToasts = new Map();   // key -> {el, timer}

function dropToast(key, immediate){
  const rec = liveToasts.get(key);
  if (!rec) return;
  clearTimeout(rec.timer);
  liveToasts.delete(key);
  const el = rec.el;
  if (immediate || Motion.off) return el.remove();
  animate(el, { opacity:0, translateY:8, duration:200, ease:'inQuad',
                onComplete:() => el.remove() });
}

function toast({ title, detail, bad = false, key }){
  const host = $('#toasts');
  if (!host) return;
  /* Un-keyed callers get a unique key so they still queue normally; keyed
     callers (a toggle, a scan verdict) collapse onto their own slot. */
  const k = key || `once:${Date.now()}:${Math.random()}`;

  const prev = liveToasts.get(k);
  let el;
  if (prev){
    /* same source speaking again — reuse the node so it does not move,
       and restart its life. No second element is ever mounted. */
    clearTimeout(prev.timer);
    el = prev.el;
  } else {
    while (liveToasts.size >= TOAST_LIMIT) dropToast(liveToasts.keys().next().value, true);
    el = document.createElement('div');
    host.appendChild(el);
    if (!Motion.off) animate(el, { opacity:[0,1], translateY:[14,0], duration:240, ease:'outQuad' });
  }

  el.className = 'toast' + (bad ? ' toast--bad' : '');
  el.innerHTML = `<span class="toast__dot"></span><div>
      <p class="toast__t">${esc(title)}</p>
      ${detail ? `<p class="toast__d">${esc(detail)}</p>` : ''}</div>`;

  const timer = setTimeout(() => dropToast(k), TOAST_LIFE);
  liveToasts.set(k, { el, timer });
}

/* ══════════════════════════════════════════════════════════════════
   6. AMBIENT — the environment the interface sits inside.

   Two layers. The arena is the slow geometric structure: the same seal
   at maximum detail, enormous, turning at two speeds. The energy
   canvas is the unstable part — dark smoke that drifts on three
   incommensurate sine terms so it never repeats, occasionally surging
   and briefly taking colour. It is not a pulsing glow: nothing here
   moves on a single period.
   ══════════════════════════════════════════════════════════════════ */
/* paints ASSETS.background behind the whole app, if one is supplied */
function applyBackdrop(){
  if (!ASSETS.background) return;
  const el = document.createElement('div');
  el.className = 'backdrop';
  el.style.backgroundImage = `url("${ASSETS.background}")`;
  $('.ground')?.prepend(el);
}

function buildArena(){
  const host = $('#arena');
  if (!host) return;
  host.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">
    <g class="arena__spin sp">${seal(4)}</g>
    <g class="arena__anti"><polygon points="50,22 78,50 50,78 22,50"/>
      <circle cx="50" cy="50" r="30" stroke-dasharray="3 9"/></g>
  </svg>`;
}

</script>
<script>
/* ── js/03-views.js ── */
"use strict";
/* The signed-in member's name, or a neutral stand-in when there is no
   session. Views used to read Store.user.name directly, which assumed
   a user always existed — true only because the prototype hardcoded
   one. With real auth the signed-out state is a normal state. */
const memberName = () => (Store.user && Store.user.name) || 'Member';
/* keystamp — components and the five screens
   Loaded in order by index.html. Order matters. */

/* ══════════════════════════════════════════════════════════════════
   7. COMPONENTS
   Every surface is a panel with a registration ghost behind it. There
   are no rounded cards anywhere in this file.
   ══════════════════════════════════════════════════════════════════ */
const C = {
  /* the giant cropped word behind a view */
  bleed(word, style, mod = ''){
    return `<span class="bleed ${mod}" style="${style}" aria-hidden="true">${word}</span>`;
  },

  head(kicker, title, jp, note){
    return `<header class="head" data-enter>
      <span class="head__rake" aria-hidden="true"></span>
      <div class="head__stack">
        <p class="kicker">${esc(kicker)}</p>
        <h1 class="title">${title}</h1>
        ${note ? `<p class="muted">${esc(note)}</p>` : ''}
      </div>
      <span class="jp" aria-hidden="true">${jp}</span>
    </header>`;
  },

  /* ── the stat plate: a character status readout, not a summary card ── */
  hero(){
    const p = Rules.progress();
    const open = Store.openMeeting();
    const live = open && !Store.attended(open.id);
    const next = Store.rewards.find(r => r.required === p.next);
    const line = !p.next ? 'Every reward unlocked'
      : p.remaining === 0 ? `${next.name} is ready to claim`
      : `${p.remaining} more until ${next.name.toLowerCase()}`;

    return `<section class="rig ${live ? '' : 'rig--br'}" data-enter aria-labelledby="heroLbl">
      <span class="rig__ghost" data-layer aria-hidden="true"></span>
      <div class="panel ${live ? 'panel--live' : ''} hero p-quiet ink-load">
        <span class="sfx sfx--a" data-layer aria-hidden="true">${live ? 'OPEN' : 'HOLD'}</span>
        <span class="panel__rule" data-layer aria-hidden="true"></span>
        <span class="tick tick--tl" data-layer aria-hidden="true"></span>
        <span class="tick tick--br" data-layer aria-hidden="true"></span>

        <div class="hero__top">
          ${live
            ? `<span class="emph emph--hot" id="heroLbl"><b>Check-in open</b></span>`
            : `<p class="kicker" id="heroLbl">Current record</p>`}
          <span class="hero__state ${p.remaining === 0 ? 'hero__state--ready' : ''}">${
            !p.next ? 'Complete' : p.remaining === 0 ? 'Reward ready' : 'Reward at ' + p.next}</span>
        </div>

        <div class="hero__core">
          <svg class="hero__ring" viewBox="0 0 100 100" aria-hidden="true">
            <g class="sp">${seal(3)}</g>
            <g class="sp-r"><polygon points="50,26 74,50 50,74 26,50"/></g>
          </svg>
          <span class="hero__num" id="heroNum">${pad(p.total)}</span>
          <span class="hero__of">/ ${p.next || 30}</span>
        </div>
        <p class="hero__label">Stamps acquired</p>

        <!-- The bar is gone. The stamp array immediately below IS the
             progress — ten slots, filling — so a horizontal fill bar
             restated it in the one visual form this system has no use
             for. What remains is the reading: how far to the next
             seal, set as an annotation rather than a caption. -->
        <div class="hero__foot">
          <span class="anno">${esc(line)}</span>
        </div>
      </div>
    </section>`;
  },

  /* ── ten struck marks. Empty slots sit at slight angles; a landed
     stamp snaps flat, which is what makes the grid feel struck by hand ── */
  sealGrid(){
    const p = Rules.progress();
    /* THE SLOT DOSSIER (§26).

       A landed stamp was a black square and nothing else: the record of
       WHICH meeting it came from lived only on another screen. Every
       filled slot now carries the docket for the check-in it represents,
       revealed on hover or focus.

       Sorted chronologically here rather than trusted from the backend,
       which returns newest first: slot N of the card is the Nth stamp
       ever earned, so the grid reads left-to-right as history. */
    const chrono = [...Store.scans]
      .sort((a, b) => String(a.at) < String(b.at) ? -1 : 1);

    const cells = Array.from({ length:p.span }, (_, i) => {
      const state = i < p.filled ? 'set' : i === p.filled ? 'next' : '';
      const last = state === 'set' && i === p.filled - 1 ? ' seal--last seal--hero' : '';
      const tilt = state === 'set' ? '' :
        `transform:rotate(${[-1.7, 1.2, .6, -1.1, 1.6][i % 5]}deg)`;

      const rec = state === 'set' ? chrono[p.floor + i] : null;
      const mtg = rec ? Store.meetings.find(m => m.id === rec.meetingId) : null;
      /* The dossier is only offered when there is something in it. A
         stamp whose meeting has since been deleted still counts — it
         just has no docket to show, so it does not become a tab stop
         that opens an empty card. */
      const dossier = rec && mtg ? C.sealMeta(rec, mtg) : '';

      return `<li class="seal ${state ? 'seal--' + state : ''}${last}" data-seal="${state || 'empty'}" style="${tilt}"${
        dossier ? ` tabindex="0" aria-label="Stamp ${pad(p.floor + i + 1)}: general meeting ${
          mtg.no}, ${fmtDate(mtg.date)}, checked in at ${fmtTime(rec.at)}"` : ''}>
        <svg viewBox="0 0 100 100" aria-hidden="true"><g class="seal__mark">${seal(state === 'set' ? 2 : 1)}</g></svg>
        <span class="seal__no">${pad(p.floor + i + 1)}</span>
        ${dossier}
      </li>`;
    }).join('');

    return `<section class="rig rig--bl ink-a" data-enter>
      <span class="rig__ghost rig__ghost--l" data-layer aria-hidden="true"></span>
      <div class="panel panel--flat">
        <ul class="seals" id="seals" aria-label="${p.filled} of ${p.span} stamps in this tier">${cells}</ul>
      </div>
    </section>`;
  },

  /* THE ACTION CHAMBER.

     The primary action is not a card — it is a marked-off area of the
     page with the target inside it. The four corner marks are the
     signature device of this system (a barrier, a viewfinder, a seal's
     registration marks) and they are what makes this read as somewhere
     to aim rather than as another panel. They are decorative spans,
     not borders, so they can move independently on hover: the chamber
     locks onto the target when you reach for it. */
  strike({ verb, sub, go, live = false, calm = false }){
    const corners = ['tl','tr','bl','br']
      .map(c => `<span class="chamber__c chamber__c--${c}" data-layer aria-hidden="true"></span>`).join('');
    /* The chamber was a hatched rectangle with a title in one corner
       and a small arrow in the other — 370px of texture with nothing
       in the middle of it, which is the emptiest element in the app on
       the screen where the user is standing in a room trying to check
       in. It is a target now: speed lines running toward a crosshair
       at the centre, the verb underneath, and the commit set as
       [ SCAN ] because that is the vocabulary the rest of the page
       already speaks. */
    return `<button class="strike ${live ? 'strike--live' : ''} ${calm ? 'strike--calm' : ''}"
      data-enter data-go="${go}">
      ${corners}
      <span class="strike__head" data-layer aria-hidden="true">
        <span class="anno">${live ? 'TARGET LIVE' : 'TARGET IDLE'}</span></span>
      <span class="strike__core" aria-hidden="true">
        <span class="xhair"></span>
      </span>
      <span class="strike__body"><span class="strike__verb">${esc(verb)}</span>
        <span class="strike__sub">${esc(sub)}</span></span>
      <span class="strike__go" aria-hidden="true">[ SCAN ]</span>
    </button>`;
  },

  /* ── one entry in the meeting log ── */
  entry(m, { link = true } = {}){
    const state = Store.state(m);
    const scan = Store.scanFor(m.id);
    const verdict = {
      set:      'Attendance confirmed',
      open:     '<span class="pip"></span>Check in now',
      miss:     'No record',
      upcoming: 'Scheduled',
    }[state];
    const meta = scan
      ? `Wed ${fmtDay(m.date)} · stamped ${fmtTime(scan.at)} · ${esc(m.place)}`
      : `Wed ${fmtDay(m.date)} · ${esc(m.time)} · ${esc(m.place)}`;
    const el = (state === 'open' && link) ? 'button' : 'div';
    const attr = el === 'button' ? ' data-go="scan"' : '';

    return `<div class="rec rec--${state}">
      <span class="rec__node" aria-hidden="true"></span>
      <${el} class="entry entry--${state}"${attr}>
      <span class="entry__ghost" aria-hidden="true">${pad(m.no)}</span>
      <span class="entry__no">GM ${pad(m.no)}</span>
      <span class="entry__verdict">${verdict}</span>
      <span class="entry__meta">${meta}</span>
      ${state === 'set' ? '<span class="entry__gain">+1 stamp</span>' : ''}
      </${el}>
    </div>`;
  },

  /* ── a reward: sealed until the count reaches it ── */
  /* ── THE DOSSIER ─────────────────────────────────────────────────
     Three identical cards with three identical progress bars, which
     is the single most generic arrangement an interface can arrive
     at — and it said nothing about the difference between a reward
     one stamp away and one twenty-one away.

     A dossier now, and its STATE is its design:

       sealed   quiet, unframed, the tier numeral in tone, the array
                barely struck — a document you have not earned
       ready    full ink frame, cinnabar mark, CLAIM across the
                measure — the one thing on the page to act on
       claimed  flooded ink — the concentrated black mass, and it
                means something: this one is taken

     The bar is gone. Progress is the same slot array the card on
     Home uses, so the two screens are reading the same instrument. */
  tech(r){
    const total = Store.totalStamps();
    const open = total >= r.required;
    const ready = open && !r.claimed;
    const state = r.claimed ? 'claimed' : open ? 'ready' : 'sealed';
    const done = Math.min(total, r.required);

    /* the array is capped so a 30-stamp tier does not draw 30 cells on
       a phone; past the cap it steps in fives and says so */
    const step = r.required > 12 ? Math.ceil(r.required / 12) : 1;
    const cells = Math.ceil(r.required / step);
    const litCells = Math.floor(done / step);
    const slots = Array.from({ length:cells }, (_, i) =>
      `<span class="dslot${i < litCells ? ' dslot--set' : ''}"></span>`).join('');

    return `<section class="rig dossier dossier--${state}" data-enter data-reward="${r.id}">
      <span class="rig__ghost" data-layer aria-hidden="true"></span>
      <div class="panel tech tech--${state}">
        <span class="dossier__idx idx${open ? ' idx--on' : ''}" aria-hidden="true">${pad(r.required)}</span>
        <div class="dossier__head">
          <h3 class="tech__name">${esc(r.name)}</h3>
          <span class="anno${ready ? ' anno--seal' : ''}">${
            r.claimed ? 'CLAIMED' : open ? 'READY' : 'SEALED'}</span>
        </div>
        <p class="dossier__at">Unlocks at ${r.required} stamps</p>

        <div class="dslots" style="--dcells:${cells}" role="img"
             aria-label="${done} of ${r.required} stamps">${slots}</div>
        <div class="dossier__legend">
          <span class="kicker">${done} / ${r.required} stamps</span>
          <span class="kicker">${open ? 'Unlocked' : (r.required - total) + ' to go'}</span>
        </div>

        ${ready
          ? `<button class="btn btn--hot btn--wide dossier__claim" data-claim="${r.id}">Claim reward</button>`
          : ''}

        ${ready ? `<svg class="tech__crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M-2 44 22 40 38 52 61 43 79 55 102 47"/>
            <path d="M30 -2 34 26 26 44 40 68 33 102"/>
            <path d="M70 -2 64 30 76 52 62 74 71 102"/></svg>` : ''}
      </div>
    </section>`;
  },

  /* Four figures at identical weight is four figures nobody reads
     first. A plate can now be ranked, and exactly one per page is. */
  stat(value, label, sub, rank){
    return `<div class="stat"${rank ? ` data-rank="${rank}"` : ''}>
      <b>${esc(value)}${sub ? `<i> / ${esc(sub)}</i>` : ''}</b><span>${esc(label)}</span></div>`;
  },

  /* Structured, monospaced, in the page's own technical voice: a
     docket, not a tooltip. aria-hidden because the slot already carries
     the same facts as a label — this is the sighted view of them. */
  sealMeta(rec, m){
    return `<span class="sealmeta" data-layer aria-hidden="true">
      <b class="sealmeta__no">GM ${pad(m.no)}</b>
      <span>${fmtDate(m.date)}</span>
      <span>${fmtTime(rec.at)} / ${esc((rec.method || 'qr').toUpperCase())}</span>
      <span>${esc(m.place)}</span>
    </span>`;
  },

  /* ── THE UNSTRUCK SEAL ───────────────────────────────────────────
     An empty state was a grey box with an icon and a centred
     paragraph in it, which is the placeholder every framework ships
     with. This one is drawn: the seal that has NOT been pressed, at
     real size, with the record it would carry stated as technical
     metadata beside it. Nothing is centred and nothing is boxed. */
  empty(icon, title, body, code = 'NIL'){
    return `<section class="rig empty-reg" data-enter>
      <div class="empty">
        <div class="empty__seal" aria-hidden="true">
          <svg viewBox="0 0 100 100">${seal(1)}</svg>
          <span class="empty__void"></span>
        </div>
        <div class="empty__body">
          <span class="anno">REC.${esc(code)} // NOT PRESSED</span>
          <h3 class="empty__title">${esc(title)}</h3>
          ${body ? `<p class="empty__note">${esc(body)}</p>` : ''}
        </div>
      </div>
    </section>`;
  },
};

/* ══════════════════════════════════════════════════════════════════
   8. VIEWS
   Five destinations. The dashboard leads with the count because that
   is the thing a member opens the app to see; everything else on it
   answers "what do I do next".
   ══════════════════════════════════════════════════════════════════ */
const Views = {
  /* Shown instead of any figure derived from attendance when the
     snapshot could not be loaded. Rendering 0 stamps here would tell a
     member their record is empty when the truth is that we do not
     know — the one failure mode most likely to make someone think
     their attendance was lost. */
  loadFailure(title, jp){
    return `<div class="view">
      ${C.head('Keystamp', title, jp)}

          <p class="kicker">Could not load</p>
          <p style="margin-top:8px">Keystamp could not reach the club records, so your
            attendance cannot be shown right now. Nothing has been lost.</p>
          <p class="muted" style="margin-top:8px;font-size:12.5px">Check your connection
            and try again.</p>
          <button class="btn btn--go" data-reload style="margin-top:var(--s4)">Try again</button>
        </div>
      </section>
    </div>`;
  },

  home(){
    if (Store.failed) return this.loadFailure('Home', '記録');
    const open = Store.openMeeting();
    const next = Store.nextMeeting();
    const done = open && Store.attended(open.id);
    const recent = Store.scans.length ? Store.meeting(Store.scans[0].meetingId) : null;

    if (open && !done)
      action = C.strike({ verb:'Scan code', sub:`GM ${pad(open.no)} · Wed ${fmtDay(open.date)} · MPR`, go:'scan', live:true });
    else if (open && done)
      action = C.strike({ verb:'Stamped', sub:`GM ${pad(open.no)} confirmed`, go:'record', calm:true });
    else if (next)
      action = C.strike({ verb:'Scan code', sub:`Opens at GM ${pad(next.no)} · ${fmtDate(next.date)}`,
                          go:'scan', calm:true });
    else
      action = C.strike({ verb:'Scan code', sub:'No general meeting is taking check-ins', go:'scan', calm:true });

    return `<div class="view">
      ${C.bleed('Keystamp', 'top:-14px;right:-6vw', 'bleed--fill')}
      ${ASSETS.homeHeader ? `<div class="banner" data-enter>
        <img src="${ASSETS.homeHeader}" alt="">
      </div>` : ''}
      <!-- THE NAMEPLATE. No frame. The name is bled off the left edge
           of the canvas and sits ON the register rule rather than
           inside a box, so it interrupts the sheet instead of being
           placed on it. The state line and the two metadata marks are
           set in the margin the name leaves. -->
      <header class="head head--bare nameplate" data-enter>
        <span class="nameplate__rule" data-layer aria-hidden="true"></span>
        <div class="head__stack">
          <h1 class="title title--name">${esc(memberName())}<em>.</em></h1>

            open && !done ? 'ACTIVE' : 'STANDBY'}</span>
          ${(() => { const p = Rules.progress(); const o = Store.openMeeting();
       const line = o && !Store.attended(o.id) ? 'The room is already filling up.'
         : p.remaining === 0 ? 'That was the last one.'
         : p.remaining === 1 ? 'One more. Just one.'
         : `${p.remaining} more before it means anything.`;
       return `<p class="nameplate__line">${line}</p>`; })()}
        </div>
        <span class="rune" data-layer aria-hidden="true">VOL.01 // CH.01</span>
        <span class="jp" aria-hidden="true">出席</span>
      </header>

      ${C.hero()}
      ${C.sealGrid()}
      ${action}

      <div class="duo">
      <section class="rig rig--tr" data-enter>
        <span class="rig__ghost" data-layer aria-hidden="true"></span>
        <div class="panel">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)">
            <h2 class="h2">${open ? 'Happening now' : 'Next meeting'}</h2>
            <button class="section-link" data-go="record">Full record</button>
          </div>
          <div class="log" style="margin-top:var(--s4)">
            ${open ? C.entry(open) : next ? C.entry(next)
              : `<p class="muted" style="font-size:13.5px">Nothing scheduled yet.</p>`}
          </div>
        </div>
      </section>

      ${recent ? `<section class="rig rig--bl" data-enter>
        <span class="rig__ghost rig__ghost--l" data-layer aria-hidden="true"></span>
        <div class="panel panel--flat">
          <h2 class="h2">Last stamped</h2>
          <div class="log" style="margin-top:var(--s4)">${C.entry(recent, { link:false })}</div>
        </div>
      </section>` : ''}
      </div>
    </div>`;
  },

  /* the attendance record: every general meeting, in order, with what happened */
  record(){
    if (Store.failed) return this.loadFailure('Record', '記録');
    const held = Store.heldMeetings();
    const upcoming = Store.meetings.filter(m => m.upcoming).reverse();

    return `<div class="view">
      ${C.bleed('Record', 'top:-10px;left:-8vw')}
      ${C.head('Attendance', 'Record', '記録')}

      ${held.length ? `<section data-enter class="stack-lg">
        <div class="log">${held.map(m => C.entry(m)).join('')}</div>
      </section>`
      : C.empty(ICON.blank, 'No general meetings yet',
                'Your record fills itself: every meeting you scan into is '
                + 'written here automatically. Nothing to do until the first one.')}

      ${upcoming.length ? `<section data-enter class="stack-xl">
        <h2 class="h2" style="color:var(--faint)">Scheduled</h2>
        <div class="log" style="margin-top:var(--s4)">${upcoming.map(m => C.entry(m)).join('')}</div>
      </section>` : ''}
    </div>`;
  },

  rewards(){
    if (Store.failed) return this.loadFailure('Rewards', '解放');
    return `<div class="view">
      ${C.bleed('Reward', 'top:-12px;right:-10vw', 'bleed--blood')}
      ${C.head('Milestones', 'Rewards', '解放')}
      <div class="stack-panels">
        ${Store.rewards.map(C.tech).join('')}
      </div>
    </div>`;
  },

  scan(){
    return `<div class="view">
      ${C.bleed('Seal', 'bottom:-4vw;left:-7vw')}
      ${C.head('Check in', 'Scan code', '読取')}

      <div class="viewer" id="viewer" data-enter>
        <video id="cam" playsinline muted autoplay></video>
        <div class="viewer__scrim" aria-hidden="true"></div>
        <div class="viewer__grain" aria-hidden="true"></div>
        <div class="reticle" id="reticle" aria-hidden="true">
          <svg class="reticle__geo" viewBox="0 0 100 100">
            <g class="sp"><circle cx="50" cy="50" r="48"/>
              <circle cx="50" cy="50" r="43" stroke-dasharray="2 7"/>${ticks(24, 43, 47, 6)}</g>
            <g class="sp-r"><circle cx="50" cy="50" r="34" stroke-dasharray="14 9"/>
              <polygon points="50,20 80,50 50,80 20,50"/></g>
          </svg>
          <svg class="reticle__mark" viewBox="0 0 100 100">${seal(1)}</svg>
          <span class="reticle__c reticle__c--tl"></span>
          <span class="reticle__c reticle__c--tr"></span>
          <span class="reticle__c reticle__c--bl"></span>
          <span class="reticle__c reticle__c--br"></span>
          <span class="reticle__line"></span>
        </div>
        <div class="viewer__status"><span class="viewer__msg" id="scanMsg">Starting camera</span></div>
      </div>

      <div class="manual" data-enter>
        <p class="kicker">Camera not working? Type the code under the seal</p>
        <div class="field">
          <input class="input" id="manualInput" placeholder="m09/XXXXXX"
                 aria-label="Seal code" autocomplete="off" spellcheck="false" enterkeyhint="go">
          <button class="btn btn--ghost" id="manualGo">Verify</button>
        </div>
        <div class="bubble" id="demoHint"></div>
      </div>
    </div>`;
  },

  /* ────────────────────────────────────────────────────────────────
     CLUB INFORMATION — not on the tab bar. Reachable at #/board.

     This is the other half of the QR system: the screen a board member
     puts on the projector in the MPR. It encodes exactly the string
     `Rules.codeFor()` produces, and it redraws itself every time the
     five-minute token rolls over, so the projected image is always the
     one the scanner will accept.
     ──────────────────────────────────────────────────────────────── */
  /* ── BOARD ────────────────────────────────────────────────────────
     One spread with four sections, switched by BoardUI.tab rather than
     by new routes, so the existing router, gate and page-cut animation
     all keep working unchanged. Every number below is rendered from
     data the board-data function returned; nothing is computed or
     stored locally. */
  /* Each board route is a chapter of the same spread. The internal chip
     row is gone: the nav rail already says where you are, and two levels
     of tabs for four screens was one level too many. */
  boardSpread(bleed, kicker, title, jp){
    return `<div class="view">
      ${C.bleed(bleed, 'top:-10px;right:-9vw')}
      ${C.head(kicker, title, jp)}
      <section class="rig" data-enter style="margin-top:var(--gut)">
        <span class="rig__ghost" data-layer aria-hidden="true"></span>
        <div id="boardPane">${BoardUI.pane()}</div>
      </section>

  },

  board(){     BoardUI.tab = 'club';     return this.boardSpread('Tools',  'Key Club', 'Club Tools', '部活'); },
  bmeet(){     BoardUI.tab = 'meetings'; return this.boardSpread('Meets',  'Key Club', 'Meetings',   '例会'); },
  bcheckin(){  BoardUI.tab = 'session';  return this.boardSpread('Code',   'Key Club', 'Check-In',   '受付'); },
  bmembers(){  BoardUI.tab = 'progress'; return this.boardSpread('Roster', 'Key Club', 'Members',    '会員'); },

  /* ── MEMBER — the credential page (§38) ───────────────────────────
     This was the one spread that did not belong to the system. It
     opened with the member's name at 20px inside a mostly empty panel
     while every other chapter opened with a display-size nameplate; its
     four figures were rendered at identical weight, so the page had no
     headline; and its Milestones list was a THIRD card design for
     content the Rewards chapter already owns.

     It is a chapter now. Same nameplate as Record, Rewards and Club
     Tools; one figure carrying the page and three supporting it; and
     the milestones reduced to a register — the Rewards chapter holds
     the full treatment, this one holds the ledger of it. */
  profile(){
    if (Store.failed) return this.loadFailure('Member', '会員');

    const attended = held.filter(m => Store.attended(m.id)).length;
    const p = Rules.progress();
    const total = Store.totalStamps();

    return `<div class="view">
      ${C.bleed('Member', 'top:-10px;right:-9vw', 'bleed--fill')}
      ${C.head(Store.isBoard ? 'Board' : 'Member', esc(memberName()), '会員')}

          ${ASSETS.schoolSeal

            : `<svg class="who__seal" viewBox="0 0 100 100" aria-hidden="true">${seal(4)}</svg>`}
          <div class="who__id">

          </div>
          <span class="rune" data-layer aria-hidden="true">CARD ${
