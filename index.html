.rail__no{font-family:var(--f-display)!important;font-size:clamp(26px,2.4vw,40px)!important;
  line-height:.8;color:var(--ink-2)!important;margin:0!important;min-width:0!important;
  letter-spacing:-.05em;transition:color var(--snap) linear}
.rail__link span:not(.rail__no){font-family:var(--f-label);font-size:11px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--v4);align-self:center}
.rail__link[aria-current="page"] .rail__no{color:var(--v6)!important}
.rail__link[aria-current="page"] span:not(.rail__no){color:var(--v6)}
.rail__link[aria-current="page"]::before{content:"";position:absolute;
  right:0;top:50%;width:26px;height:2px;background:var(--v6)}
/* Hover was --v4, which is exactly what --ink-2 resolves to — so once
   the resting numeral moved off tone, hovering a rail item changed
   nothing at all. It darkens to full ink now: resting quiet, hovered
   ink, current ink plus the rule mark on the right. */
.rail__link:hover .rail__no{color:var(--ink)!important}

/* ══════════════════════════════════════════════════════════════════
   THE STAMP CARD — a composition, not a contact sheet.

   Ten identical cells at identical spacing was the most generic thing
   on the page and also the largest. The most recent stamp now dominates
   at roughly three times the area and breaks the top edge of its panel;
   the rest fall in behind it at reduced weight, and the empty ones
   recede to tone instead of announcing themselves with dashed boxes.
   ══════════════════════════════════════════════════════════════════ */
.seals{grid-template-columns:repeat(6,1fr);grid-auto-flow:dense;
  gap:clamp(5px,.7vw,10px);padding:var(--s5) var(--s5) var(--s6)}
.seal{aspect-ratio:1}
.seal--hero{grid-column:span 2;grid-row:span 2;margin-top:calc(var(--s5) * -1.6);
  z-index:3}
.seal--hero svg{width:54%;height:54%}
.seal--hero .seal__no{font-size:12px;right:8px;bottom:6px}
.seal--next{grid-column:span 2;grid-row:span 2}
.seal[data-seal="empty"]{background-image:none;opacity:.5}
.seal[data-seal="empty"] .seal__mark{opacity:.3}
.seal__no{font-family:var(--f-mono)}

/* the panel has to let the hero stamp break its edge */
[data-screen="home"] .view > section:nth-of-type(2) .panel{overflow:visible}
[data-screen="home"] .view > section:nth-of-type(2){margin-top:var(--s6)}

/* ══════════════════════════════════════════════════════════════════
   RECORD — a sequence, not a table.

   Nine rows of equal weight with hairline dividers had no second or
   third thing to look at; the hierarchy died after the title. The rows
   are now panels of unequal size: the live meeting takes a full tier,
   confirmed ones sit small and quiet, and a missed meeting is given
   deliberate empty space rather than being compressed like the rest.
   ══════════════════════════════════════════════════════════════════ */
/* THE RECORD SPREAD.

   Narrow: one card per row of a column-count the log works out for
   itself from how much room it has. Wide: the composed spread, where
   rows are deliberately unequal — the live meeting takes a full tier,
   confirmed ones sit small and quiet, a missed one is given space
   rather than being compressed like the rest.

   These are two different compositions, not one composition at two
   sizes, which is why the wide one is stated inside its own tier
   instead of being approximated by shrinking. */
[data-screen="record"] .log{display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));
  gap:var(--gut) var(--gut)}
[data-screen="record"] .rec{grid-column:span 1;padding:var(--s4);
  border-top:0!important;align-items:flex-start}
[data-screen="record"] .rec + .rec{padding-top:var(--s4)}
[data-screen="record"] .rec--open,
[data-screen="record"] .rec--miss{grid-column:1/-1}
[data-screen="record"] .rec--open .entry__verdict{font-size:13px;padding:5px 11px}
[data-screen="record"] .rec--open .entry__ghost{font-size:clamp(90px,13vw,190px);
  opacity:.1;top:-8px;right:8px}
[data-screen="record"] .rec--miss .entry{opacity:.42}

@media(min-width:768px){
  [data-screen="record"] .log{grid-template-columns:repeat(4,minmax(0,1fr));
    grid-auto-flow:row dense}
  [data-screen="record"] .rec{grid-column:span 2}
  [data-screen="record"] .rec--open,
  [data-screen="record"] .rec--miss{grid-column:1/-1}
  [data-screen="record"] .rec--upcoming{grid-column:span 2}
}
@media(min-width:1024px){
  /* `dense` is what turns unequal spans into a composition instead of a
     row of gaps: a narrow card backfills the space a wide one left, so
     the tiers stay irregular AND the page stays packed. Without it the
     span-2 rows left a third of every other row as blank paper, which
     reads as a layout fault rather than as rhythm. */
  [data-screen="record"] .log{grid-template-columns:repeat(6,minmax(0,1fr));
    grid-auto-flow:row dense}
  [data-screen="record"] .rec{grid-column:span 3}
  [data-screen="record"] .rec--open,
  [data-screen="record"] .rec--miss{grid-column:1/-1}
  [data-screen="record"] .rec--open{min-height:clamp(150px,19vw,250px);
    align-items:flex-end}
  [data-screen="record"] .rec--miss{min-height:120px;align-items:center;opacity:1}
  [data-screen="record"] .rec--set:nth-of-type(4n+3){grid-column:span 2}
  [data-screen="record"] .rec--set:nth-of-type(4n){grid-column:span 4}
  [data-screen="record"] .rec--upcoming{grid-column:span 2}
}

/* ══════════════════════════════════════════════════════════════════
   SFX — opaque, large, cropped by the panel. Never a watermark.
   ══════════════════════════════════════════════════════════════════ */
.sfx{color:var(--v6);-webkit-text-stroke:0;opacity:1;
  font-size:clamp(72px,15vw,240px);letter-spacing:-.055em}
.sfx--a{right:-5%;bottom:-16%;left:auto;top:auto;transform:rotate(-7deg);
  opacity:.09}
.sfx--out{color:transparent;-webkit-text-stroke:clamp(2px,.35vw,4px) var(--v6);opacity:.5}

/* ══════════════════════════════════════════════════════════════════
   REWARDS — the glyph had escaped its box and was rendering ~1100px.
   ══════════════════════════════════════════════════════════════════ */
.tech__glyph{flex:none;width:clamp(44px,4.5vw,68px);height:clamp(44px,4.5vw,68px)}
.tech__glyph svg{width:100%!important;height:100%!important;display:block}
[data-screen="rewards"] .rig .panel{padding:var(--s5);overflow:hidden}
[data-screen="rewards"] .view > section:nth-of-type(1){grid-column:1/-1}
[data-screen="rewards"] .view > section:nth-of-type(2n){grid-column:span 4}
[data-screen="rewards"] .view > section:nth-of-type(2n+3){grid-column:span 2}

/* ══════════════════════════════════════════════════════════════════
   MOBILE — a vertical manga page, not a stacked desktop.

   The stack was four full-width rectangles of near-identical
   proportion, which is exactly the failure the desktop grid avoids.
   Aspect ratio now varies deliberately down the page: a squat
   establishing panel, a tall dominant one, a wide detail strip, then
   small closers. The icon tab bar is replaced by a page-turn strip.
   ══════════════════════════════════════════════════════════════════ */
.tabs{border-top:0;background:var(--v0);padding-top:0}
.tabs::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--v5)}
.tabs button{gap:2px}
.tab__no{font-family:var(--f-display);font-size:clamp(13px,3.6vw,16px);line-height:1;
  color:var(--v2);letter-spacing:-.04em}
/* The label, not the numeral, is what tells you where you are, so it
   keeps a real size — 9px at 320px, where five tabs share the bar —
   and the tracking is what gives instead. */
.tabs button span:not(.tab__no){font-family:var(--f-label);
  font-size:clamp(9px,2.4vw,10px);letter-spacing:clamp(.01em,.5vw - 1.5px,.14em)}
.tabs button[aria-current="page"]{background:transparent;color:var(--v6)}
.tabs button[aria-current="page"] .tab__no{color:var(--v6)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;
  bottom:0;left:22%;right:22%;height:3px;background:var(--v6)}

/* ── THE HELD-DEVICE COMPOSITION ──────────────────────────────────
   On a phone the person using this is standing in the MPR with one
   hand free and thirty seconds to check in. Scanning is not one of
   five things on the page — it is the page. So the chamber is pulled
   up directly under the nameplate and given real height, and the
   record drops below it.

   Done with `order` on the view grid, so the DOM stays in reading
   order for a screen reader and no view template changes. At the
   laptop tier the home items are placed by explicit grid-area, which
   ignores `order` outright — the desktop spread is untouched. */
[data-screen="home"] .view > .head{order:1;min-height:clamp(76px,17vw,104px)}
[data-screen="home"] .view > .strike{order:2}
[data-screen="home"] .view > section:nth-of-type(1){order:3}
[data-screen="home"] .view > section:nth-of-type(2){order:4}
[data-screen="home"] .view > .duo{order:5}

[data-screen="home"] .hero{min-height:0;padding-top:var(--s7)}
/* the chamber takes roughly half the fold: unmissable, and a target
   you can hit without looking */
[data-screen="home"] .view > .strike{min-height:clamp(230px,44dvh,400px)}
[data-screen="home"] .view > .strike .strike__verb{font-size:var(--t-title)}
@media(min-width:1024px){
  [data-screen="home"] .view > .strike{min-height:clamp(150px,17vw,240px)}
  [data-screen="home"] .view > .strike .strike__verb{font-size:var(--t-verb)}
}
[data-screen="home"] .view > .duo{margin-top:var(--s7)}   /* the quiet beat */
.seal--next{grid-column:span 1;grid-row:span 1}

[data-screen="rewards"] .view > section{grid-column:1/-1}

/* ── corrections after review ── */

/* the name had drifted to the right edge: space-between was pushing it
   off the vertical Japanese. It anchors left, where a title belongs. */
[data-screen="home"] .view > .head{justify-content:flex-start;
  align-items:flex-end;padding-left:var(--s6)}
/* The JP mark is position:absolute in the header's top-right, and nothing
   in the flow reserved room for it — so the chapter title's box (and, on
   Home, the narration balloon) ran underneath it. Titles are left-aligned
   so short ones looked fine, but "Attendance QR" and the narration box hit
   it, and the balloon is opaque with a border, so it sliced 出席 in half at
   six of seven viewports. Padding on the header reserves the lane for
   every page at once; the mark itself is positioned against the padding
   box, so it does not move with it. */
:root{--jp-lane:calc(var(--s4) + 22px)}
.view > .head{padding-right:calc(var(--s4) + var(--jp-lane))}
/* THE NARRATION IS A STANDFIRST, NOT A FLOATING BALLOON.

   It was absolutely positioned inside the nameplate, so it reserved no
   space and collided with the title's own descender at every width
   between 768 and 1366. In an editorial system the line above a
   headline is exactly that — a line above the headline. Putting it in
   normal flow makes the collision structurally impossible rather than
   avoided by a magic number, and it reads better: metadata, rule,
   name. */
[data-screen="home"] .view > .head{display:flex;flex-direction:column;
  align-items:flex-start;justify-content:flex-end;gap:var(--space-stack-sm)}
[data-screen="home"] .view > .head .narr--tl{position:static;
  order:-1;max-width:min(100%,52ch);
  border:0;border-left:var(--edge-heavy) solid var(--ink);
  padding:2px 0 2px var(--s3);background:none;
  font-family:var(--f-mono);font-size:clamp(10.5px,1vw,12px);
  letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}

[data-screen="home"] .view > .head .jp{position:absolute;right:var(--s4);
  top:var(--s4);bottom:auto}
.narr--tl{top:auto;bottom:0;left:0;border:var(--edge-thin) solid var(--v5);
  border-left:0;border-bottom:0;max-width:min(46%,330px)}

/* THE STAMP GRID.

   It was five fixed columns with a 2x2 hero cell, and `.seal{aspect-
   ratio:1}` — so on a 1440px monitor a stamp cell resolved to 210px
   square and the card grew to 750px of black squares, while at 320px
   the same rule squeezed ten marks into 47px chips. A stamp is a mark
   of a readable size; the number of columns is what should change.

   auto-fill against a fluid cell floor does that in one line: four
   columns on a small phone, five on a large one, six or more on a
   tablet and up — and `--seal-max` caps the cell so a wide monitor
   adds columns instead of inflating the marks. */
/* THE TIER, SIZED BY ITS MARKS.

   Two numbers describe this card: how many columns the tier reads as,
   and how large a single stamp is ever allowed to be. Everything else
   follows.

   The cells are `1fr`, so they always divide the space evenly — there
   is no way for one gutter to end up wider than another. What stops a
   1440px panel from resolving a stamp to 210px (which is what turned
   this card into 750px of black squares, the largest thing in the
   application) is a ceiling on the GRID, not on the cell: once ten
   marks at full size no longer need the whole panel, the grid stops
   growing and centres, and the panel keeps an even margin on both
   sides instead of a hole on one.

   Five columns reads as a stamp card; ten reads as the whole tier at a
   glance, which is worth the width once there is width to spend. */
.seals{--seal-cols:5; --seal-max:120px;
  grid-template-columns:repeat(var(--seal-cols),minmax(0,1fr));
  grid-auto-flow:row;
  max-width:calc(var(--seal-max) * var(--seal-cols)
                 + var(--space-tight) * (var(--seal-cols) - 1)
                 + var(--space-panel) * 2);
  margin-inline:auto}
@media(min-width:768px){
  .seals{--seal-cols:10; --seal-max:clamp(76px,7vw,112px)}
}
.seal--next{grid-column:span 1;grid-row:span 1}
/* The most recent stamp used to take a 2x2 footprint. Ten cells plus a
   2x2 block is thirteen units, which does not tile into any rectangle
   the grid can make — so every viewport rendered the card with two to
   six empty slots punched out of the middle of the run. The emphasis is
   real and stays; it is carried by weight and by the size of the mark
   inside the cell, which costs no layout at all. */
.seal--hero{grid-column:span 1;grid-row:span 1;margin-top:0}
.seal--hero svg{width:74%;height:74%}
[data-screen="home"] .seals{padding-top:var(--s7)}

/* SFX was still reading as a watermark at 9% */
.sfx--a{opacity:.16}

/* Record rows need real interior space now that they are panels */
[data-screen="record"] .rec{padding:var(--s4) var(--s4) var(--s5)}
[data-screen="record"] .rec--open{padding:var(--s5)}

[data-screen="home"] .view > .head{padding-left:var(--space-panel)}
@media(min-width:1024px){
  [data-screen="home"] .view > .head{padding-left:var(--space-panel-lg)}
  /* the right lane now carries two vertical marks, so it is wider */
  :root{--jp-lane:calc(var(--s4) + 42px)}
}


/* Stamp 07 is the 2x2 cell. It used to break the panel's top edge, which
   notched the row above; that was traded for a leftward break on the
   assumption that "nothing sits behind it". Cell 06 sits immediately to
   its left and empty cell 10 sits below that, so the pull merged 06 and
   07 into one unbroken black mass (11.2px at 1440, 8.1px at 1024) and
   buried 14.4px of cell 10 underneath it — the grid stopped reading as
   ten discrete marks, which is the whole mechanic. Its 2x2 footprint is
   already the emphasis; it does not also need to break the column. */
.seal--hero{margin-top:0;margin-left:0}
.seal--hero{border-width:var(--edge-heavy)}

/* ══════════════════════════════════════════════════════════════════
   SPACING SYSTEM

   Measured before writing this: tier gaps were 19px and 47px on the
   same desktop page, 12/46/12/46 on mobile, and panels carried three
   different padding values (20px, 20px 20px 16px, and 0) because some
   were set in CSS and some inline in the view templates. Every one of
   those was an arbitrary local decision.

   One scale now, named by relationship rather than size, so the value
   is chosen by what two things are to each other and not by eye.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --space-hair:4px;                          /* label → its own value   */
  --space-tight:8px;                         /* items in a row          */
  --space-stack-sm:clamp(10px,1vw,14px);     /* heading → its content   */
  --space-stack:clamp(14px,1.5vw,22px);      /* block → block in a panel*/
  --space-panel:clamp(16px,2.2vw,28px);      /* inside a panel          */
  --space-panel-lg:clamp(20px,3vw,40px);     /* inside a dominant panel */
  --space-tier:clamp(14px,1.7vw,26px);       /* panel → panel, one tier */
  --space-chapter:clamp(30px,4vw,68px);      /* tier → tier, a new beat */
}

/* tier rhythm: even gaps within a tier, a wider one between tiers */
.view{gap:var(--space-chapter) var(--space-tier)}
.duo{gap:var(--space-tier)}
.seals{gap:var(--space-tight)}

/* one padding value for every panel, plus a larger one where a panel is
   carrying the dominant moment */
.panel,.qrpanel,.manual,.narr-block{padding:var(--space-panel)}
[data-screen="home"] .hero,
[data-screen="home"] .view > .strike,
[data-screen="record"] .rec--open{padding:var(--space-panel-lg)}
.seals{padding:var(--space-panel)}
.head{padding:var(--space-panel) var(--space-panel-lg)}
.who{padding:var(--space-panel)}

/* typographic rhythm */
.h2 + *{margin-top:var(--space-stack-sm)}
.kicker + *{margin-top:var(--space-hair)}
.log{gap:var(--space-tight)}
.stack-lg{margin-top:var(--space-stack)}
.stack-xl{margin-top:var(--space-chapter)}
.picker{gap:var(--space-tight);margin-bottom:var(--space-tier)}
.field{gap:var(--space-tight)}
.stats{gap:var(--space-tier)}
.stat{padding:var(--space-panel)}

/* the board QR was rendering at the full panel width (~870px), which is
   far larger than any camera needs and pushed everything below the fold */
.qrpanel__code{max-width:min(420px,58vw);margin-inline:auto;
  padding:var(--space-stack)}
.qrpanel__code canvas,.qrpanel__code img,.qrpanel__code svg{
  width:100%;height:auto;display:block;image-rendering:pixelated}
.qrpanel__code{max-width:min(420px,100%)}
@media(min-width:768px){.qrpanel__code{max-width:min(420px,58vw)}}

/* nav → content, and content → the end of the page.

   The end of a page has to clear the bar that is fixed over it. That
   distance is not a guess any more: it is --tabs-h (which the bar
   itself uses for its height), plus its rule, plus the home indicator.
   When the rail replaces the bar, --tabs-h is 0 and the same
   expression collapses to the ordinary page end. */
main#view{padding-top:var(--space-tier);
  padding-bottom:calc(var(--space-chapter) + var(--tabs-h) + var(--rule)
                      + env(safe-area-inset-bottom, 0px))}

/* Text links were 11px tall — under any reasonable touch target. The
   hit area grows without the underline moving, so nothing shifts
   visually; only the tappable box changes. */
.link,.section-link,.board-link{display:inline-flex;align-items:center;
  min-height:32px;padding-block:6px}
@media(pointer:coarse){
  .link,.section-link,.board-link{min-height:44px;padding-block:11px}
  .motion-btn{min-height:40px}
}

/* ══════════════════════════════════════════════════════════════════
   SVG SIZING — the root cause of the blown-up graphics.

   Every inline icon is <svg viewBox="0 0 24 24"> with no width or
   height attribute. An SVG without intrinsic dimensions fills its
   container, so any icon dropped into a large box expands to fill it:
   the camera on Scan rendered ~500px tall, the reward glyph ~1100px.
   Both were "fixed" individually before, which was treating instances
   of a general fault. A default cap here, with explicit opt-outs for
   the few SVGs that are genuinely meant to be large.
   ══════════════════════════════════════════════════════════════════ */
/* :where() so this weighs NOTHING in the cascade.

   Written as a plain selector chain it scored (0,3,1) — higher than any
   single class — so it silently beat every explicit size in this file
   whenever the sizing class sat on the <svg> element itself rather than
   on a wrapper. The hero's seal ring (designed at 70-120px), the reward
   glyph (44-68px) and the sign-in chop's key all rendered at the 22px
   fallback, which is why those marks read as specks rather than as
   artwork. A default has to be the weakest rule in the room, not the
   strongest; :where() makes it so, and every explicit rule below now
   does what it says. */
:where(svg:not(.fxdefs):not([width])){width:22px;height:22px;flex:none}

.hero__ring,.who__seal,.verdict__seal,.boot__seal,.reticle__geo,.reticle__mark,
.arena svg,.seal svg,.tech__glyph svg,.viewer svg,.slash,.lines,
.verdict__field,.tech__crack svg,.qrpanel__code svg{width:100%;height:100%}
.hero__ring{width:clamp(70px,8vw,120px);height:clamp(70px,8vw,120px)}
.who__seal{width:clamp(52px,5vw,74px);height:clamp(52px,5vw,74px)}
.tech__glyph svg{width:100%;height:100%}
.strike__arrow svg,.btn svg,.motion-btn svg{width:16px;height:16px}
.rail__nav button svg,.tabs button svg{width:18px;height:18px}
.boot__mark svg{width:88px;height:88px}
.verdict__seal{width:min(30vmin,170px);height:min(30vmin,170px)}
.boot__seal{width:min(40vmin,230px);height:min(40vmin,230px)}

/* the "no camera" state was one enormous icon and two lines of text */
/* `.viewer .stack` is here because the scanner's fallback states render
   `<div class="stack">`, and nothing in the stylesheet ever matched that
   class — so the padding and max-width below were written but never
   applied. The copy ran the full width of the viewer and the drawn frame
   cut through it ("NO CAMERA FOUND" lost its N; the body text ran off the
   right edge). */
.viewer__msg,.viewer .stack{display:flex;flex-direction:column;align-items:center;
  gap:var(--space-stack-sm);text-align:center;padding:var(--space-panel-lg);
  max-width:46ch;margin-inline:auto}
.viewer__msg svg,.viewer .stack__icon svg{width:clamp(38px,4vw,56px)!important;
  height:clamp(38px,4vw,56px)!important;opacity:.5}
/* The camera frame is height-budgeted twice — once where it is defined
   and once here. Both use dvh so a collapsing mobile address bar cannot
   resize the viewfinder while someone is aiming it, and both leave the
   fixed bar's height out of the budget. */
.viewer{max-height:min(calc(72dvh - var(--tabs-h)),560px)}

/* ══════════════════════════════════════════════════════════════════
   CHAPTER HEADS — every screen but Home was rendering its title
   centred in a tall, almost empty panel. Same left anchor and same
   proportion as Home, so the pages read as one book.
   ══════════════════════════════════════════════════════════════════ */
.view > .head{justify-content:flex-start;align-items:flex-end;
  min-height:clamp(84px,9vw,132px);position:relative}
.view > .head .head__stack{max-width:100%}
.view > .head .jp{position:absolute;right:var(--space-panel);
  top:var(--space-panel);bottom:auto}
.view > .head .kicker{position:absolute;left:var(--space-panel-lg);
  top:var(--space-panel)}

/* ══════════════════════════════════════════════════════════════════
   REWARDS — three full-width bars with content stranded in one corner.
   They are panels now, proportioned and filled.
   ══════════════════════════════════════════════════════════════════ */
[data-screen="rewards"] .view > section{grid-column:span 2!important}
[data-screen="rewards"] .view > section:nth-of-type(1){grid-column:1/-1!important}
/* A reward card holds a title, a requirement and a meter. It used to
   also reserve `min-height:260px` for a description that the copy pass
   removed, so from the tablet up every card carried ~100px of empty
   paper between its title and its meter. Cards size to their content;
   the grid row stretches them to match their neighbour, which is what
   makes a row look level without any of them being padded out. */
/* The dossier lays itself out — a numeral column beside a content
   column — so this flex-column rule (0,3,0) was flattening it back to
   a stack and collapsing the slot array to zero width. The dossier
   owns its own layout now; what stays here is only the min-height
   reset, which is still wanted. */
[data-screen="rewards"] .rig .panel{min-height:0}

/* ══════════════════════════════════════════════════════════════════
   The reward panels are wrapped in .stack-panels, so every rule
   written against `.view > section` matched nothing at all — which is
   why they stayed full-width bars through three attempts. Targeting
   the actual wrapper.
   ══════════════════════════════════════════════════════════════════ */
.stack-panels{display:grid;grid-template-columns:1fr;
  gap:var(--space-tier);align-content:start}
.stack-panels > section{grid-column:1/-1;min-width:0}
.stack-panels > section > .panel{height:100%}
/* From the tablet up the reward tiers become a spread: the nearest
   reward leads across the full measure, the ones behind it sit beside
   each other.

   The spans were 4 / 3 / 2 against six columns. Nine units do not fit
   into rows of six, so the lead left two columns of blank paper beside
   it and the pair left one — three holes in a three-card page. Spans
   have to add up to the row, and these do at any card count. */
@media(min-width:768px){
  .stack-panels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stack-panels > section{grid-column:span 1}
  .stack-panels > section:first-child{grid-column:1/-1}
}

/* The kicker was absolutely positioned and landed on top of the title —
   text over text, which is what "text overlaps the borders" was. It
   stacks above the title in normal flow instead. */
.view > .head .kicker{position:static}
.view > .head{flex-direction:column;align-items:flex-start;
  justify-content:flex-end;gap:var(--space-hair)}
.view > .head .head__stack{width:100%}
.view > .head .jp{position:absolute}

/* the ink band and the panel background were drawn on different boxes,
   so the offset ghost showed as a doubled edge on the right and bottom.
   The ghost belongs behind the panel, not beside it. */
.stack-panels > section .rig__ghost{display:none}
[data-screen="rewards"] .rig .panel{background:var(--v1)}
.kicker{display:inline-block}

</style>
<style>
/* ══════════════════════════════════════════════════════════════════
   KEYSTAMP — ART DIRECTION LAYER
   loaded last: it composes the page, it does not re-plumb it.

   The brief: stop decorating a dashboard with manga elements and
   design the interface as a manga page. The difference in practice is
   that a dashboard is a grid of equal cards and a manga page is a
   composition of unequal panels — one panel dominates, the rest
   support it, and the gutters between them are as designed as the
   panels. Everything below serves that, and nothing below changes
   layout mechanics that the responsive pass established: no fixed
   widths, no desktop-only positioning, no new overflow.
   ══════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────────
   1. SCREENTONE AS MATERIAL

   Tone in manga is not a background texture, it is something you cut
   to a shape and lay into a panel. So these are defined as reusable
   *fills* with real dot geometry (60-line and 85-line equivalents,
   at the two densities a tone sheet actually comes in), and they get
   applied to shaped regions — wedges, bands, cropped corners — not
   to whole rectangles.
   ───────────────────────────────────────────────────────────────── */
:root{
  --tone-dot-a:radial-gradient(circle at 50% 50%, var(--ink) 0 1.05px, transparent 1.15px);
  --tone-dot-b:radial-gradient(circle at 50% 50%, var(--ink) 0 1.6px, transparent 1.7px);
  --tone-line:repeating-linear-gradient(72deg, var(--ink) 0 1px, transparent 1px 5px);
  --tone-cell-a:5px 5px;
  --tone-cell-b:7px 7px;
}

.tone{position:absolute;pointer-events:none;z-index:0;
  background-image:var(--tone-dot-a);background-size:var(--tone-cell-a)}
.tone--coarse{background-image:var(--tone-dot-b);background-size:var(--tone-cell-b)}
.tone--line{background-image:var(--tone-line)}

/* a tone that fades out, the way a sheet is scraped back with a blade
   rather than stopping on a hard line */
.tone--fade{-webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 42%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 0%, #000 42%, transparent 100%)}
.tone--fade-r{-webkit-mask-image:linear-gradient(to left, #000 0%, #000 30%, transparent 92%);
  mask-image:linear-gradient(to left, #000 0%, #000 30%, transparent 92%)}

/* ─────────────────────────────────────────────────────────────────
   2. PANEL HIERARCHY

   Three weights of edge, assigned by a panel's rank on the page, so
   that "which panel matters" is legible before a word is read. The
   ink SVG already varies line weight along each edge; this varies it
   BETWEEN panels, which is the part that carries hierarchy.
   ───────────────────────────────────────────────────────────────── */
[data-rank="lead"]{--ink-w:4.4}
[data-rank="mid"]{--ink-w:2.8}
[data-rank="quiet"]{--ink-w:1.6}

/* A clipped corner reads as a panel cut with a blade. Applied to a
   few panels only — a page where every panel is chamfered is just a
   different uniform. */
.cut-br{clip-path:polygon(0 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%)}
.cut-tl{clip-path:polygon(26px 0, 100% 0, 100% 100%, 0 100%, 0 26px)}

/* ─────────────────────────────────────────────────────────────────
   3. TYPOGRAPHY ROLES

   Four jobs, four treatments, so type carries structure instead of
   size alone: display (the number), utility (metadata), narrative
   (sentences), graphic (type used as artwork).
   ───────────────────────────────────────────────────────────────── */
.t-utility{font:500 10px/1 var(--f-mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--tone)}
.t-narrative{font-family:var(--f-body);font-size:13.5px;line-height:1.55;
  max-width:52ch}

/* Graphic type: a word used as a mark. Set solid, cropped by its
   panel, tonal rather than black so it sits behind the reading. */
.t-graphic{font-family:var(--f-display);line-height:.76;
  letter-spacing:-.055em;text-transform:uppercase;
  color:var(--v6);opacity:.085;white-space:nowrap;
  pointer-events:none;user-select:none}

/* ─────────────────────────────────────────────────────────────────
   4. THE STAMP PANEL — the page's hero

   The number is the subject of the whole product, so it is treated
   as artwork: oversized, sitting ON a wedge of tone, with the target
   stated once beside it and the travel toward that target shown as a
   ruled bar rather than a rounded meter. The number is allowed to
   overshoot its own tone block — a figure escaping its panel is the
   asymmetry the brief asks for, and it costs nothing in layout
   because the tone is absolutely positioned behind it.
   ───────────────────────────────────────────────────────────────── */
[data-screen="home"] .hero{position:relative;isolation:isolate}

/* The tone wedge the number stands on.
   ::after, NOT ::before — the home hero's ::before is already spoken
   for: the stylesheet paints the panel dark and lays a paper-coloured
   ::before inside it, which is what produces the diagonal-cut corner.
   Overriding it turned the whole panel black. */
/* The wedge is scraped back on BOTH edges. It used to fade only toward
   the top, so its right-hand edge stopped on a hard vertical line — a
   tone sheet with a ruled edge reads as an unfinished rectangle sitting
   behind the number rather than as tone laid into the panel. The
   composite mask fades up and to the right, which is what a blade
   actually leaves. */
[data-screen="home"] .hero::after{content:"";position:absolute;
  /* top/right MUST be reset. `.panel::after` sets `inset:0` for the
     panel's own screentone, and this rule reuses that pseudo-element —
     so without clearing them, `top:0` survives, and an absolutely
     positioned box with top, bottom AND height set simply ignores
     `bottom`. The wedge was therefore anchored to the TOP of the panel:
     a dotted rectangle laid across the number and straight through
     "STAMPS ACQUIRED", which is what made the caption read as struck
     out. It belongs low and left, under the figure. */
  top:auto;right:auto;
  left:0;bottom:0;width:min(62%,340px);height:58%;
  background-image:var(--tone-dot-a);background-size:var(--tone-cell-a);
  /* A short panel puts three lines of type inside the same 58% the tall
     one gives to the figure alone, so the tone has to sit further back
     where the column is narrow. It is material behind the number, not a
     field the caption has to be read through. */
  opacity:.3;z-index:0;
  /* The tone is a band behind the FIGURE, not a field under the whole
     lower half of the panel. Fading it out at the bottom as well as
     the top clears the caption and the travel bar entirely — nothing
     in this system is read through a texture — while leaving the
     number standing on it, which is the only job it ever had. */
  -webkit-mask-image:linear-gradient(to top, transparent 0%, #000 30%, #000 66%, transparent 100%),
              linear-gradient(to right, #000 0%, #000 62%, transparent 100%);
  mask-image:linear-gradient(to top, transparent 0%, #000 30%, #000 66%, transparent 100%),
             linear-gradient(to right, #000 0%, #000 62%, transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  clip-path:polygon(0 14%, 100% 0, 100% 100%, 0 100%)}

[data-screen="home"] .hero__core{position:relative;z-index:2;align-items:flex-end}
[data-screen="home"] .hero__num{position:relative;z-index:2}

/* "/ 10" stops being a faint denominator and becomes the target the
   composition moves toward */
[data-screen="home"] .hero__of{align-self:flex-end;
  font-family:var(--f-display);font-size:clamp(20px,2.6vw,34px);
  line-height:1;color:var(--v4);letter-spacing:-.02em;
  margin-bottom:.12em}

/* This was 10px of --tone (#B0A99C) set on the dotted tone wedge — a
   contrast ratio under 2:1, on top of a screentone that eats what is
   left. It reads as a struck-through smudge rather than a caption at
   every viewport, and it is the label for the one number the whole
   product is about. Ink-2 on the same ground clears 4.5:1, and the
   size joins the 11px floor the rest of the app keeps. */
[data-screen="home"] .hero__label{font:500 clamp(11px,2.9vw,12.5px)/1.3 var(--f-mono);
  letter-spacing:.2em;color:var(--ink-2)}
/* the target beside the count is one figure and never wraps */
[data-screen="home"] .hero__of{white-space:nowrap}

/* the travel bar: ruled, not rounded, with the remaining distance
   drawn as tone rather than empty grey */
[data-screen="home"] .gauge{height:12px;border:0;position:relative;z-index:2;
  background-image:var(--tone-dot-a);background-size:var(--tone-cell-a);
  box-shadow:inset 0 0 0 1.5px var(--ink)}
[data-screen="home"] .gauge__fill{background:var(--ink)}

/* ─────────────────────────────────────────────────────────────────
   5. THE SCAN PANEL — the action panel

   Given the treatment an action beat gets: the solid black frame,
   the word set large and tight, speed lines raking across it, and a
   single directional mark. It is the only black-filled panel on the
   page, which is what makes it read as the thing to do.
   ───────────────────────────────────────────────────────────────── */
.strike{position:relative;overflow:hidden}
.strike__title,.strike .strike__label{letter-spacing:-.035em}

/* speed lines: convergent rake, cropped by the panel */
.strike::after{content:"";position:absolute;inset:-20% -10%;
  background-image:repeating-linear-gradient(74deg,
    var(--paper) 0 1.4px, transparent 1.4px 9px);
  opacity:.14;transform:rotate(-4deg);pointer-events:none;z-index:1}
/* the base stylesheet pins strike children to z-index:1 with a
   two-class selector, so the speed lines (also 1, painted later) were
   covering the word. Same specificity, later in the cascade, so the
   content wins — and the rake stays behind it. */
.strike > *:not([data-layer]){position:relative;z-index:2}

/* ─────────────────────────────────────────────────────────────────
   6. GUTTERS AND RHYTHM

   A manga page's gutters are unequal on purpose: a wide gutter is a
   beat of silence, a tight one means two panels belong together. The
   responsive pass established the spacing scale; this only varies it
   between specific joins so the page reads as phrased rather than
   evenly spaced.
   ───────────────────────────────────────────────────────────────── */
[data-screen="home"] .view > .strike{margin-top:calc(var(--space-tier) * .45)}
[data-screen="home"] .view > .duo{margin-top:var(--space-chapter)}

/* ─────────────────────────────────────────────────────────────────
   7. MOBILE — a narrow manga page, not a squeezed spread

   Same compositional logic at a different aspect: the hero still
   dominates, the tone wedge still anchors the number, but panels run
   full-measure and the rhythm is carried by gutter size rather than
   by column width. Nothing here introduces a fixed width.
   ───────────────────────────────────────────────────────────────── */
/* The chamfer is a proportion of the panel, not a fixed bite. At 320px
   a 26px corner removes real estate the content needs; at 1440px the
   same 26px is invisible. One fluid value replaces the three states
   this used to have (26px / 18px / none), and it scales continuously
   instead of snapping at 400px and 900px. */
:root{--chamfer:clamp(12px,2.2vw,30px)}
.cut-br{clip-path:polygon(0 0, 100% 0, 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, 0 100%)}
.cut-tl{clip-path:polygon(var(--chamfer) 0, 100% 0, 100% 100%, 0 100%, 0 var(--chamfer))}

/* the tone wedge under the number follows the panel's aspect, so it
   anchors the figure on a tall narrow panel and on a wide one alike */
[data-screen="home"] .hero::after{width:min(78%,300px);height:64%}
[data-rank="lead"]{--ink-w:3.6}
.strike::after{opacity:.11}

@media(min-width:1024px){
  [data-screen="home"] .hero::after{width:min(62%,340px);height:58%;opacity:.45}
  [data-rank="lead"]{--ink-w:4.4}
  .strike::after{opacity:.14}
}

/* ─────────────────────────────────────────────────────────────────
   8. RANK ASSIGNMENT

   Which panel is the lead on each page. Done here rather than in the
   view functions so the markup stays markup — and so the hierarchy
   can be re-art-directed without touching logic.

   A page gets ONE lead. That is the whole point: if two panels shout,
   neither does.
   ───────────────────────────────────────────────────────────────── */
:root{--ink-w:2.8}                       /* default: mid */

[data-screen="home"] .hero{--ink-w:4.4}          /* the stamp count leads */
[data-screen="home"] .view > .head{--ink-w:1.6}  /* the nameplate is quiet */
[data-screen="home"] .view > .duo .panel{--ink-w:1.6}
[data-screen="home"] .seals{--ink-w:2.8}

[data-screen="record"] .rec--open{--ink-w:4.2}   /* the one you can act on */
[data-screen="record"] .rec--set{--ink-w:2}
[data-screen="record"] .rec--miss,
[data-screen="record"] .rec--upcoming{--ink-w:1.4}

[data-screen="scan"] .viewer{--ink-w:4.2}
[data-screen="scan"] .manual{--ink-w:2.4}

[data-screen="board"] .qrpanel{--ink-w:4.2}

[data-screen="profile"] .stat{--ink-w:1.6}

/* ─────────────────────────────────────────────────────────────────
   9. CROPPED TONE IN THE SUPPORTING PANELS

   Tone laid into a corner and cut on the diagonal, so the supporting
   panels have material in them without competing with the lead. The
   wedge is absolutely positioned and masked, so it adds no height and
   cannot push anything out of the viewport.
   ───────────────────────────────────────────────────────────────── */
.seals{position:relative;isolation:isolate}
.seals::after{content:"";position:absolute;right:0;top:0;
  width:min(46%,300px);height:74%;
  background-image:var(--tone-dot-b);background-size:var(--tone-cell-b);
  opacity:.32;z-index:0;
  clip-path:polygon(22% 0, 100% 0, 100% 100%, 0 100%);
  -webkit-mask-image:linear-gradient(to bottom left, #000 0%, transparent 78%);
  mask-image:linear-gradient(to bottom left, #000 0%, transparent 78%)}
/* `.sfx` must stay excluded from every `> *` rule in this file: it is
   absolutely positioned by design, and a two-class descendant selector
   outranks its own one-class rule and drags it into flow. */
.seals > *:not([data-layer]){position:relative;z-index:1}

/* the record page's live row gets a tone band so the actionable entry
   reads as figure against the confirmed rows' ground */
[data-screen="record"] .rec--open{position:relative;isolation:isolate}
[data-screen="record"] .rec--open::after{content:"";position:absolute;
  inset:0 0 0 auto;width:min(52%,420px);
  background-image:var(--tone-dot-a);background-size:var(--tone-cell-a);
  opacity:.4;z-index:0;
  -webkit-mask-image:linear-gradient(to left, #000 0%, transparent 88%);
  mask-image:linear-gradient(to left, #000 0%, transparent 88%)}
[data-screen="record"] .rec--open > *:not([data-layer]){position:relative;z-index:1}

/* ─────────────────────────────────────────────────────────────────
   10. THE CHAPTER NAMEPLATE

   Chapter openings in manga are a rule and a number, not a boxed
   header. The panel border is dropped in favour of a heavy baseline
   rule that the title sits on, which also frees the vertical space
   the old boxed header was spending on nothing.
   ───────────────────────────────────────────────────────────────── */
.view > .head{border-bottom:0}
.view > .head::after{content:"";position:absolute;left:0;right:0;bottom:0;
  height:3px;background:var(--ink);z-index:1}
[data-screen="home"] .view > .head::after{height:2px}

/* ─────────────────────────────────────────────────────────────────
   11. AUTH PANEL

   Built from the page's own parts — panel, rule, screentone, ink —
   so signing in reads as the first page of the book rather than a
   form bolted onto the front of it. No new colour: the only values
   here are ink, paper and the greys already in the scale.
   ───────────────────────────────────────────────────────────────── */
[data-screen="auth"] .view{max-width:640px}
[data-screen="auth"] .authp{--ink-w:4.2;position:relative;isolation:isolate;
  padding:var(--s6) var(--s5) var(--s5)}
[data-screen="auth"] .authp::after{content:"";position:absolute;
  right:0;top:0;width:min(38%,190px);height:44%;z-index:0;
  background-image:var(--tone-dot-a);background-size:var(--tone-cell-a);
  opacity:.26;clip-path:polygon(26% 0, 100% 0, 100% 100%, 0 100%);
  -webkit-mask-image:linear-gradient(to bottom left, #000 0%, transparent 76%);
  mask-image:linear-gradient(to bottom left, #000 0%, transparent 76%)}
[data-screen="auth"] .authp > *:not([data-layer]){position:relative;z-index:1}

.authp__f{display:block;margin-bottom:var(--s4)}
.authp__f .kicker{display:block;margin-bottom:6px}
.authp .input{width:100%;box-sizing:border-box;min-width:0}

.authp__err{margin:0 0 var(--s4);padding:9px 12px;
  border-left:4px solid var(--ink);background:var(--v1);
  font:500 12.5px/1.45 var(--f-body);color:var(--ink)}

.authp__act{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.authp__act .btn--go{min-height:44px;padding:0 var(--s5)}
.authp__act .btn--go[disabled]{opacity:.55;cursor:progress}
.authp__note{margin:var(--s5) 0 0}

/* The action row is full-width where a thumb reaches for it and
   natural-width where a cursor does — and it wraps rather than
   overflowing in between. */
[data-screen="auth"] .authp{padding:var(--s5) var(--s4) var(--s4)}
.authp__act{gap:var(--s3)}
.authp__act .btn--go{flex:1 1 100%;justify-content:center}
@media(min-width:768px){
  [data-screen="auth"] .authp{padding:var(--s6) var(--s5) var(--s5)}
  .authp__act{gap:var(--s4)}
  .authp__act .btn--go{flex:0 0 auto;min-width:12ch}
}

/* Signed out there is nothing to navigate to — every chapter bounces
   straight back to this screen — so the rail and tab bar are hidden
   rather than offered and refused. The auth spread becomes the whole
   page, which is also why it reads as the first page of the book. */
[data-screen="auth"] .rail__nav,
[data-screen="auth"] #railInd,
[data-screen="auth"] .tabs,
[data-screen="auth"] .pageno{display:none}
[data-screen="auth"] main#view{padding-bottom:var(--space-chapter)}

/* ─────────────────────────────────────────────────────────────────
   12. BOARD

   Administration built from the same parts as the member spreads:
   panels, rules, screentone, ink. State is carried by weight, case
   and a rule — never by a coloured badge, because there is no colour
   in this system to spend on it.
   ───────────────────────────────────────────────────────────────── */
.bpanel{--ink-w:3.2;position:relative;padding:var(--s5)}
.bpanel--wait{opacity:.7}
.bempty{margin:var(--s4) 0;font-size:13px}
.bsec{margin:var(--s6) 0 var(--s3);padding-bottom:6px;
  border-bottom:2px solid var(--ink)}

/* figures first: the numbers are the point of the overview */
.bstats{display:grid;gap:var(--s3);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr))}
.bstats--tight{grid-template-columns:repeat(auto-fit,minmax(min(100%,108px),1fr))}
.bstat{padding:var(--s4);border:var(--rule-hair) solid var(--ink)}
.bstat b{display:block;font-family:var(--f-display);font-weight:400;
  font-size:clamp(22px,2.4vw,30px);line-height:1;letter-spacing:-.02em}
.bstat span{display:block;margin-top:var(--s3);font:500 10px/1.3 var(--f-label);
  letter-spacing:.18em;text-transform:uppercase;color:var(--tone)}

.bactive{margin-top:var(--s6);padding-top:var(--s5);border-top:2px solid var(--ink)}
.bactive__no{font-family:var(--f-display);font-size:clamp(30px,4vw,52px);
  line-height:1;margin:6px 0 4px}
.bactive__no--off{color:var(--v3)}

/* THE REGISTER.

   One component, four row shapes: a meeting (id, when, state, count,
   delete), a member (who, stamps, rewards), a reward (name, state) and
   a delete confirmation (what, the two buttons). It was a four-column
   grid with per-shape column overrides in two different files, which
   fought each other — the meeting row ended up with its identifier,
   its date and its state each on a line of their own and the count
   stranded beside an empty box.

   A wrapping flex row describes all four without knowing which one it
   has: the middle block takes the slack, everything else takes its own
   width, and the identifier leads its own line while the column is
   narrow. */
.blist{list-style:none;margin:0;padding:0}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);
  padding:var(--s4) 0;border-bottom:var(--rule-hair) solid var(--v2);
  cursor:pointer;min-width:0}
.brow > *{flex:none;min-width:0}
.brow__no{flex:1 0 100%}
.brow__mid{flex:1 1 12ch}
@media(min-width:768px){
  .brow{flex-wrap:nowrap;padding:var(--s3) 0}
  .brow__no{flex:none}
}
/* Both halves of a register row are declared `role="button"` in the
   markup, and the identifier is a single 16px line of mono. A pointer
   gets the 24px floor that keeps it a real target without changing how
   the row looks; a finger gets the same 44px floor every other control
   in the app takes. */
.brow__no,.brow__mid{display:flex;flex-direction:column;justify-content:center;
  min-height:24px}
@media (pointer:coarse){
  .brow__no,.brow__mid{min-height:var(--tap)}
}
.brow--reward{cursor:default}
.brow:last-child{border-bottom:0}
.brow:hover,.brow:focus-visible{background:var(--v1);outline:0}
.brow__no{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;
  color:var(--tone);white-space:nowrap}
.brow__mid{min-width:0}
.brow__mid b{display:block;font-size:14px}
.brow__mid .muted{display:block;font-size:12px;margin-top:2px}
.brow__n{font-family:var(--f-display);font-size:19px;line-height:1;text-align:right}
.brow__sub{font-size:11px;font-family:var(--f-mono)}

/* state without colour: filled, outlined, or quiet */
.bstate{font:500 9.5px/1 var(--f-mono);letter-spacing:.16em;
  padding:5px 8px;white-space:nowrap;border:1.5px solid var(--ink)}
.bstate--open{background:var(--ink);color:var(--paper)}
.bstate--upcoming{background:none;color:var(--ink)}
.bstate--ended,.bstate--past{background:none;color:var(--v3);border-color:var(--v3)}

.bdetail__name{font-family:var(--f-display);font-size:clamp(26px,3.4vw,42px);
  line-height:1;margin:4px 0 var(--s5);text-transform:uppercase;letter-spacing:-.03em}

.bfilters{display:grid;gap:var(--s3);grid-template-columns:2fr 1fr;
  margin-bottom:var(--s4)}
.bfilters .input{width:100%;box-sizing:border-box;min-width:0}
.bpage{display:flex;align-items:center;justify-content:space-between;
  gap:var(--s3);margin-top:var(--s5);padding-top:var(--s4);
  border-top:2px solid var(--ink);flex-wrap:wrap;font-size:12px}

.bform{margin-bottom:var(--s6);padding-bottom:var(--s5);
  border-bottom:2px solid var(--ink)}
.bform__rule{font-size:12.5px;margin:0 0 var(--s4)}
.bform__grid{display:grid;gap:var(--s3);
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bform .field{display:block;min-width:0}
.bform .kicker{display:block;margin-bottom:5px}
.bform .input{width:100%;box-sizing:border-box;min-width:0}
.bform .btn{margin-top:var(--s4)}

.bcount{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s5) 0 var(--s3)}
.bcount b{font-family:var(--f-display);font-size:clamp(28px,3.6vw,44px);line-height:1}
.picker--sub{margin-bottom:0}

/* A register of dense rows is a sideways table on a narrow column and a
   readable table on a wide one. The base is the stacked block; the
   columns come back at the tablet tier.

   The form grid was `repeat(auto-fit,minmax(150px,1fr))` with two
   width overrides fighting it. auto-fit already answers the question —
   the floor just has to be one the narrowest column can hold, and
   `min(100%,...)` stops a 150px floor from overflowing a 140px
   column, which is what forced the 400px exception. */
.bpanel{padding:var(--s4)}
.bfilters{grid-template-columns:1fr}
.bform__grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.bpage{justify-content:center}

@media(min-width:768px){
  .bpanel{padding:var(--s5)}
  .bfilters{grid-template-columns:2fr 1fr}
  .bpage{justify-content:space-between}
}

/* ─────────────────────────────────────────────────────────────────
   13. SETUP NOTICE

   A developer-facing message, built from the same parts as everything
   else so it does not look like a browser error dropped into the page.
   Screentone marks it as an aside rather than content.
   ───────────────────────────────────────────────────────────────── */
.setupbox{margin-top:var(--s5);padding:var(--s4);
  border:var(--rule-hair) solid var(--ink);position:relative;isolation:isolate;
  background-image:var(--tone-dot-a);background-size:var(--tone-cell-a)}
.setupbox > *{position:relative;z-index:1}
.setupbox p{margin:0 0 8px;font-size:12.5px;line-height:1.55;
  background:var(--paper);display:inline-block;padding:1px 3px}
.setupbox p:last-child{margin-bottom:0}
.setupbox__hint{color:var(--tone)}
.setupbox code{font-family:var(--f-mono);font-size:11.5px;
  border-bottom:1px solid var(--v3)}
/* a failed connection is a heavier statement than a missing one */
.setupbox--warn{border-width:var(--rule);background-image:none}

/* ── BOARD: club information hub ──────────────────────────────────
   The board is another page of the same manga, so everything below
   reuses the panel rules, the display face and the two inks. No new
   palette, no cards, no gradients. */
.bident{padding-bottom:var(--s5);border-bottom:2px solid var(--ink)}
.bident__mark{font-family:var(--f-display);font-weight:400;line-height:.95;
  font-size:clamp(34px,5.2vw,58px);margin:var(--s3) 0 0;letter-spacing:-.01em}
.bident__say{margin:var(--s4) 0 0;font-size:14px;max-width:54ch}
.bident__when{margin:var(--s3) 0 0;font:500 11px/1.5 var(--f-mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

.bnext{padding:var(--s5);border:var(--rule-hair) solid var(--ink)}
/* live state is carried by the heavier rule and the filled tag, not by
   colour alone — the tag still reads CHECK-IN OPEN in monochrome */
.bnext--live{border-width:var(--edge-heavy)}
.bnext__state{display:flex;align-items:center;gap:var(--s3);
  flex-wrap:wrap;margin-top:var(--s4)}
.bnext__state .muted{font-size:12px}

.bnote{margin-top:var(--s4);font-size:11.5px;line-height:1.5;max-width:56ch}

.bmiles{margin-top:var(--s2)}
.bmile{display:grid;grid-template-columns:auto 1fr;align-items:start;
  gap:var(--s4);padding:var(--s4) 0;border-bottom:var(--rule-hair) solid var(--tone)}
.bmile:last-child{border-bottom:0}
.bmile__no{font-family:var(--f-display);font-size:clamp(24px,3vw,34px);
  line-height:1;min-width:2.2ch;text-align:right}
.bmile__mid{min-width:0}
.bmile__mid b{display:block;font-size:14px}
.bmile__mid .muted{display:block;font-size:12px;margin-top:2px}
.bmile__bar{display:block;height:8px;margin-top:var(--s3);
  border:var(--rule-hair) solid var(--ink);background:var(--paper)}
.bmile__fill{display:block;height:100%;background:var(--ink)}

.bmile{gap:var(--s3)}
.bident__say{font-size:clamp(13.5px,3.4vw,15px)}
@media (min-width:768px){.bmile{gap:var(--s4)}}

/* ── QR: one static code per meeting, sized to be scanned ─────────
   The code is now the page. It is bigger than the old rotating one
   because it has to read from the back of the MPR, and the quiet zone
   around it is padding on a white field — a QR needs that margin to
   decode reliably, so it is not decoration to trim. */
.qrpanel__code--big{max-width:min(660px,86vw);padding:var(--s6)}
/* The base rule is `display:grid; place-items:center`, which sizes the
   grid track to the SVG's own intrinsic width. `width:100%` on the SVG
   then resolves against a track that is itself sized by the SVG -- so it
   collapses to the intrinsic 43-unit viewBox instead of filling the
   panel. Switching to block layout gives the percentage a real box to
   resolve against. */
.qrpanel__code--big{display:block}
.qrpanel__code--big svg,
.qrpanel__code--big canvas,
.qrpanel__code--big img{width:100%!important;height:auto!important;
  aspect-ratio:1/1;display:block;margin-inline:auto}
.qrpanel__code--big{max-width:100%;padding:var(--s5)}
@media(min-width:768px){
  .qrpanel__code--big{max-width:min(660px,86vw);padding:var(--s6)}
}

/* ── delete a meeting ─────────────────────────────────────────────
   The action sits in the row it affects and confirms in place, so no
   modal layer is introduced and nothing is dismissed by a stray tap
   outside it. Only rows with zero attendance render the control. */
.brow__del{border:var(--rule-hair) solid var(--ink);background:none;
  color:var(--ink);font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;padding:6px 9px;cursor:pointer}
.brow__del:hover,.brow__del:focus-visible{background:var(--ink);color:var(--paper)}
/* Rows without a delete control still reserve its width, so the count
   column stays true down the register. `visibility:hidden` keeps the
   box and its generated text out of the accessibility tree and off the
   page while still taking up exactly as much room as the real
   control — a 1px stub left the counts stepping in and out. */
.brow__del--off{visibility:hidden}
.brow__del--off::before{content:"Delete"}
.brow--confirm{background:var(--v1)}
.bconfirm{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.bconfirm .btn{padding:8px 14px;font-size:11px}
/* The confirm pair wraps to its own line when the row cannot hold it,
   which is a question about the row rather than about the device. */
.bconfirm{flex:1 1 100%;margin-top:var(--s3)}
.bconfirm .btn{flex:1 1 auto}
@media(min-width:768px){
  .bconfirm{flex:0 1 auto;margin-top:0}
  .bconfirm .btn{flex:0 0 auto}
}

/* ══════════════════════════════════════════════════════════════════
   THE NAVIGATION PILLAR

   The numeral leads and the label sits under it on its own baseline,
   so the column reads as a contents page rather than as a menu. The
   active state is a STRUCTURAL LINE that runs from the numeral out
   through the pillar's edge and into the canvas — the chapter you are
   in is physically connected to the sheet, which is a thing a grey
   pill can never say.
   ══════════════════════════════════════════════════════════════════ */
@media(min-width:1024px){
  .rail__link{grid-template-columns:1fr!important;
    align-items:start!important;gap:2px!important;
    padding:clamp(10px,1.1vw,16px) var(--s3) clamp(10px,1.1vw,16px) 0!important}
  .rail__no{font-size:clamp(30px,2.9vw,50px)!important;
    justify-self:start;width:max-content}
  .rail__link span:not(.rail__no){font-size:clamp(9.5px,.72vw,11px);
    letter-spacing:.3em;align-self:start}
  /* the connector: out of the numeral, through the rule, into the page */
  /* the connector leaves the pillar at the numeral's own baseline */
  .rail__link[aria-current="page"]::before{
    right:calc(var(--s3) * -1 - 2px);top:auto;
    bottom:calc(100% - clamp(30px,2.9vw,50px) - clamp(10px,1.1vw,16px));
    width:calc(var(--s3) + 40px);height:var(--edge)}
  /* No underline on the numeral: it landed exactly where the label
     sits and the two collided. The connector out to the canvas is the
     active mark, and it is a better one — it says which chapter the
     sheet belongs to rather than just which item is selected. */
  .rail__link span:not(.rail__no){margin-top:3px}
}

/* ══════════════════════════════════════════════════════════════════
   MEMBER — THE FIGURES ARE NOT FOUR CARDS

   Four bordered plates in a 2x2 grid is an admin dashboard, and it is
   what the Member page opened its content with. The figures are a
   ruled strip now: one leads at display size, the other three are
   readings under it, divided by hairlines rather than boxed.
   ══════════════════════════════════════════════════════════════════ */
/* the credential band and the milestone ledger were the last two
   boxes on the page; they are divisions of the sheet like everything
   else now */
[data-screen="profile"] .who,
[data-screen="profile"] .panel--flat{border:0;background:none;height:auto;
  position:relative;padding:clamp(16px,2.2vw,26px) 0 clamp(16px,2.2vw,26px)}
[data-screen="profile"] .who::before,
[data-screen="profile"] .panel--flat::before{content:"";position:absolute;
  left:0;right:0;top:0;height:var(--edge-thin);background:var(--ink)}
[data-screen="profile"] .ledger{border-top:0;margin-top:clamp(10px,1.4vw,16px)}

[data-screen="profile"] .stats{display:grid;gap:0;
  grid-template-columns:repeat(2,minmax(0,1fr));
  border-top:var(--edge) solid var(--ink)}
[data-screen="profile"] .stat{border:0;background:none;
  padding:clamp(14px,2vw,22px) clamp(12px,1.6vw,20px) clamp(14px,2vw,22px) 0;
  border-bottom:var(--rule-hair) solid var(--v3)}
[data-screen="profile"] .stat + .stat{padding-left:clamp(12px,1.6vw,20px);
  border-left:var(--rule-hair) solid var(--v3)}
[data-screen="profile"] .stat[data-rank="lead"]{grid-column:1/-1;
  border-left:0;padding-left:0;border-bottom-color:var(--ink);
  border-bottom-width:var(--edge-thin)}
[data-screen="profile"] .stat[data-rank="lead"] b{
  font-size:clamp(54px,9vw,116px);line-height:.82}
@media(min-width:768px){
  [data-screen="profile"] .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  [data-screen="profile"] .stat:nth-child(2){padding-left:0;border-left:0}
}

/* ══════════════════════════════════════════════════════════════════
   EMPTY STATES — THE UNSTRUCK SEAL

   Not a grey box with a centred paragraph. The seal that has not been
   pressed, drawn at a size that makes it the subject, with the record
   it would carry stated beside it as metadata. The void mark across
   its middle is what says "nothing here" — a structural signal, not a
   sentence and not a colour.
   ══════════════════════════════════════════════════════════════════ */
.empty-reg{position:relative;padding:clamp(28px,5vw,64px) 0 clamp(24px,4vw,52px)}
.empty-reg::before{content:"";position:absolute;left:0;right:0;top:0;
  height:var(--edge-thin);background:var(--v3)}
.empty{display:grid;gap:clamp(16px,3vw,34px);align-items:center;
  grid-template-columns:auto minmax(0,1fr);
  border:0;background:none;padding:0;min-height:0}
.empty__seal{position:relative;flex:none;
  width:clamp(74px,12vw,132px);aspect-ratio:1}
.empty__seal svg{width:100%;height:100%;display:block;opacity:.5}
.empty__seal svg circle,.empty__seal svg polygon,
.empty__seal svg path,.empty__seal svg line{
  fill:none;stroke:var(--v3);stroke-width:2;vector-effect:non-scaling-stroke}
/* the void: the seal is present, the mark inside it is not */
.empty__void{position:absolute;left:50%;top:50%;width:56%;height:var(--edge-thin);
  background:var(--v3);transform:translate(-50%,-50%) rotate(-32deg)}
.empty__body{min-width:0}
.empty__title{font-family:var(--f-display);text-transform:uppercase;
  font-size:clamp(17px,2.4vw,30px);line-height:1.02;letter-spacing:-.01em;
  margin-top:clamp(7px,1vw,11px);color:var(--ink)}
.empty__note{margin-top:clamp(7px,1vw,11px);max-width:52ch;
  font-size:clamp(12.5px,1vw,14.5px);line-height:1.55;color:var(--ink-2)}

/* the scanner's dead end, same language inside the frame */
.viewer .stall{display:grid;justify-items:start;align-content:center;
  gap:clamp(8px,1.2vw,13px);
  padding:clamp(20px,4vw,44px);max-width:52ch;width:100%}
.stall__title{font-family:var(--f-display);text-transform:uppercase;
  font-size:clamp(16px,2.2vw,26px);line-height:1.04;color:var(--ink)}
.stall__note{font-size:clamp(12.5px,1vw,14.5px);line-height:1.55;color:var(--ink-2)}

/* ══════════════════════════════════════════════════════════════════
   SCAN — THE VIEWFINDER AND THE TERMINAL

   The frame reads as an instrument now rather than as a panel with a
   camera in it: the targeting brackets are heavy and set INSIDE the
   frame, so the box has a housing and a target rather than one edge
   doing both jobs.

   The manual field was a bordered box holding an input and a dashed
   ghost button — a form. It is a terminal: a rule under the line, the
   prompt in front of it, the commit struck solid. And exactly ONE red
   mark on the screen, which is the target; the rule and the prompt
   were both cinnabar too, so a screen with a fault code on it was
   showing three.
   ══════════════════════════════════════════════════════════════════ */
.viewer::after{--bracket:clamp(26px,4.4vw,56px);--bracket-w:var(--edge-heavy)}

.manual{border:0;background:none;padding:clamp(18px,2.4vw,30px) 0 0;
  position:relative}
.manual::before{content:"";position:absolute;left:0;right:0;top:0;
  height:var(--edge-thin);background:var(--ink)}
.manual .kicker{display:flex;align-items:flex-start;gap:9px}
.manual .kicker::before{content:"";flex:none;margin-top:.45em;
  width:clamp(10px,1.4vw,20px);height:var(--rule-hair);background:currentColor}
/* the line: ink, not cinnabar — red is the target's, and only the
   target's. It thickens on focus rather than changing colour. */
.manual .input{border-bottom-color:var(--ink);border-bottom-width:var(--edge-thin)}
.manual .field:focus-within .input{border-bottom-width:var(--edge)}
/* the commit is struck, not dashed. A dashed border reads disabled. */
.manual .btn{border-style:solid;border-width:var(--edge-thin);
  background:var(--ink);color:var(--paper);min-height:48px}
.manual .btn:hover,.manual .btn:focus-visible{background:var(--paper);color:var(--ink)}

/* ══════════════════════════════════════════════════════════════════
   THE REWARD DOSSIER

   State IS the design here — the three tiers must not be three of the
   same object. Sealed is a document you have not earned and reads as
   one: unframed, quiet, its numeral in tone. Ready takes the page's
   only frame and its only red mark. Claimed floods to ink, which is
   where this screen spends its concentrated black.
   ══════════════════════════════════════════════════════════════════ */
[data-screen="rewards"] .dossier .panel,
.dossier .panel{border:0;background:none;height:auto;position:relative;overflow:visible;
  display:grid;gap:clamp(9px,1.2vw,14px);
  padding:clamp(18px,2.4vw,30px) 0 clamp(18px,2.4vw,28px);
  grid-template-columns:auto 1fr;align-items:start}
.dossier__idx{grid-row:1/span 4;align-self:start;
  --idx-size:clamp(30px,4.4vw,64px);
  padding-right:clamp(12px,1.8vw,24px);
  border-right:var(--rule-hair) solid var(--v3);
  margin-right:clamp(12px,1.8vw,24px)}
.dossier__head{grid-column:2;display:flex;align-items:baseline;
  justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.dossier__at{grid-column:2;margin-top:-4px;
  font:500 clamp(10.5px,1vw,12.5px)/1.3 var(--f-mono);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.dossier__legend{grid-column:2;display:flex;justify-content:space-between;
  gap:var(--s3);flex-wrap:wrap}
.dossier__claim{grid-column:2;margin-top:clamp(4px,.8vw,8px)}

/* the slot array — the same instrument the card on Home uses */
.dslots{grid-column:2;display:grid;
  grid-template-columns:repeat(var(--dcells,10),minmax(0,1fr));
  gap:clamp(3px,.5vw,6px)}
.dslot{height:clamp(16px,2vw,26px);
  box-shadow:inset 0 0 0 var(--rule-hair) var(--v3)}
.dslot--set{background:var(--ink);box-shadow:none}

/* ── SEALED: a division of the sheet, nothing more ── */
.dossier--sealed{position:relative}
.dossier--sealed::before{content:"";position:absolute;left:0;right:0;top:0;
  height:var(--edge-thin);background:var(--v3)}
.dossier--sealed .tech__name{color:var(--ink-2)}

/* ── READY: the one frame and the one red mark on the page ── */
.dossier--ready .panel{border:var(--edge-heavy) solid var(--ink);
  background:var(--paper);
  padding:clamp(18px,2.4vw,30px) clamp(18px,2.4vw,30px) clamp(20px,2.6vw,32px)}
.dossier--ready .dossier__idx{color:var(--ink)}
.dossier--ready .dslot--set{background:var(--ink)}

/* ── CLAIMED: flooded. this is where the screen spends its black ── */
.dossier--claimed .panel{background:var(--v6);color:var(--paper);
  padding:clamp(18px,2.4vw,30px)}
.dossier--claimed .tech__name,
.dossier--claimed .dossier__idx{color:var(--paper)}
.dossier--claimed .dossier__at,
.dossier--claimed .kicker,
.dossier--claimed .anno{color:var(--v3)}
.dossier--claimed .dossier__idx{border-right-color:var(--v4)}
.dossier--claimed .dslot{box-shadow:inset 0 0 0 var(--rule-hair) var(--v4)}
.dossier--claimed .dslot--set{background:var(--paper)}

/* ══════════════════════════════════════════════════════════════════
   THE CHAPTER MASTHEAD

   Record, Scan, Rewards, Member and Club Tools each opened with the
   page title inside a bordered box the full width of the canvas — the
   same header card five times, and the first thing you see on four of
   the five screens. They are mastheads now, on the same structure
   Home's nameplate uses: one heavy rule, the title crossing it, the
   kicker set as an annotation in the margin. Five screens, one
   opening gesture, no frames.
   ══════════════════════════════════════════════════════════════════ */
.view > .head:not(.nameplate){border:0!important;background:none!important;
  position:relative;padding:clamp(16px,2.6vw,36px) 0 clamp(12px,1.8vw,22px);
  min-height:0;display:block}
.view > .head:not(.nameplate)::before{content:"";position:absolute;
  left:0;right:0;top:0;height:var(--edge-heavy);background:var(--ink)}
.view > .head:not(.nameplate) .head__stack{margin-left:calc(var(--bleed-l,0px) * -1)}
.view > .head:not(.nameplate) .title{font-size:var(--t-chapter);
  line-height:.84;letter-spacing:-.04em}
.view > .head:not(.nameplate) .kicker{position:static;display:inline-flex;
  align-items:center;gap:7px;margin-top:clamp(8px,1.2vw,13px);
  font:500 clamp(9.5px,.95vw,11px)/1 var(--f-mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-2)}
.view > .head:not(.nameplate) .kicker::before{content:"";
  width:clamp(10px,1.4vw,20px);height:var(--rule-hair);background:currentColor}
:root{--t-chapter:clamp(38px,10vw,84px)}
@media(min-width:1024px){ :root{--t-chapter:clamp(56px,6.4vw,112px)} }

/* ══════════════════════════════════════════════════════════════════
   THE ACTION CHAMBER

   A target, not a card. Three layers, in this order from the back:
   speed lines running toward the centre, a crosshair on the point
   itself, and the commit. The brackets sit outside all of it and
   close inward when you reach for it — the chamber locking on.

   The verb stays a real word ("Scan code") and the commit is [ SCAN ]
   in the page's own bracket vocabulary; the small arrow glyph that
   used to live in the corner is gone, because an arrow in a corner is
   an affordance and this is supposed to be a target.
   ══════════════════════════════════════════════════════════════════ */
.strike{display:grid;grid-template-rows:auto 1fr auto auto;
  gap:clamp(10px,1.6vw,18px);align-items:stretch;
  min-height:clamp(220px,30vw,340px);
  padding:clamp(16px,2.4vw,30px)}
/* speed lines, converging on the crosshair rather than filling a box */
.strike::before{
  background-image:repeating-linear-gradient(68deg,
    var(--ink) 0 1px, transparent 1px 9px);
  opacity:.13;
  -webkit-mask-image:radial-gradient(circle at 50% 46%, #000 0 8%, transparent 62%);
          mask-image:radial-gradient(circle at 50% 46%, #000 0 8%, transparent 62%)}
.strike__head{grid-row:1;justify-self:start}
.strike__core{grid-row:2;align-self:stretch;display:grid;place-items:center;
  position:relative;z-index:2;min-height:clamp(60px,12vh,150px)}
.strike__core .xhair{--xh:clamp(30px,4.4vw,58px);color:var(--ink)}
.strike__body{grid-row:3;justify-self:start;align-self:end}
/* The commit gets its own row across the full measure. Side by side
   with the verb it collided the moment the chamber was narrow — and
   a full-width bar is the right answer anyway: this is the control a
   member hits one-handed, standing up, in a room. */
.strike__go{grid-row:4;justify-self:stretch;text-align:center;
  font:700 clamp(12px,1.3vw,15px)/1 var(--f-mono);letter-spacing:.22em;
  background:var(--ink);color:var(--paper);
  padding:clamp(13px,1.6vw,18px) clamp(12px,1.6vw,20px);
  min-height:48px;display:grid;place-items:center;
  white-space:nowrap}
/* reaching for it: the brackets close, the target goes cinnabar, the
   commit inverts. One cut, no travel. */
.strike:hover .strike__core .xhair,
.strike:focus-visible .strike__core .xhair{color:var(--seal)}
.strike:hover .strike__go,
.strike:focus-visible .strike__go{background:var(--paper);color:var(--ink);
  box-shadow:inset 0 0 0 var(--edge-thin) var(--ink)}
.strike--live .strike__head .anno{color:var(--seal)}

/* ══════════════════════════════════════════════════════════════════
   HOME — ONE SHEET, FOUR CHAMBERS

   The dashboard was six bordered boxes stacked with one gutter
   between them: nameplate, count, chamber, stamp array, and two
   closers. Every one the same weight, every one aligned to the same
   two edges. That is a tray of cards however manga the contents are,
   and it is the single reason the page reads as SaaS.

   It is a sheet divided by rules now. The count and the stamp array
   are ONE chamber — the number states the total and the array is that
   total made physical, so putting them in separate cards was saying
   they were separate facts. The closers lose their frames entirely
   and become registered divisions. The action chamber keeps a frame,
   because it is the one thing on the page you are meant to hit, and
   the frame is what makes it a target rather than a region.
   ══════════════════════════════════════════════════════════════════ */

/* ── the count chamber: no card, no chamfer, no ink block ────────── */
[data-screen="home"] .view > section:nth-of-type(1) .panel{
  background:none;border:0;clip-path:none;padding:0;height:auto}
[data-screen="home"] .view > section:nth-of-type(1) .panel::before{display:none}
[data-screen="home"] .view > section:nth-of-type(1){
  padding:clamp(20px,3vw,44px) 0 clamp(14px,2vw,26px)}

/* the tone wedge sat UNDER the count and its label, and at these
   sizes a screentone behind 11px mono makes the label unreadable —
   texture has to have a job, and "sit behind the words" is not one.
   It moves out to the right of the figure, where it reads as the
   pressure the number is under rather than as noise on it. */
[data-screen="home"] .hero::after{left:auto;right:0;width:min(30%,200px);
  height:46%;top:auto;bottom:0;opacity:.42}
/* the reading in the top-right corner is a fact, so it gets clear
   paper to sit on rather than sharing it with the screentone */
[data-screen="home"] .hero__state{position:relative;z-index:3;
  background:var(--paper);padding-left:6px}
[data-screen="home"] .hero__label{color:var(--ink-2);position:relative;z-index:3}
[data-screen="home"] .hero__foot{margin-top:clamp(12px,1.8vw,20px)}
/* the sound effect is a layer, not a collision: it sits behind the
   figure and is cropped by the chamber's own bottom edge */
[data-screen="home"] .sfx--a{bottom:-6%;opacity:.11}
/* the ring, the dot wedge and the sound effect were all landing in
   the same square inch to the right of the figure. The ring is the
   one that says least — the stamp array below states the same thing
   with real data — so it goes. */
[data-screen="home"] .hero__ring{display:none}

/* ── the stamp array: directly on the paper ──────────────────────── */
[data-screen="home"] .view > section:nth-of-type(2) .panel{
  background:none;border:0;padding:0;height:auto}
[data-screen="home"] .view > section:nth-of-type(2){
  position:relative;padding:0 0 clamp(18px,2.6vw,34px)}
/* the tone wedge behind the array was decoration; the array is the
   subject and nothing sits behind it */
[data-screen="home"] .seals::after{display:none}
[data-screen="home"] .seals{padding:0}

/* ── the closers: registered divisions, not cards ────────────────── */
[data-screen="home"] .view > .duo > .rig .panel{
  background:none;border:0;height:auto;
  padding:clamp(16px,2.2vw,26px) 0 clamp(10px,1.4vw,18px)}
[data-screen="home"] .view > .duo > .rig{position:relative}
[data-screen="home"] .view > .duo > .rig::before{content:"";position:absolute;
  left:0;right:0;top:0;height:var(--edge-thin);background:var(--ink);z-index:0}
[data-screen="home"] .view > .duo > .rig::after{content:"";position:absolute;
  left:0;top:0;width:var(--edge-thin);height:clamp(12px,1.6vw,20px);
  background:var(--ink);z-index:0}
[data-screen="home"] .view > .duo > .rig:last-child::after{left:auto;right:0}
@media(min-width:1024px){
  [data-screen="home"] .view > .duo > .rig:last-child .panel{
    margin-right:0;border-right:0}
}

/* ══════════════════════════════════════════════════════════════════
   THE NAMEPLATE

   It was the member's name, set large, inside a bordered box the full
   width of the canvas — which is a header card, and a header card is
   what every product on the internet opens with. Enormous type that
   touches nothing is not structural; it is just big.

   So the frame is gone and the name is bled off the LEFT edge of the
   canvas: it starts outside the measure and crosses into it, sitting
   ON the register rule rather than inside anything. The rule stops
   where the name lands, so the type interrupts the sheet. The margin
   the name leaves on the right carries the two facts worth stating —
   system state, and how far there is to go.
   ══════════════════════════════════════════════════════════════════ */
.nameplate{position:relative;border:0!important;background:none!important;
  display:grid;grid-template-columns:1fr;align-items:end;
  padding:clamp(18px,3vw,40px) 0 clamp(14px,2vw,26px);
  overflow:visible}
.nameplate .head__stack{position:relative;z-index:2;
  /* out past the canvas edge — the one deliberate bleed on the page */
  margin-left:calc(var(--bleed-l, 0px) * -1)}
.nameplate .title--name{line-height:.82;letter-spacing:-.045em;
  font-size:var(--t-name-hero)}
.nameplate__rule{position:absolute;left:0;right:0;top:0;
  height:var(--edge-heavy);background:var(--ink);z-index:0}
.nameplate__meta{position:relative;z-index:2;
  display:flex;flex-wrap:wrap;align-items:baseline;
  gap:6px clamp(12px,2vw,26px);margin-top:clamp(8px,1.2vw,14px)}
.nameplate__line{font:500 clamp(11px,1.05vw,13px)/1.3 var(--f-mono);
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

:root{--t-name-hero:clamp(46px,12vw,132px); --bleed-l:0px}
@media(min-width:768px){ :root{--bleed-l:clamp(6px,1.2vw,18px)} }
@media(min-width:1024px){
  :root{--t-name-hero:clamp(76px,8.6vw,158px); --bleed-l:clamp(10px,1.6vw,26px)}
  .nameplate{padding-top:clamp(26px,3.4vw,54px)}
}

/* ══════════════════════════════════════════════════════════════════
   THE KEYSTAMP GRAPHIC LANGUAGE

   Seven primitives, each with ONE job. They are what makes Record and
   Scan and Rewards read as the same product while looking nothing
   alike — the alternative is decoration, which is what a symbol
   becomes the moment it appears somewhere it has no reason to be.

     .brk      targeting brackets — this area is a target
     .xhair    crosshair — the exact point of action
     .anno     technical annotation — a fact the system knows
     .idx      numeric index — this is item N of a series
     .rune     vertical edge metadata — live system state
     .speed    directional lines — force applied in a direction
     .reg      the register rule — a division of the sheet

   Every one is drawn in CSS off currentColor, so a primitive inverts
   correctly the moment it lands inside an ink field.
   ══════════════════════════════════════════════════════════════════ */

/* ── BRACKETS. Four corners, drawn with gradients on one box so a
   target needs no extra elements. --brk sets arm length, --brk-w
   weight, --brk-i how far inside the box they sit. */
.brk{position:relative}
.brk::before{content:"";position:absolute;z-index:2;pointer-events:none;
  inset:var(--brk-i,0);
  --brk:clamp(14px,2.2vw,28px);
  --brk-w:var(--edge);
  background-repeat:no-repeat;
  background-image:
    linear-gradient(currentColor 0 0),linear-gradient(currentColor 0 0),
    linear-gradient(currentColor 0 0),linear-gradient(currentColor 0 0),
    linear-gradient(currentColor 0 0),linear-gradient(currentColor 0 0),
    linear-gradient(currentColor 0 0),linear-gradient(currentColor 0 0);
  background-size:
    var(--brk) var(--brk-w),var(--brk-w) var(--brk),
    var(--brk) var(--brk-w),var(--brk-w) var(--brk),
    var(--brk) var(--brk-w),var(--brk-w) var(--brk),
    var(--brk) var(--brk-w),var(--brk-w) var(--brk);
  background-position:
    left top,left top, right top,right top,
    left bottom,left bottom, right bottom,right bottom}
.brk--heavy::before{--brk-w:var(--edge-heavy);--brk:clamp(20px,3vw,40px)}
.brk--seal::before{color:var(--seal)}

/* ── CROSSHAIR. A plus with a gap at the centre — the point is what
   you are aiming AT, so nothing is drawn on it. */
.xhair{position:relative;display:block;
  width:var(--xh,clamp(22px,3vw,38px));aspect-ratio:1;
  pointer-events:none}
.xhair::before,.xhair::after{content:"";position:absolute;background:currentColor}
.xhair::before{left:50%;top:0;bottom:0;width:var(--edge-thin);
  transform:translateX(-50%);
  -webkit-mask-image:linear-gradient(#000 0 34%,transparent 34% 66%,#000 66%);
          mask-image:linear-gradient(#000 0 34%,transparent 34% 66%,#000 66%)}
.xhair::after{top:50%;left:0;right:0;height:var(--edge-thin);
  transform:translateY(-50%);
  -webkit-mask-image:linear-gradient(90deg,#000 0 34%,transparent 34% 66%,#000 66%);
          mask-image:linear-gradient(90deg,#000 0 34%,transparent 34% 66%,#000 66%)}

/* ── ANNOTATION. A fact, set in mono, tied to what it describes by a
   short leader rule. Never a caption; always a reading. */
.anno{display:inline-flex;align-items:center;gap:7px;
  font:500 clamp(9.5px,.95vw,11px)/1 var(--f-mono);
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.anno::before{content:"";width:clamp(10px,1.4vw,20px);height:var(--rule-hair);
  background:currentColor;flex:none}
.anno--seal{color:var(--seal)}
