<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080807">
<title>Keystamp</title>
<meta name="description" content="Key Club attendance">

<!-- There is deliberately no tab icon: the retired Keystamp mark is
     gone and nothing replaces it. rel="icon" pointing at nothing stops
     the browser requesting /favicon.ico on its own. -->
<link rel="icon" href="data:,">
<link rel="manifest" href="site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:title" content="Keystamp">
<meta property="og:description" content="Key Club attendance">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Keystamp">
<meta name="twitter:description" content="Key Club attendance">


<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/keystamp.css">
<link rel="stylesheet" href="css/artdirection.css">
<link rel="stylesheet" href="css/identity.css">
</head>
<body>

<div class="ground" aria-hidden="true">
  <div class="arena" id="arena"></div>
  <div class="ground__tone"></div>
  <div class="ground__vig"></div>
  <div class="ground__grain"></div>
</div>

<div class="shell" id="shell">
  <aside class="rail">
    <div class="rail__brand" id="railBrand"></div>
    <nav class="rail__nav" id="railNav" aria-label="Main">
      <span class="rail__ind" id="railInd" aria-hidden="true"></span>
    </nav>
    <div class="rail__foot" id="railFoot"></div>
  </aside>

  <div>
    <header class="topbar">
      <div id="barBrand"></div>
      <div style="display:flex;gap:8px">
        <button class="motion-btn" id="motionBtn" aria-pressed="false"></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabs" id="tabs" aria-label="Main">
  <span class="tabs__ind" id="tabsInd" aria-hidden="true"></span>
</nav>

<div class="verdict" id="verdict" role="status" aria-live="assertive" aria-label="Scan result">
  <div class="verdict__flare" id="vFlare"></div>
  <div class="verdict__ring" id="vRing"></div>
  <div class="verdict__ring" id="vRing2"></div>
  <div class="verdict__inner">
    <svg class="verdict__seal" id="vSeal" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <p class="verdict__state" id="vState">Sealed</p>
    <p class="verdict__title" id="vTitle">Stamp acquired</p>
    <p class="verdict__delta" id="vDelta">+1</p>
    <p class="verdict__meet" id="vMeet"></p>
  </div>
</div>

<svg class="fxdefs" aria-hidden="true">
  <defs>
    <!-- THE CUTS ARE INK.

         These were built for a dark ground: charcoal-lavender body
         (#1d1a25 → #4a4553), a white razor at the centre, a burgundy
         tail. Laid over paper they render as soft grey-violet smears
         with no edge — a blur, which is the one thing a manga cut is
         not. A cut on paper is solid black with a hard tip; the taper
         is in the SHAPE, not in the opacity ramp, so every stop below
         is doubled to a hard step. -->
    <linearGradient id="cutHeavy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset=".04"  stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset=".04"  stop-color="#0A0A0A" stop-opacity="1"/>
      <stop offset=".86"  stop-color="#0A0A0A" stop-opacity="1"/>
      <stop offset=".86"  stop-color="#0A0A0A" stop-opacity=".38"/>
      <stop offset=".96"  stop-color="#0A0A0A" stop-opacity=".38"/>
      <stop offset=".96"  stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
    <!-- the second cut of a cross: the same blade, less pressure -->
    <linearGradient id="cutThin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset=".07"  stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset=".07"  stop-color="#0A0A0A" stop-opacity=".9"/>
      <stop offset=".8"   stop-color="#0A0A0A" stop-opacity=".9"/>
      <stop offset=".8"   stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
    <!-- the afterimage: the same blade one frame behind, in tone -->
    <linearGradient id="cutGhost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset=".1"   stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset=".1"   stop-color="#0A0A0A" stop-opacity=".3"/>
      <stop offset=".78"  stop-color="#0A0A0A" stop-opacity=".3"/>
      <stop offset=".78"  stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div class="fx" id="fx" aria-hidden="true">
  <span class="scrim" id="scrim"></span>
  <span class="flash" id="flash"></span>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- The poster exists as ONE piece until the blade reaches it: the
     whole layer is what plays; the two clipped halves stay display:none
     until the cut's contact moment, when they replace it pixel-for-
     pixel and shear apart. -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="boot__whole"><div class="boot__poster">
    <span class="boot__seal"></span>
    <div class="boot__type">
      <p class="boot__kicker">Key Club attendance</p>
      <p class="boot__word">Keystamp</p>
    </div>
  </div></div>
  <div class="boot__half boot__half--a" style="display:none"><div class="boot__poster">
    <span class="boot__seal"></span>
    <div class="boot__type">
      <p class="boot__kicker">Key Club attendance</p>
      <p class="boot__word">Keystamp</p>
    </div>
  </div></div>
  <div class="boot__half boot__half--b" style="display:none"><div class="boot__poster">
    <span class="boot__seal"></span>
    <div class="boot__type">
      <p class="boot__kicker">Key Club attendance</p>
      <p class="boot__word">Keystamp</p>
    </div>
  </div></div>
</div>

<!-- ─────────────────────────────────────────────────────────────
     SCRIPTS — order matters, so no defer and no async.

     00-guard runs first and on its own. It is the reason a failure
     anywhere below shows you a message instead of a black screen.

     The three CDN libraries are third-party; if your school network
     blocks CDNs, download them into vendor/ and change these three
     src attributes to the local paths. The app degrades honestly
     without anime.js (Motion.off turns every animation into an
     instant state change) but it needs jsQR to scan.
     ───────────────────────────────────────────────────────────── -->
<script src="js/00-guard.js"></script>

<script src="vendor/jsQR.js"></script>
<!-- qrcode-generator (MIT, ~12KB): jsQR only *reads* codes, it cannot
     draw them, and the board screen has to produce a real scannable
     image. Note the filename: 1.4.4 ships qrcode.js, not qrcode.min.js
     — the .min.js path 404s, which is why the board screen was blank. -->
<script src="vendor/qrcode.js"></script>

<!-- anime.js v4.5.0 (MIT), vendored as the UMD build and loaded as an
     ordinary script. NOT an ES module: module scripts are fetched with CORS
     semantics, so they cannot load from a file:// page at all. This one
     works opened by double-click, from a subfolder, or served. -->
<script src="vendor/anime.umd.min.js"></script>
<script src="js/anime-bridge.js"></script>

<!-- ══════════════════════════════════════════════════════════════
     SUPABASE CONFIGURATION — THIS FILE IS THE SOURCE OF TRUTH.

     Put your project's URL and PUBLIC anon key here, then run
     `python3 build.py` to regenerate index.html. Editing index.html
     directly will be overwritten by the next build.

       <meta name="keystamp:supabase-url"
             content="https://abcdefgh.supabase.co">
       <meta name="keystamp:supabase-anon-key"
             content="eyJhbGciOi...">

     Both values are CLIENT-SAFE and are meant to be public: the anon
     key only works through row level security, which is on for every
     table. Never put SUPABASE_SERVICE_ROLE_KEY, ATTENDANCE_TOKEN_SECRET
     or BOARD_PASSWORD here — those are server-side only.

     build.py will also read KEYSTAMP_SUPABASE_URL / _ANON_KEY from the
     environment if set, so a deploy pipeline can inject them without
     editing this file. It never blanks values that are already here.

     Left empty in the repo on purpose. An unconfigured build shows a
     setup notice instead of pretending to work.
     ══════════════════════════════════════════════════════════════ -->
<meta name="keystamp:supabase-url" content="https://cibumatoeynnlwhyizzw.supabase.co">
<meta name="keystamp:supabase-anon-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpYnVtYXRvZXlubmx3aHlpenp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDQzNDgsImV4cCI6MjEwMjQ4MDM0OH0.3WSJGpoE5UnIP-UcILZnSZSEq-rd7ZJrwQdH1Eu-6fE">

<!-- The Supabase client itself. Without this the app cannot talk to
     Supabase at all, no matter what the meta tags say. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/01a-backend.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-motion.js"></script>
<script src="js/03-views.js"></script>
<script src="js/03b-board.js"></script>
<script src="js/04-fx.js"></script>
<script src="js/05-scan.js"></script>
<script src="js/06-app.js"></script>

<!-- ══════════════════════════════════════════════════════════════
     VERCEL WEB ANALYTICS
     Track page views and user interactions automatically when
     deployed to Vercel. The script is deferred to avoid blocking
     page load and uses the official Vercel CDN endpoint.
     ══════════════════════════════════════════════════════════════ -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
